name: Sync bookings to Google Calendar

on:
  schedule:
    # GitHub cron is UTC and can't express timezones. Copenhagen is UTC+1
    # (winter) / UTC+2 (summer), so we run at BOTH offsets for each target
    # local time (07:00, 12:00, 15:00). The script is idempotent (checks
    # gcal_event_id), so the extra runs are harmless no-ops.
    - cron: '0 5,6,10,11,13,14 * * *'
  workflow_dispatch: {}   # adds a manual "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync bookings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_HOST_KEY: ${{ secrets.SUPABASE_HOST_KEY }}
#          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          BOOKING_TIMEZONE: Europe/Copenhagen
        run: node scripts/sync-bookings.mjs
