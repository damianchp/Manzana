  const monthHeadCells = months.map(ym => `<div class="rm-month-cell ${ym===curYM?'rm-current':''}">${monthLabel(ym)}</div>`).join('');

  const rows = topics.map(topic => {
    const tasks = byTopic[topic].slice().sort((a,b)=>a.due.localeCompare(b.due));
    const dates = tasks.flatMap(t => [t.start, t.due].filter(Boolean));
    const minD = dates.reduce((m,d)=> (!m||d<m)?d:m, null);
    const maxD = dates.reduce((m,d)=> (!m||d>m)?d:m, null);
    const posMin = datePosInRange(minD, rm.startMonth, rm.months);
    const posMax = datePosInRange(maxD, rm.startMonth, rm.months);
    const openCount = tasks.filter(t=>!t.done).length;
    const color = topicColor(topic);
    const bandLeft = posMin.pct, bandWidth = Math.max(posMax.pct - posMin.pct, 1.4);
    const monthCells = months.map(ym => `<div class="rm-month-cell ${ym===curYM?'rm-current':''}"></div>`).join('');
    const markers = tasks.map(t => {
      const pos = datePosInRange(t.due, rm.startMonth, rm.months);
      const cls = t.done ? 'rm-done' : `rm-p-${t.priority||'none'}`;
      return `<button class="rm-marker ${cls}" style="left:${pos.pct}%" data-id="${t.id}" title="${esc(t.title)} · due ${fmtDue(t.due)}"></button>`;
    }).join('');
    return `<div class="roadmap-row">
      <div class="rm-label"><span class="topic-dot" style="background:${color}"></span>${esc(topic)} <span class="count">${openCount}/${tasks.length}</span></div>
      <div class="rm-track rm-task-track" data-topic="${esc(topic)}">
        ${monthCells}
        <div class="rm-band" style="left:${bandLeft}%;width:${bandWidth}%;background:${color}30;border-color:${color}"
             title="${esc(topic)}: ${fmtDue(minD)} → ${fmtDue(maxD)}"></div>
        ${posMin.overflow==='left' ? '<span class="rm-overflow-left">◀</span>' : ''}
        ${posMax.overflow==='right' ? '<span class="rm-overflow-right">▶</span>' : ''}
        ${markers}
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">No dated tasks yet — give a task a due date, or drag on the row below to create one.</div>`;

  const addTopicMonthCells = months.map(ym => `<div class="rm-month-cell ${ym===curYM?'rm-current':''}"></div>`).join('');
  const addTopicRow = `<div class="roadmap-row">
    <div class="rm-label" style="color:var(--ink-faint)">+ New topic</div>
    <div class="rm-track rm-task-track" data-topic="">
      ${addTopicMonthCells}
    </div>
  </div>`;

  return `<div class="roadmap-wrap">
    <div class="roadmap-toolbar">
      <div class="rm-range-tabs" id="rmRangeTabs">${rangeBtns}</div>
      <div class="spacer"></div>
      <button class="cal-nav" data-rmnav="-1" aria-label="Earlier">‹</button>
      <button class="chip-btn" id="rmTodayBtn" style="background:#eef0f4;color:var(--ink)">Today</button>
      <button class="cal-nav" data-rmnav="1" aria-label="Later">›</button>
    </div>
    <div class="cal-legend" style="border:1px solid var(--line);border-radius:10px;padding:8px 12px">
      <span class="key"><span class="swatch" style="background:var(--hi)"></span>High</span>
      <span class="key"><span class="swatch" style="background:var(--md)"></span>Medium</span>
      <span class="key"><span class="swatch" style="background:var(--lo)"></span>Low</span>
      <span class="key"><span class="swatch" style="border:1.4px solid var(--gcal);background:#fff"></span>Calendar event</span>
      <span style="margin-left:auto;color:var(--ink-faint)">Drag the 📅 Calendar row for an event, or a topic row for a task — click anything existing to see its details</span>
    </div>
    <div class="roadmap-panel">
      <div class="roadmap-header"><div class="rm-label-head"></div><div class="rm-months-head">${monthHeadCells}</div></div>
      <div class="roadmap-body">${calRow}${rows}${addTopicRow}</div>
    </div>
    ${undatedCount ? `<div class="empty-note">${undatedCount} task${undatedCount===1?'':'s'} without a due date ${undatedCount===1?'isn\u2019t':'aren\u2019t'} shown here — add a due date in the task drawer to place ${undatedCount===1?'it':'them'} on the timeline.</div>` : ''}
  </div>`;
}

/* =====================================================================
   FINANCE — a personal money tab pulling the best of three tools:
   • Ivy Wallet: multiple accounts, icon+color categories, a fast
     transaction quick-add (income/expense/transfer).
   • Actual Budget: envelope-style monthly budgets (target vs spent per
     category, rollover-aware progress bars).
   • Firefly III: recurring bills/income as first-class objects that
     project forward until you mark them paid.
   The signature view is the Cash-Flow calendar: bills laid against
   paydays over a customizable 1/2/3/6-month window, with a projected
   running balance that calls out the low point — so you can see the
   weeks where money gets tight before they happen.
   ===================================================================== */

function finCategory(id){ return S.finance.categories.find(c=>c.id===id) || null; }
function finAccount(id){ return S.finance.accounts.find(a=>a.id===id) || null; }
function finCatColor(cat){ return cat ? (cat.color || topicColor(cat.name)) : '#8a94a3'; }

/* Live balance for one account: starting balance + every transaction that
   touches it, dated on or before `asOfDate` (defaults to today — i.e. the
   real, already-happened balance, not a projection). */
function finAccountBalance(accountId, asOfDate){
  const cutoff = asOfDate || todayISO();
  const acc = finAccount(accountId);
  if(!acc) return 0;
  let bal = acc.startBalance;
  S.finance.transactions.forEach(t => {
    if(t.date > cutoff) return;
    if(t.kind==='transfer'){
      if(t.accountId===accountId) bal -= t.amount;
      if(t.toAccountId===accountId) bal += t.amount;
    } else if(t.accountId===accountId){
      bal += (t.kind==='income' ? t.amount : -t.amount);
    }
  });
  return bal;
}
/* Combined balance across all non-archived accounts — the single number
   the Cash-Flow calendar tracks, same simplified mental model as the
   reference screenshot (one running total, not per-account). */
function finCombinedBalance(asOfDate){
  return S.finance.accounts.filter(a=>!a.archived).reduce((s,a)=>s+finAccountBalance(a.id, asOfDate), 0);
}
function finNetWorth(){ return finCombinedBalance(todayISO()); }

/* Every occurrence date of a recurring rule inside [rangeStart, rangeEndIncl]. */
function finRecurringOccurrences(rule, rangeStart, rangeEndIncl){
  const out = [];
  let d = rule.startDate;
  let guard = 0;
  while(d <= rangeEndIncl && guard < 2000){
    if(d >= rangeStart) out.push(d);
    d = rule.frequency==='weekly' ? addDays(d,7) : addMonths(d,1);
    guard++;
  }
  return out;
}
/* The next not-yet-logged occurrence of a rule, today or later. A rule
   counts as "logged" for a date once a transaction with that recurringId
   exists on that exact date (created via the "Mark paid" button). */
function finNextOccurrence(rule){
  const today = todayISO();
  const logged = new Set(S.finance.transactions.filter(t=>t.recurringId===rule.id).map(t=>t.date));
  let d = rule.startDate;
  let guard = 0;
  while(guard < 2000){
    if(d >= today && !logged.has(d)) return d;
    d = rule.frequency==='weekly' ? addDays(d,7) : addMonths(d,1);
    guard++;
  }
  return null;
}
/* All items (actual + projected) landing on one day, for calendar chips.
   Past/today actual transactions always show. Future recurring occurrences
   show as "projected" unless already logged for that exact date. */
function finItemsForDay(dateISO, recurringByDate){
  const items = S.finance.transactions.filter(t=>t.date===dateISO)
    .map(t => ({ id:t.id, kind:t.kind, amount:t.amount, label:(finCategory(t.categoryId)||{}).name || t.note || 'Transaction', actual:true }));
  if(dateISO >= todayISO()){
    const logged = new Set(S.finance.transactions.filter(t=>t.recurringId).map(t=>t.recurringId+'|'+t.date));
    (recurringByDate[dateISO]||[]).forEach(r => {
      if(!logged.has(r.id+'|'+dateISO)) items.push({ id:'proj-'+r.id+dateISO, kind:r.kind, amount:r.amount, label:r.title, actual:false, recurringId:r.id });
    });
  }
  return items;
}
/* Precompute a date → [recurring rules occurring that day] lookup once for
   a whole visible range, instead of re-walking every rule per calendar cell. */
function finRecurringByDateInRange(rangeStart, rangeEndIncl){
  const map = {};
  S.finance.recurring.filter(r=>r.active).forEach(r => {
    finRecurringOccurrences(r, rangeStart, rangeEndIncl).forEach(d => { (map[d] || (map[d]=[])).push(r); });
  });
  return map;
}

const FIN_CYCLE_LABEL = {1:'Monthly', 2:'Bi-monthly', 3:'Tri-monthly', 6:'Semester'};

function renderFinance(){
  const sub = `<div class="fin-subtabs">
    <button data-finsub="cashflow" class="${S.finance.view==='cashflow'?'active':''}">Cash-Flow</button>
    <button data-finsub="accounts" class="${S.finance.view==='accounts'?'active':''}">Accounts</button>
    <button data-finsub="transactions" class="${S.finance.view==='transactions'?'active':''}">Transactions</button>
    <button data-finsub="recurring" class="${S.finance.view==='recurring'?'active':''}">Recurring</button>
    <button data-finsub="budgets" class="${S.finance.view==='budgets'?'active':''}">Budgets</button>
  </div>`;
  if(!finUnlocked){
    return sub + `<div class="avail-card">
      <p style="font-size:.85rem;margin-bottom:10px">🔒 Finance is private and lives in Supabase, gated behind your <b>host key</b> — the same one that already protects your booking admin actions. Enter it once per device to unlock.</p>
      <div class="field" style="margin-bottom:10px"><label>Host key</label><input id="finHostKeyInput" type="password" placeholder="Your Supabase host key" value="${esc(S.supabase.hostKey||'')}"></div>
      <button class="btn primary" id="btnUnlockFinance">Unlock Finance</button>
      ${sbConfigured() ? '' : '<p class="desc" style="margin-top:10px;font-size:.74rem;color:var(--hi)">No Supabase backend configured yet on this device — check the Sync tab.</p>'}

  if(S.finance.view==='accounts') return sub + renderFinanceAccounts();
  if(S.finance.view==='transactions') return sub + renderFinanceTransactions();

  return sub + renderFinanceCashflow();
}

/* ---------- Cash-Flow calendar (the hero view) ---------- */
function renderFinanceCashflow(){
  const fin = S.finance;
  const cycleStartDate = fin.cycleStart+'-01';
  const cycleEndDate = addDays(monthAdd(fin.cycleStart, fin.cycleMonths)+'-01', -1);
  const recurringByDate = finRecurringByDateInRange(cycleStartDate, cycleEndDate);
  const T = todayISO();

  // Summary tiles: income / bills(expenses) / net across the whole visible cycle
  let income = 0, bills = 0;
  let d = cycleStartDate;
  while(d <= cycleEndDate){
    finItemsForDay(d, recurringByDate).forEach(it => { if(it.kind==='income') income += it.amount; else if(it.kind==='expense') bills += it.amount; });
    d = addDays(d,1);
  }
  const net = income - bills;

  // Day-by-day projected balance across the cycle, tracking the low point
  const startingBalance = finCombinedBalance(addDays(cycleStartDate,-1));
  let running = startingBalance;
  const series = [];
  d = cycleStartDate;
  while(d <= cycleEndDate){
    const dayItems = finItemsForDay(d, recurringByDate);
    dayItems.forEach(it => {
      if(it.kind==='income') running += it.amount;
      else if(it.kind==='expense') running -= it.amount;
    });
    series.push({ date:d, balance:running, hasIncome:dayItems.some(i=>i.kind==='income'), hasItems:dayItems.length>0 });
    d = addDays(d,1);
  }
  const low = series.reduce((m,s)=> (!m||s.balance<m.balance)?s:m, null);

  // Checkpoint rows for the projected-balance list: cycle start, each payday, and the low point
  const checkpoints = [{date:addDays(cycleStartDate,-1), balance:startingBalance, label:'Start'}];
  series.filter(s=>s.hasIncome).forEach(s => checkpoints.push({date:s.date, balance:s.balance}));
  if(low && !checkpoints.some(c=>c.date===low.date)) checkpoints.push({date:low.date, balance:low.balance, isLow:true});
  checkpoints.sort((a,b)=>a.date.localeCompare(b.date));
  const maxAbs = Math.max(1, ...checkpoints.map(c=>Math.abs(c.balance)));

  const cycleBtns = [1,2,3,6].map(n => `<button data-fincycle="${n}" class="${fin.cycleMonths===n?'active':''}">${FIN_CYCLE_LABEL[n]}</button>`).join('');

  const monthsHtml = [];
  for(let i=0;i<fin.cycleMonths;i++){
    monthsHtml.push(renderFinanceMonthBlock(monthAdd(fin.cycleStart,i), recurringByDate, T));
  }

  const projRows = checkpoints.map(c => {
    const pct = Math.max(4, Math.abs(c.balance)/maxAbs*100);
    return `<div class="fin-proj-row ${c.isLow?'low':''}">
      <span class="fin-proj-date">${c.label||fmtDue(c.date)}</span>
      <span class="fin-proj-bar-wrap"><span class="fin-proj-bar" style="width:${pct}%"></span></span>
      <span class="fin-proj-amt">${c.balance<0?'-':''}$${Math.abs(c.balance).toFixed(0)}</span>
    </div>`;
  }).join('');

  return `<div>
    <div class="fin-toolbar">
      <div class="fin-subtabs" id="finCycleTabs" style="margin-bottom:0">${cycleBtns}</div>
      <div class="spacer"></div>
      <button class="cal-nav" data-fincyclenav="-1" aria-label="Earlier">‹</button>
      <button class="chip-btn" id="finTodayBtn" style="background:#eef0f4;color:var(--ink)">Today</button>
      <button class="cal-nav" data-fincyclenav="1" aria-label="Later">›</button>
    </div>
    <div class="fin-tiles">
      <div class="fin-tile income"><div class="fin-tile-label">Income</div><div class="fin-tile-val">$${income.toFixed(0)}</div></div>
      <div class="fin-tile bills"><div class="fin-tile-label">Bills</div><div class="fin-tile-val">$${bills.toFixed(0)}</div></div>
      <div class="fin-tile"><div class="fin-tile-label">Net</div><div class="fin-tile-val">${net<0?'-':''}$${Math.abs(net).toFixed(0)}</div></div>
      <div class="fin-tile low"><div class="fin-tile-label">Low point</div><div class="fin-tile-val">${low.balance<0?'-':''}$${Math.abs(low.balance).toFixed(0)}</div></div>
    </div>
    ${monthsHtml.join('')}
    <div class="fin-proj-card">
      <h3 style="font-family:'Sora';font-size:.9rem;margin-bottom:12px">Projected balance</h3>
      ${projRows}
    </div>
  </div>`;
}

function renderFinanceMonthBlock(ym, recurringByDate, T){
  const [y,m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = (first.getDay()+6)%7;
  const daysIn = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m-1, 0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, other:true, iso:iso(new Date(y,m-2,prevDays-i))});
  for(let dnum=1;dnum<=daysIn;dnum++) cells.push({d:dnum, other:false, iso:iso(new Date(y,m-1,dnum))});
  while(cells.length%7) cells.push({d:cells.length, other:true, iso:iso(new Date(y,m,cells.length-daysIn-startDow+1))});
  const monthName = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});

  return `<div class="fin-month-block">
    <div class="fin-month-head">${monthName}</div>
    <div class="fin-cal-grid">
      ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="fin-cal-dow">${d}</div>`).join('')}
      ${cells.map(c => {
        const items = finItemsForDay(c.iso, recurringByDate);
        return `<div class="fin-cal-cell ${c.other?'other':''} ${c.iso===T?'today-cell':''}" data-findate="${c.iso}">
          <span class="daynum">${c.d}</span>
          ${items.map(it => `<button class="fin-item-chip ${it.kind} ${it.actual?'':'projected'}" data-fintxid="${it.actual?it.id:''}" data-finrecid="${it.recurringId||''}" title="${esc(it.label)} · $${it.amount.toFixed(2)}${it.actual?'':' (projected)'}">${esc(it.label)} $${it.amount.toFixed(0)}</button>`).join('')}
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

/* ---------- Accounts ---------- */
function renderFinanceAccounts(){
  const cards = S.finance.accounts.filter(a=>!a.archived).map(a => {
    const bal = finAccountBalance(a.id);
    return `<div class="fin-acct-card" data-finacct="${a.id}">
      <div class="fin-acct-top">
        <span class="fin-acct-icon" style="background:${a.color}22;color:${a.color}">${esc(a.icon||'💳')}</span>
        <span class="fin-acct-name">${esc(a.name)}</span>
        <button class="icon-btn" data-finacctdel="${a.id}" title="Archive account" style="width:26px;height:26px">✕</button>
      </div>
      <div class="fin-acct-bal" style="color:${bal<0?'var(--hi)':'var(--ink)'}">${bal<0?'-':''}$${Math.abs(bal).toFixed(2)}</div>
    </div>`;
  }).join('');
  return `<div class="fin-acct-grid">
    ${cards}
    <div class="fin-acct-new" id="btnNewAccount">+ New account</div>
  </div>
  <div class="fin-tile" style="max-width:260px">
    <div class="fin-tile-label">Combined net worth</div>
    <div class="fin-tile-val">${finNetWorth()<0?'-':''}$${Math.abs(finNetWorth()).toFixed(2)}</div>
  </div>`;
}

/* ---------- Transactions ---------- */
function renderFinanceTransactions(){
  const rows = S.finance.transactions.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(t => {
    const cat = finCategory(t.categoryId);
    const acc = finAccount(t.accountId);
    const color = finCatColor(cat);
    const sign = t.kind==='expense' ? '-' : t.kind==='income' ? '+' : '';
    return `<div class="fin-tx-row" data-fintx="${t.id}">
      <span class="fin-tx-icon" style="background:${color}22;color:${color}">${esc(cat?cat.icon:(t.kind==='transfer'?'↔':'💳'))}</span>
      <div class="fin-tx-main">
        <div class="fin-tx-title">${esc(cat?cat.name:(t.note||'Transaction'))}</div>
        <div class="fin-tx-sub">${esc(acc?acc.name:'')}${t.note && cat ? ' · '+esc(t.note) : ''} · ${fmtDue(t.date)}</div>
      </div>
      <span class="fin-tx-amt ${t.kind}">${sign}$${t.amount.toFixed(2)}</span>
    </div>`;
  }).join('') || `<div class="empty-note">No transactions yet — add one below.</div>`;

  return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn accent" id="btnNewTx">+ Add transaction</button>
    </div>
    ${rows}`;
}

/* ---------- Recurring bills / income ---------- */
function renderFinanceRecurring(){
  const rows = S.finance.recurring.map(r => {
    const cat = finCategory(r.categoryId);
    const acc = finAccount(r.accountId);
    const next = finNextOccurrence(r);
    const color = finCatColor(cat);
    return `<div class="fin-rec-row ${r.active?'':'inactive'}">
      <span class="fin-acct-icon" style="background:${color}22;color:${color}">${esc(cat?cat.icon:'🔁')}</span>
      <div class="fin-rec-main">
        <div class="fin-rec-title">${esc(r.title)} <span style="color:var(--ink-faint);font-weight:500">· ${r.frequency}</span></div>
        <div class="fin-rec-sub">${esc(acc?acc.name:'')} · ${r.kind==='expense'?'-':'+'}$${r.amount.toFixed(2)}${next?` · next ${fmtDue(next)}`:' · fully logged'}</div>
      </div>
      ${next?`<button class="btn primary" data-finpay="${r.id}" style="padding:7px 12px;font-size:.78rem">Mark paid</button>`:''}
      <button class="btn ghost" data-fintoggle="${r.id}" style="padding:7px 12px;font-size:.78rem">${r.active?'Pause':'Resume'}</button>
      <button class="btn danger" data-findelrec="${r.id}" style="padding:7px 12px;font-size:.78rem">Delete</button>
    </div>`;
  }).join('') || `<div class="empty-note">No recurring bills or income yet — add one below.</div>`;

  return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn accent" id="btnNewRecurring">+ Add recurring</button>
    </div>
    ${rows}`;
}

/* ---------- Budgets (Actual-Budget-style envelopes, per calendar month) ---------- */
function renderFinanceBudgets(){
  const ym = todayISO().slice(0,7);
  const monthStart = ym+'-01';
  const monthEnd = addDays(monthAdd(ym,1)+'-01', -1);
  const targets = S.finance.budgets[ym] || {};
  const expenseCats = S.finance.categories.filter(c=>c.kind==='expense');

  const rows = expenseCats.map(cat => {
    const spent = S.finance.transactions
      .filter(t=>t.kind==='expense' && t.categoryId===cat.id && t.date>=monthStart && t.date<=monthEnd)
      .reduce((s,t)=>s+t.amount,0);
    const budget = targets[cat.id] || 0;
    const pct = budget>0 ? Math.min(100, spent/budget*100) : (spent>0?100:0);
    const over = budget>0 && spent>budget;
    const color = finCatColor(cat);
    return `<div class="fin-budget-row">
      <div class="fin-budget-top">
        <span class="topic-dot" style="background:${color}"></span>
        <span class="fin-budget-name">${esc(cat.name)}</span>
        <input type="number" min="0" step="1" data-finbudget="${cat.id}" value="${budget||''}" placeholder="0">
      </div>
      <div class="fin-budget-bar-wrap"><div class="fin-budget-bar ${over?'over':''}" style="width:${pct}%"></div></div>
      <div class="fin-budget-sub">$${spent.toFixed(0)} spent${budget>0?` of $${budget.toFixed(0)}`:''}${over?' — over budget':''}</div>
    </div>`;
  }).join('') || `<div class="empty-note">Add an expense category first (via a transaction or recurring bill) to budget against it.</div>`;

  const totalBudget = Object.values(targets).reduce((s,v)=>s+Number(v||0),0);
  const totalSpent = expenseCats.reduce((s,cat)=> s + S.finance.transactions.filter(t=>t.kind==='expense' && t.categoryId===cat.id && t.date>=monthStart && t.date<=monthEnd).reduce((s2,t)=>s2+t.amount,0), 0);

  return `<div class="fin-tiles">
      <div class="fin-tile"><div class="fin-tile-label">Budgeted this month</div><div class="fin-tile-val">$${totalBudget.toFixed(0)}</div></div>
      <div class="fin-tile bills"><div class="fin-tile-label">Spent this month</div><div class="fin-tile-val">$${totalSpent.toFixed(0)}</div></div>
      <div class="fin-tile ${totalBudget-totalSpent<0?'bills':'income'}"><div class="fin-tile-label">Remaining</div><div class="fin-tile-val">$${(totalBudget-totalSpent).toFixed(0)}</div></div>
    </div>
    ${rows}`;
}

function renderSync(){

      <h3>How the three layers connect</h3>
      Everything is anchored on a single <b class="k">Due Date field</b> per task. The <b>list, board and calendar are just view toggles</b> over the same task objects — dragging a card onto a calendar date writes that one field, and every other surface re-renders from it. <b>Priority is a custom field</b>, not a separate system: sorting (<i>Priority → due date</i>) reads it, calendar chips are colored by it, the ICS feed embeds it in event titles, and the rules engine uses it as a trigger. The external layer splits in two: a <b>read-only ICS feed</b> (deadlines as all-day events, Asana → calendar only) and a <b>rules integration</b> (task triggers create/update real events, with field-level data sync back to the event) — implemented above with a real, client-side OAuth token calling the Calendar API directly, no server involved. <b>Checklists live inside tasks as subtasks</b> — Microsoft To Do-style steps with instant saving and a progress count that surfaces on list rows and board cards, so breakdown work stays attached to the deadline that drives it instead of living in a separate silo. <b>Cross-device sync</b> reuses the identical Google login to write the whole app state as one JSON file into your Drive's app-private storage, so a phone and a laptop converge on whichever copy was saved most recently. For automated hourly time-blocking of High-priority work, Asana itself stops here — that's the layer tools like Reclaim.ai, Motion or Clockwise add on top by reading these same fields.

}

/* =====================================================================
   SUPABASE — shared backend for BOOKINGS ONLY. This is the "one place
   all bookings live" that a static, per-browser app otherwise can't have.
   Public booking pages read/write here so strangers' bookings are visible
   to each other and to you. Uses the REST (PostgREST) endpoint directly —
   no SDK, no build step. The anon key is safe in the client because Row
   Level Security policies (see setup SQL) restrict what each role can do.
   Tasks / notes / availability / event types stay local + Drive; only
   bookings need sharing.
   ===================================================================== */
function sbConfigured(){ return !!(S.supabase && S.supabase.url && S.supabase.anonKey); }
function sbHeaders(){
  return { 'apikey':S.supabase.anonKey, 'Authorization':`Bearer ${S.supabase.anonKey}`, 'Content-Type':'application/json' };
}
/* Host-privileged requests add your secret key header; DB policies verify it.
   The key is stored only in your browser (+ your private Drive backup) —
   never in the repo, never sent to visitors. */
function sbHostHeaders(){
  const h = sbHeaders();
  if(S.supabase.hostKey) h['x-host-key'] = S.supabase.hostKey;
  return h;
}
async function sbRequest(method, path, body, extraHeaders){
  const url = S.supabase.url.replace(/\/$/,'') + '/rest/v1' + path;
  const res = await fetch(url, { method, headers: Object.assign(sbHeaders(), extraHeaders||{}), body: body?JSON.stringify(body):undefined });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error(`Supabase ${method} ${path} → ${res.status} ${t}`); }
  return res.status===204 ? null : res.json();
}
/* Public read: only the columns needed to compute free/busy — NOT invitee
   PII. The RLS policy also restricts the anon role to these. */
async function sbBookedSlotsForDate(dateISO){
  if(!sbConfigured()) return [];
  try{
    const rows = await sbRequest('GET', `/bookings_busy?select=start_time,end_time&date=eq.${dateISO}`);
    return rows.map(r => ({ start: r.start_time.slice(0,5), end: r.end_time.slice(0,5) }));
  }catch(e){ console.warn('Supabase read failed', e); return []; }
}
/* Public insert of a new booking. Uses return=minimal because the public
   role deliberately has NO read permission on bookings — asking PostgREST
   to return the created row would be rejected. We already know the row
   (we generated the id client-side). */
async function sbInsertBooking(b, et){
  const row = {
    id: b.id, event_type_id: et.id, event_type_name: et.name,
    date: b.date, start_time: b.start+':00', end_time: b.end+':00',
    invitee_name: b.inviteeName, invitee_email: b.inviteeEmail,
    note: b.note||'', status:'confirmed'
  };
  await sbRequest('POST', '/bookings', row, {'Prefer':'return=minimal'});
  return b;
}
/* Host read: full booking rows including invitee PII. Works from your
   browser; the RLS policy can gate this to a shared secret header if you
   want stricter privacy (see SQL comments). */
async function sbFetchAllBookings(){
  if(!sbConfigured()) return null;
  try{
    const rows = await sbRequest('GET', '/bookings?select=*&order=date.asc', null, S.supabase.hostKey?{'x-host-key':S.supabase.hostKey}:{});
    return rows.map(r => ({
      id:r.id, eventTypeId:r.event_type_id, eventTypeName:r.event_type_name,
      date:r.date, start:r.start_time.slice(0,5), end:r.end_time.slice(0,5),
      inviteeName:r.invitee_name, inviteeEmail:r.invitee_email, note:r.note,
      status:r.status, gcalEventId:r.gcal_event_id||null, createdAt:r.created_at
    }));
  }catch(e){ console.warn('Supabase host fetch failed', e); return null; }
}
async function sbUpdateBooking(id, patch){
  if(!sbConfigured()) return;
  try{ await sbRequest('PATCH', `/bookings?id=eq.${id}`, patch, S.supabase.hostKey?{'x-host-key':S.supabase.hostKey}:{}); }catch(e){ console.warn('Supabase update failed', e); }
}

/* Probe: does the backend accept our host key? Calls the is_host() SQL
   function via RPC. Lets us distinguish "no bookings exist" from "the
   host key is wrong so reads silently return nothing". */
async function sbIsHost(){
  try{
    const res = await fetch(S.supabase.url.replace(/\/$/,'')+'/rest/v1/rpc/is_host', {
      method:'POST', headers: sbHostHeaders(), body:'{}'
    });
    if(!res.ok) return null;      // function missing / older SQL — can't tell
    return (await res.json()) === true;
  }catch(e){ return null; }
}

/* =====================================================================
   FINANCE BACKEND — private, host-key-gated (reuses the same is_host()
   check and x-host-key header that already protects booking admin
   actions, so there's no new secret to manage). Unlike the shared to-do
   list this has NO public-read policy at all: every operation, including
   plain reads, requires the host key. S.finance.accounts/categories/
   transactions/recurring/budgets are just the local cache; Supabase is
   the source of truth once unlocked. ===================================================================== */
let finUnlocked = false;
let finSyncing = false;

async function sbFetchFinanceAll(){
  if(!sbConfigured()) return null;
  const hdr = S.supabase.hostKey ? {'x-host-key':S.supabase.hostKey} : {};
  const [accounts, categories, transactions, recurring, budgetRows] = await Promise.all([
    sbRequest('GET','/fin_accounts?select=*', null, hdr),
    sbRequest('GET','/fin_categories?select=*', null, hdr),
    sbRequest('GET','/fin_transactions?select=*', null, hdr),
    sbRequest('GET','/fin_recurring?select=*', null, hdr),
    sbRequest('GET','/fin_budgets?select=*', null, hdr)
  ]);
  return {
    accounts: accounts.map(r=>({id:r.id, name:r.name, icon:r.icon, color:r.color, startBalance:Number(r.start_balance), archived:!!r.archived})),
    categories: categories.map(r=>({id:r.id, name:r.name, icon:r.icon, color:r.color, kind:r.kind})),
    transactions: transactions.map(r=>({id:r.id, accountId:r.account_id, toAccountId:r.to_account_id, categoryId:r.category_id, kind:r.kind, amount:Number(r.amount), date:r.date, note:r.note||'', recurringId:r.recurring_id})),
    recurring: recurring.map(r=>({id:r.id, title:r.title, accountId:r.account_id, categoryId:r.category_id, kind:r.kind, amount:Number(r.amount), startDate:r.start_date, frequency:r.frequency, active:!!r.active})),
    budgets: budgetRows.reduce((acc,row)=>{ (acc[row.ym] || (acc[row.ym]={}))[row.category_id] = Number(row.amount); return acc; }, {})
  };
}
function finHdr(extra){ return Object.assign(S.supabase.hostKey?{'x-host-key':S.supabase.hostKey}:{}, extra||{}); }
async function sbInsertAccount(a){ await sbRequest('POST','/fin_accounts', {id:a.id,name:a.name,icon:a.icon,color:a.color,start_balance:a.startBalance,archived:a.archived}, finHdr({'Prefer':'return=minimal'})); }
async function sbUpdateAccount(id, patch){ await sbRequest('PATCH', `/fin_accounts?id=eq.${id}`, patch, finHdr()); }
async function sbInsertCategory(c){ await sbRequest('POST','/fin_categories', {id:c.id,name:c.name,icon:c.icon,color:c.color,kind:c.kind}, finHdr({'Prefer':'return=minimal'})); }
async function sbInsertTransaction(t){ await sbRequest('POST','/fin_transactions', {id:t.id,account_id:t.accountId,to_account_id:t.toAccountId||null,category_id:t.categoryId||null,kind:t.kind,amount:t.amount,date:t.date,note:t.note||'',recurring_id:t.recurringId||null}, finHdr({'Prefer':'return=minimal'})); }
async function sbDeleteTransaction(id){ await sbRequest('DELETE', `/fin_transactions?id=eq.${id}`, null, finHdr()); }
async function sbInsertRecurring(r){ await sbRequest('POST','/fin_recurring', {id:r.id,title:r.title,account_id:r.accountId,category_id:r.categoryId,kind:r.kind,amount:r.amount,start_date:r.startDate,frequency:r.frequency,active:r.active}, finHdr({'Prefer':'return=minimal'})); }
async function sbUpdateRecurring(id, patch){ await sbRequest('PATCH', `/fin_recurring?id=eq.${id}`, patch, finHdr()); }
async function sbDeleteRecurring(id){ await sbRequest('DELETE', `/fin_recurring?id=eq.${id}`, null, finHdr()); }
async function sbUpsertBudget(ym, categoryId, amount){ await sbRequest('POST', '/fin_budgets', {ym, category_id:categoryId, amount}, finHdr({'Prefer':'resolution=merge-duplicates,return=minimal'})); }

/* One-time bootstrap: if Supabase has nothing yet but this device has
   local Finance data (the common first-run case — you'd already been
   using the tab before it was backed by a database), push everything up
   as the seed instead of silently discarding it. Safe because it only
   fires when the remote tables are completely empty. */
async function finPushAllLocal(){
  for(const a of S.finance.accounts) await sbInsertAccount(a);
  for(const c of S.finance.categories) await sbInsertCategory(c);
  for(const r of S.finance.recurring) await sbInsertRecurring(r);
  for(const t of S.finance.transactions) await sbInsertTransaction(t);
  for(const ym of Object.keys(S.finance.budgets)){
    for(const catId of Object.keys(S.finance.budgets[ym])) await sbUpsertBudget(ym, catId, S.finance.budgets[ym][catId]);
  }
}
function finApplyRemote(remote){
  S.finance.accounts = remote.accounts;
  S.finance.categories = remote.categories;
  S.finance.transactions = remote.transactions;
  S.finance.recurring = remote.recurring;
  S.finance.budgets = remote.budgets;
}
async function finRefresh(force){
  if(finSyncing) return;
  if(!sbConfigured()) return;
  finSyncing = true;
  try{
    const ok = await sbIsHost();
    if(ok !== true){
      finUnlocked = false;
      if(force) toast(ok===false ? 'Host key rejected — check it in the Sync tab' : 'Could not verify the host key — check your connection');
      return;
    }
    finUnlocked = true;
    const remote = await sbFetchFinanceAll();
    if(!remote) return;
    const remoteEmpty = !remote.accounts.length && !remote.categories.length && !remote.transactions.length && !remote.recurring.length;
    const localHasData = S.finance.accounts.length || S.finance.transactions.length || S.finance.recurring.length;
    if(remoteEmpty && localHasData){
      await finPushAllLocal();
      if(force) toast('Uploaded your existing Finance data to Supabase');
    } else {
      finApplyRemote(remote);
    }
    save();
    if(S.view==='finance') render();
  }catch(e){ console.error('finance refresh failed', e); if(force) toast('Finance sync failed — see console'); }
  finally{ finSyncing = false; }
}
let finPollTimer = null;
function startFinPolling(){ stopFinPolling(); finPollTimer = setInterval(() => finRefresh(), 20000); }
function stopFinPolling(){ if(finPollTimer){ clearInterval(finPollTimer); finPollTimer = null; } }

/* Publish the host's scheduling config (event types + availability) to a
   single-row 'schedule_config' table, so a stranger's browser — which has
   no local state — can load the public booking page. Call this whenever
   event types or availability change. */
async function sbPublishConfig(){
  if(!sbConfigured()) return;
  const payload = {
    id: 1,
    event_types: S.eventTypes,
    availability: S.availability,
    updated_at: new Date().toISOString()
  };
  try{
    const hdrs = {'Prefer':'resolution=merge-duplicates'};
    if(S.supabase.hostKey) hdrs['x-host-key'] = S.supabase.hostKey;
    await sbRequest('POST', '/schedule_config', payload, hdrs);
  }catch(e){ console.warn('Supabase config publish failed', e); }
}
/* Public read of the host's config (used by the standalone booking page). */
async function sbFetchConfig(){
  if(!sbConfigured()) return null;
  try{
    const rows = await sbRequest('GET', '/schedule_config?select=*&id=eq.1');
    if(rows && rows[0]) return { eventTypes: rows[0].event_types, availability: rows[0].availability };
  }catch(e){ console.warn('Supabase config fetch failed', e); }
  return null;
}

/* ---------- Shared to-do list backend (Supabase, 'shared_tasks' table) ----------
   Same REST-over-fetch approach as bookings. Reads are public (anyone with
   the link sees the list); inserts/updates/deletes require an x-family-key
   header that a Postgres RLS policy checks via an is_family() RPC — see
   the setup SQL. This is deliberately a *different* secret from the host
   key above, so you can hand it to your wife without handing over your
   Google-Calendar-sync admin key too. */
function sbFamilyHeaders(){
  const h = sbHeaders();
  if(S.familyKey) h['x-family-key'] = S.familyKey;
  return h;
}
async function sbFetchSharedTasks(){
  if(!sbConfigured()) return null;
  try{
    const rows = await sbRequest('GET', '/shared_tasks?select=*&order=done.asc,due.asc.nullslast');
    return rows.map(r => ({
      id:r.id, title:r.title, topic:r.topic||'General', priority:r.priority, due:r.due,
      done:r.done, addedBy:r.added_by||'', doneBy:r.done_by||'', createdAt:r.created_at
    }));
  }catch(e){ console.warn('shared_tasks fetch failed', e); return null; }
}
async function sbInsertSharedTask(t){
  const row = { id:t.id, title:t.title, topic:t.topic||'General', priority:t.priority, due:t.due, done:false, added_by:t.addedBy||'' };
  await sbRequest('POST', '/shared_tasks', row, Object.assign({'Prefer':'return=minimal'}, sbFamilyHeaders()));
}
async function sbUpdateSharedTask(id, patch){
  await sbRequest('PATCH', `/shared_tasks?id=eq.${id}`, patch, sbFamilyHeaders());
}
async function sbDeleteSharedTask(id){
  await sbRequest('DELETE', `/shared_tasks?id=eq.${id}`, null, sbFamilyHeaders());
}

/* =====================================================================
   AI ASSISTANT — a chat panel over your own data, calling Gemini's API
   directly from the browser (no backend). Free-tier key from Google AI
   Studio. Context is built fresh from current state on every question —
   no separate memory system, no server round-trip beyond the one call
   to Google.
   ===================================================================== */
let aiHistory = []; // {role:'user'|'model', text} — in-memory only, resets on reload

function buildAiContext(){
  const T = todayISO();
  const soon = addDays(T, 14);
  const openTasks = S.tasks.filter(t => !t.done)
    .sort((a,b) => (a.due||'9999').localeCompare(b.due||'9999'))
    .slice(0, 40)
    .map(t => {
      const sub = t.subtasks && t.subtasks.length ? ` [subtasks ${t.subtasks.filter(s=>s.done).length}/${t.subtasks.length}]` : '';
      return `- "${t.title}"${t.project?` (${t.project})`:''} — due:${t.due||'none'} priority:${t.priority||'none'}${sub}`;
    }).join('\n') || '(no open tasks)';

  const upcomingBookings = S.bookings.filter(b => b.status==='confirmed' && b.date>=T && b.date<=soon)
    .sort((a,b)=> a.date.localeCompare(b.date)||a.start.localeCompare(b.start))
    .map(b => { const et=S.eventTypes.find(x=>x.id===b.eventTypeId); return `- ${b.date} ${b.start}-${b.end}: ${et?et.name:'Meeting'} with ${b.inviteeName}`; })
    .join('\n') || '(no upcoming bookings)';

  return `Today's date: ${T}
Weekly focus: ${S.weeklyFocus||'(none set)'}

OPEN TASKS (up to 40, soonest due date first):
${openTasks}

UPCOMING BOOKINGS (next 14 days):
${upcomingBookings}`;
}

async function callGemini(userText){
  if(!S.gemini.apiKey) throw new Error('NO_KEY');
  const context = buildAiContext();
  const systemPreamble = `You are a concise personal assistant inside a task/calendar app called Manzana. Answer using ONLY the data below plus the user's question. Be brief and direct — a short paragraph or a tight bullet list, not a report. If asked for priorities, use the stated priority field and due dates, not your own guess of importance unless priority is unset. If the data doesn't contain something needed to answer, say so plainly rather than inventing it.\n\n${context}`;

  const turns = aiHistory.slice(-8).map(m => ({ role: m.role, parts:[{text:m.text}] }));
  const body = {
    system_instruction: { parts:[{text: systemPreamble}] },
    contents: [...turns, { role:'user', parts:[{text:userText}] }]
  };
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${S.gemini.model}:generateContent?key=${S.gemini.apiKey}`;
  const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error(`HTTP_${res.status}:${t.slice(0,200)}`);
  }
  const data = await res.json();
  const text = data && data.candidates && data.candidates[0] && data.candidates[0].content
    && data.candidates[0].content.parts && data.candidates[0].content.parts.map(p=>p.text).join('');
  if(!text) throw new Error('EMPTY_RESPONSE');
  return text;
}

function renderAiMessages(){
  const box = document.getElementById('aiMessages');
  box.innerHTML = aiHistory.map(m =>
    `<div class="ai-msg ${m.role==='user'?'user':'bot'}${m.pending?' thinking':''}${m.setupNeeded?' setup-needed':''}">${esc(m.text)}</div>`
  ).join('');
  box.scrollTop = box.scrollHeight;
}

async function sendAiMessage(text){
  text = text.trim(); if(!text) return;
  aiHistory.push({role:'user', text});
  renderAiMessages();

  if(!S.gemini.apiKey){
    aiHistory.push({role:'model', text:'No Gemini API key set up yet. Add one free in Sync → AI Assistant, then ask again.', setupNeeded:true});
    renderAiMessages();
    return;
  }
  aiHistory.push({role:'model', text:'Thinking…', pending:true});
  renderAiMessages();
  try{
    const reply = await callGemini(text);
    aiHistory.pop(); // remove "Thinking…"
    aiHistory.push({role:'model', text: reply});
  }catch(e){
    aiHistory.pop();
    const msg = String(e.message||e);
    let friendly = 'Something went wrong reaching Gemini — see console (F12) for details.';
    if(msg.includes('HTTP_400')) friendly = 'Gemini rejected the request — check the API key is valid and the model name in Sync is current.';
    else if(msg.includes('HTTP_403')||msg.includes('HTTP_401')) friendly = 'API key was rejected — re-copy it from Google AI Studio.';
    else if(msg.toLowerCase().includes('prepayment credits')) friendly = 'Google says "prepayment credits are depleted" — a known Gemini API billing-side issue reported by many developers right now, not specific to this app. Check aistudio.google.com/projects for your real billing status; some report it is a sync bug that clears on its own or after adding a small funded balance.';
    else if(msg.includes('HTTP_429')) friendly = 'Quota error (429). If this happened on your FIRST try, the model in Sync → AI Assistant has no free quota — switch it to gemini-2.5-flash-lite. If it happened after several quick questions, wait a minute. Google said: ' + msg.split('HTTP_429:')[1].slice(0,160);
    else if(msg.includes('HTTP_404')) friendly = 'Model not found — the model name in Sync → AI Assistant is outdated; try gemini-2.5-flash-lite.';
    aiHistory.push({role:'model', text: friendly, setupNeeded:true});
    console.error('Gemini call failed', e);
  }
  renderAiMessages();
}

function wireAiPanel(){
  const fab = document.getElementById('aiFab');
  const closeBtn = document.getElementById('aiClose');
  const input = document.getElementById('aiInput');
  const send = document.getElementById('aiSend');
  fab.addEventListener('click', () => {
    document.body.classList.toggle('ai-open');
    if(document.body.classList.contains('ai-open') && !aiHistory.length){
      aiHistory.push({role:'model', text:'Hi — ask me about your tasks, priorities, or upcoming bookings.'});
      renderAiMessages();
    }
  });
  closeBtn.addEventListener('click', () => document.body.classList.remove('ai-open'));
  const doSend = () => { const v = input.value; input.value=''; sendAiMessage(v); };
  send.addEventListener('click', doSend);
  input.addEventListener('keydown', e => { if(e.key==='Enter') doSend(); });
  document.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => sendAiMessage(b.dataset.q)));
}

/* =====================================================================
   BOOK TAB — Calendly-style scheduling: event types (reusable meeting
   templates), a weekly availability schedule with buffers/overrides, and
   a public booking page that computes real open slots — checking your
   actual Google Calendar free/busy time when connected, exactly like
   Calendly's "connect your calendar" feature. Confirmed bookings become
   real timed Google Calendar events; this is the "professional calendar"
   layer that sits alongside the personal due-date calendar.
   ===================================================================== */

const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_LABEL = {sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid(); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function publicBookingUrl(et){ return `${location.origin}${location.pathname}#book/${et.slug}`; }

/* Real Google Calendar free/busy check — the actual mechanism Calendly
   uses once you "connect your calendar". Returns busy [start,end] minute
   ranges (in minutes-from-midnight) for a given date, or [] if not
   connected (falls back to only checking bookings already in S.bookings). */
async function gcalBusyRangesForDate(dateISO){
  if(!(S.google.connected && S.google.clientId)) return [];
  try{
    const token = await ensureToken(true);
    const timeMin = new Date(dateISO+'T00:00:00').toISOString();
    const timeMax = new Date(dateISO+'T23:59:59').toISOString();
    const res = await fetch('https://www.googleapis.com/calendar/v3/freeBusy', {
      method:'POST', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body: JSON.stringify({ timeMin, timeMax, items:[{id:'primary'}] })
    });
    if(!res.ok) return [];
    const data = await res.json();
    const busy = (data.calendars && data.calendars.primary && data.calendars.primary.busy) || [];
    return busy.map(b => ({ start: minutesFromMidnight(b.start), end: minutesFromMidnight(b.end) }));
  }catch(e){ console.warn('freeBusy check failed, falling back to bookings-only', e); return []; }
}
function minutesFromMidnight(iso){
  const d = new Date(iso);
  return d.getHours()*60 + d.getMinutes();
}

/* Core slot computation — mirrors Calendly's engine: weekly window minus
   buffer minus existing bookings minus (optionally) real Google busy time
   minus minimum-notice minus per-day booking limit. */
async function computeSlotsForDate(eventType, dateISO){
  const dow = DOW_KEYS[new Date(dateISO+'T00:00').getDay()];
  const day = S.availability.weekly[dow];
  if(!day || !day.enabled) return [];
  if(S.availability.overrides[dateISO] && S.availability.overrides[dateISO].blocked) return [];

  const now = new Date();
  const isToday = dateISO===todayISO();
  const minNoticeMin = now.getTime() + S.availability.minNoticeHours*3600000;

  // Booked slots come from Supabase (shared across all visitors) when
  // configured; otherwise fall back to whatever this browser knows locally.
  let dayBusy;
  if(sbConfigured()){
    dayBusy = await sbBookedSlotsForDate(dateISO);
  } else {
    dayBusy = S.bookings.filter(b => b.date===dateISO && b.status==='confirmed')
                        .map(b => ({start:b.start, end:b.end}));
  }
  if(S.availability.dailyLimit && dayBusy.length >= S.availability.dailyLimit) return [];

  const busy = dayBusy.map(b => ({start:timeToMin(b.start), end:timeToMin(b.end)}));
  const gcalBusy = await gcalBusyRangesForDate(dateISO);
  const allBusy = busy.concat(gcalBusy);

  const step = eventType.duration; // start-time increment = event duration (simple, matches most Calendly setups)
  const slots = [];
  for(let t=timeToMin(day.start); t+eventType.duration<=timeToMin(day.end); t+=step){
    const slotStart = t, slotEnd = t+eventType.duration;
    const bufferedStart = slotStart - eventType.buffer, bufferedEnd = slotEnd + eventType.buffer;
    const conflicts = allBusy.some(b => bufferedStart < b.end && bufferedEnd > b.start);
    if(conflicts) continue;
    const slotDateTime = new Date(dateISO+'T'+minToTime(slotStart));
    if(isToday && slotDateTime.getTime() < minNoticeMin) continue;
    if(!isToday && slotDateTime.getTime() < minNoticeMin && slotDateTime.toDateString()===now.toDateString()) continue;
    slots.push(minToTime(slotStart));
  }
  return slots;
}

async function gcalCreateTimedEvent(booking, et){
  const startISO = `${booking.date}T${booking.start}:00`;
  const endISO = `${booking.date}T${booking.end}:00`;
  const body = {
    summary: `${et.name} — ${booking.inviteeName}`,
    description: `Booked via My Tasks scheduling page.\n${et.description||''}${booking.note?'\n\nInvitee note: '+booking.note:''}`,

}
function cancelBooking(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;

    gcalRequest('DELETE', `/calendars/primary/events/${b.gcalEventId}`).catch(e=>console.error(e));
  }
  if(sbConfigured()) sbUpdateBooking(id, {status:'cancelled'}); // reopens the slot for other invitees
  save(); render(); toast('Booking cancelled');
}

/* Host-side meeting sync: pull all bookings from Supabase (so bookings
   strangers made reach you), merge into local state, and — per your chosen
   model — create a real Google Calendar event for any confirmed booking
   that doesn't have one yet, writing the event id back to Supabase so it's
   not recreated next time. Guarded so it runs at most once per tab-open. */
/* ---------- Auto-sync scheduler (in-app layer) ----------
   Syncs bookings on every app open, and at fixed local times (07/12/15)
   while a tab or the installed PWA is open. A browser cannot run code
   while fully closed — the GitHub Actions workflow covers that gap. */
const AUTO_SYNC_HOURS = [7, 12, 15];
let lastAutoSyncSlot = null;
function startAutoSync(){
  // on open: run once, shortly after load so Google/Supabase are ready
  setTimeout(() => { if(sbConfigured()) maybeSyncMeetings(true); }, 4000);
  // while open: check each minute whether we've crossed a scheduled hour
  setInterval(() => {
    const now = new Date();
    if(AUTO_SYNC_HOURS.includes(now.getHours()) && now.getMinutes()===0){
      const slot = `${now.toDateString()}-${now.getHours()}`;
      if(slot!==lastAutoSyncSlot && sbConfigured()){
        lastAutoSyncSlot = slot;
        maybeSyncMeetings(true);
      }
    }
  }, 60000);
}

let meetingsSyncing = false, meetingsSyncedOnce = false;
async function maybeSyncMeetings(force){
  if(meetingsSyncing) return;
  if(meetingsSyncedOnce && !force) return;
  meetingsSyncing = true;
  try{
    // Verify the host key first — otherwise reads silently return nothing
    // and we'd show (and store) a misleading empty list.
    const hostOk = await sbIsHost();
    if(hostOk === false){
      toast('Host key missing or wrong — enter it in Sync → Booking backend, then Refresh');
      meetingsSyncing = false; return;
    }
    const remote = await sbFetchAllBookings();
    if(remote !== null){
      S.bookings = remote;            // Supabase is the source of truth for bookings
      save();
      if(force) toast(remote.length ? `Pulled ${remote.length} booking${remote.length===1?'':'s'} from backend` : 'Backend reachable — no bookings recorded yet');
    } else if(force){
      toast('Could not read bookings from backend — see console');
    }
    // Create missing calendar events for confirmed bookings (needs your Google login)
    if(S.google.connected){
      let created = 0, failed = 0, lastErr = null;
      for(const b of S.bookings.filter(x => x.status==='confirmed' && !x.gcalEventId)){
        const et = S.eventTypes.find(x=>x.id===b.eventTypeId) || {name:b.eventTypeName||'Meeting', description:''};
        try{
          await gcalCreateTimedEvent(b, et);
          if(sbConfigured()) await sbUpdateBooking(b.id, {gcal_event_id:b.gcalEventId});
          created++;
        }catch(e){ failed++; lastErr = e; console.error('calendar create failed for booking', b.id, e); }
      }
      if(created){ save(); toast(`Added ${created} booking${created===1?'':'s'} to your Google Calendar`); }
      if(failed){
        const authIssue = lastErr && /401|403|token|auth/i.test(String(lastErr.message||lastErr));
        toast(authIssue
          ? `${failed} calendar event${failed===1?'':'s'} FAILED — your Google session likely expired. Disconnect & reconnect Google in the Sync tab, then Refresh again.`
          : `${failed} calendar event${failed===1?'':'s'} FAILED — see console (F12) for the error.`);
      }
    } else if(force && S.bookings.some(x=>x.status==='confirmed' && !x.gcalEventId)){
      toast('Bookings pulled, but Google is disconnected — reconnect in Sync to add them to your calendar');
    }
    meetingsSyncedOnce = true;
    render();
  }catch(e){ console.error('meeting sync failed', e); if(force) toast('Sync failed — see console'); }
  finally{ meetingsSyncing = false; }
}

let pubState = { et:null, date:null, slots:[], selectedTime:null, step:'date' };

async function renderPublicBooking(slug){
  const root = document.getElementById('publicBookingRoot');
  root.innerHTML = `<div class="pub-card"><div class="pub-body"><p style="color:var(--ink-soft)">Loading…</p></div></div>`;

  // A stranger's browser has empty local state. Pull the host's published
  // config (event types + availability) from Supabase so the page works.
  // BUILD_SUPABASE is an optional embedded fallback so the deployed public
  // link carries the backend creds even in a fresh browser.
  if((!S.supabase.url || !S.supabase.anonKey) && typeof BUILD_SUPABASE!=='undefined' && BUILD_SUPABASE.url){
    S.supabase = { url:BUILD_SUPABASE.url, anonKey:BUILD_SUPABASE.anonKey };
  }
  if(sbConfigured() && (!S.eventTypes || !S.eventTypes.length || !S.eventTypes.some(e=>e.slug===slug))){
    const cfg = await sbFetchConfig();
    // Only adopt backend config that actually has content — an empty
    // event_types array must never wipe local data.
    if(cfg && Array.isArray(cfg.eventTypes) && cfg.eventTypes.length) S.eventTypes = cfg.eventTypes;
    if(cfg && cfg.availability && cfg.availability.weekly) S.availability = cfg.availability;
  }

  const et = S.eventTypes.find(x => x.slug===slug && x.active);
  if(!et){
    const extra = sbConfigured() ? '.' : ', or the booking backend is not reachable.';
    root.innerHTML = `<div class="pub-card"><div class="pub-body"><h2 style="font-family:'Sora'">Scheduling page not found</h2><p style="color:var(--ink-soft)">This event type does not exist or is not active${extra}</p></div></div>`;
    return;
  }
  if(pubState.et !== et.id){ pubState = { et: et.id, date:null, slots:[], selectedTime:null, step:'date' }; }

  const dates = [];
  for(let i=0;i<14;i++) dates.push(addDays(todayISO(), i));
  if(!pubState.date) pubState.date = dates.find(d => {
    const dow = DOW_KEYS[new Date(d+'T00:00').getDay()];
    return S.availability.weekly[dow].enabled && !(S.availability.overrides[d]&&S.availability.overrides[d].blocked);
  }) || dates[0];

  root.innerHTML = `<div class="pub-card">
    <div class="pub-head">
      <span class="evt-dot" style="background:${et.color}"></span>
      <div>
        <h2>${esc(et.name)}</h2>
        <p>${esc(et.description)}</p>
        <div class="pub-meta"><span>⏱ ${et.duration} min</span><span>📍 ${et.locationType==='video'?'Video call':et.locationType==='phone'?'Phone call':'In person'}</span><span>🌐 ${esc(S.availability.timezone)}</span></div>
      </div>
    </div>
    <div class="pub-body" id="pubBody">Loading availability…</div>
    ${sbConfigured() ? '' : `<div style="background:var(--md-bg);color:var(--md);font-size:.78rem;font-weight:600;padding:10px 26px">⚠ Demo mode: no booking backend is configured, so this booking will NOT reach the host. (Host: fill in BUILD_SUPABASE in index.html.)</div>`}
    <div class="pub-footer-link">Powered by Manzana — no third-party scheduling service involved.</div>
  </div>`;
  await renderPubStep();
}

async function renderPubStep(){
  const et = S.eventTypes.find(x=>x.id===pubState.et);
  const body = document.getElementById('pubBody');
  if(pubState.step==='confirmed'){
    const b = pubState.confirmedBooking;
    const gUrl = googleAddUrl(et, b);
    body.innerHTML = `<div class="pub-confirm">
      <div class="check-big">✓</div>
      <h2>You're booked!</h2>
      <p>${esc(et.name)} with you on ${new Date(b.date+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} at ${b.start}.</p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn blue" href="${gUrl}" target="_blank" rel="noopener">Add to Google Calendar</a>
        <button class="btn ghost" id="pubIcsBtn">Download .ics</button>
      </div>
    </div>`;
    document.getElementById('pubIcsBtn').addEventListener('click', () => download(`${et.slug}.ics`, icsForBooking(et,b), 'text/calendar'));
    return;
  }

  const dates = []; for(let i=0;i<14;i++) dates.push(addDays(todayISO(), i));
  const dateStrip = `<div class="pub-dates">${dates.map(d => {
    const dow = DOW_KEYS[new Date(d+'T00:00').getDay()];
    const blocked = !S.availability.weekly[dow].enabled || (S.availability.overrides[d]&&S.availability.overrides[d].blocked);
    const dt = new Date(d+'T00:00');
    return `<button class="pub-date-btn ${d===pubState.date?'active':''}" data-pubdate="${d}" ${blocked?'disabled':''}>
      <span class="d">${dt.toLocaleDateString(undefined,{weekday:'short'})}</span>${dt.getDate()}
    </button>`;
  }).join('')}</div>`;

  if(pubState.step==='form'){
    body.innerHTML = dateStrip + `
      <div class="pub-form">
        <p style="font-size:.85rem;margin-bottom:14px"><b>${new Date(pubState.date+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} at ${pubState.selectedTime}</b> · <button id="pubBack" style="color:var(--accent);font-weight:600">change time</button></p>
        <div class="field"><label>Name</label><input id="pfName" type="text" placeholder="Your name"></div>
        <div class="field"><label>Email</label><input id="pfEmail" type="email" placeholder="you@example.com"></div>
        ${et.questionLabel ? `<div class="field"><label>${esc(et.questionLabel)}</label><textarea id="pfNote"></textarea></div>` : ''}
        <button class="btn accent" id="pfConfirm" style="width:100%;padding:11px">Confirm booking</button>
      </div>`;
    wirePublic();
    return;
  }

  body.innerHTML = dateStrip + `<div id="pubSlotsWrap">Loading times…</div>`;
  wirePublic();
  const slots = await computeSlotsForDate(et, pubState.date);
  const wrap = document.getElementById('pubSlotsWrap');
  if(!wrap) return; // user navigated away before slots resolved
  wrap.innerHTML = slots.length
    ? `<div class="pub-slots">${slots.map(s=>`<button class="pub-slot-btn" data-pubslot="${s}">${s}</button>`).join('')}</div>`
    : `<div class="empty-note">No open times this day — try another date.</div>`;
  wirePublic();
}

function googleAddUrl(et, b){
  const start = `${b.date.replace(/-/g,'')}T${b.start.replace(':','')}00`;
  const end = `${b.date.replace(/-/g,'')}T${b.end.replace(':','')}00`;
  const params = new URLSearchParams({ action:'TEMPLATE', text:`${et.name} with ${b.inviteeName}`, dates:`${start}/${end}`, details: et.description||'' });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function icsForBooking(et, b){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const s = `${b.date.replace(/-/g,'')}T${b.start.replace(':','')}00`;
  const e = `${b.date.replace(/-/g,'')}T${b.end.replace(':','')}00`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AsanaDemo//Booking//EN','BEGIN:VEVENT',
    `UID:${b.id}@asana-demo`, `DTSTAMP:${stamp}`, `DTSTART:${s}`, `DTEND:${e}`,
    `SUMMARY:${et.name} with ${b.inviteeName}`, `DESCRIPTION:${(et.description||'').replace(/\n/g,'\\n')}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function wirePublic(){
  document.querySelectorAll('[data-pubdate]').forEach(b => b.addEventListener('click', () => { pubState.date = b.dataset.pubdate; pubState.step='date'; renderPubStep(); }));
  document.querySelectorAll('[data-pubslot]').forEach(b => b.addEventListener('click', () => { pubState.selectedTime = b.dataset.pubslot; pubState.step='form'; renderPubStep(); }));
  const back = document.getElementById('pubBack');
  if(back) back.addEventListener('click', () => { pubState.step='date'; renderPubStep(); });
  const confirm = document.getElementById('pfConfirm');
  if(confirm) confirm.addEventListener('click', async () => {
    const name = document.getElementById('pfName').value.trim();
    const email = document.getElementById('pfEmail').value.trim();
    if(!name || !email){ toast('Name and email are required'); return; }
    const et = S.eventTypes.find(x=>x.id===pubState.et);
    const noteEl = document.getElementById('pfNote');

    confirm.disabled = true; confirm.textContent = 'Checking availability…';

    // Final conflict re-check against the shared source of truth
    // (Supabase when configured, else local/Drive). This closes the
    // double-booking window: the slot list may be stale, so re-verify now.
    const freshSlots = await computeSlotsForDate(et, pubState.date);
    if(!freshSlots.includes(pubState.selectedTime)){
      confirm.disabled = false; confirm.textContent = 'Confirm booking';
      toast('Sorry — that time was just taken. Pick another.');
      pubState.step = 'date'; pubState.selectedTime = null;
      renderPubStep();
      return;
    }

    const b = { id:uid(), eventTypeId:et.id, date:pubState.date, start:pubState.selectedTime,
      end:minToTime(timeToMin(pubState.selectedTime)+et.duration), inviteeName:name, inviteeEmail:email,
      note: noteEl?noteEl.value.trim():'', status:'confirmed', gcalEventId:null, createdAt:todayISO() };

    confirm.textContent = 'Booking…';

    if(sbConfigured()){
      // Shared backend path: write to Supabase so YOU (and every other
      // visitor) can see it. The invitee's browser doesn't touch your
      // Google Calendar — you'll sync it from your Meetings tab.
      try{
        await sbInsertBooking(b, et);
      }catch(e){
        console.error(e);
        confirm.disabled = false; confirm.textContent = 'Confirm booking';
        toast('Could not save booking — please try again.');
        return;
      }
    } else {
      // Local-only fallback (no backend configured).
      S.bookings.push(b);
      if(S.google.connected){ try{ await gcalCreateTimedEvent(b, et); }catch(e){ console.error(e); } }
      save();
    }

    pubState.step = 'confirmed'; pubState.confirmedBooking = b;
    renderPubStep();
  });
}

/* ---------- Roadmap Calendar-lane drag-to-create ----------
   Attached once at the window level (not per-render) since .rm-cal-track
   elements are recreated on every render — only the pointerdown that
   starts a drag needs re-binding each time (done in wireDynamic below). */
let rmDrag = null;
window.addEventListener('pointermove', e => {
  if(!rmDrag) return;
  const curPct = Math.max(0, Math.min(100, (e.clientX - rmDrag.rect.left) / rmDrag.rect.width * 100));
  const left = Math.min(rmDrag.startPct, curPct), width = Math.abs(curPct - rmDrag.startPct);
  rmDrag.preview.style.left = left+'%';
  rmDrag.preview.style.width = Math.max(width, 0.4)+'%';
  rmDrag.curPct = curPct;
});
window.addEventListener('pointerup', () => {
  if(!rmDrag) return;
  const { startPct, curPct, preview, mode, topic } = rmDrag;
  preview.remove();
  rmDrag = null;
  if(curPct===undefined) return;
  const p1 = Math.min(startPct, curPct), p2 = Math.max(startPct, curPct);
  const d1 = dateAtPos(p1, S.roadmap.startMonth, S.roadmap.months);
  const d2raw = dateAtPos(p2, S.roadmap.startMonth, S.roadmap.months);
  const d2 = d2raw > d1 ? d2raw : d1;
  if(mode==='task') openTaskDrawPopup(d1, d2, topic);
  else createRoadmapEvent(d1, d2);
});

        S.supabase = prev;
        if(res.status===404) toast('Reached Supabase, but tables are missing — run the setup SQL in the SQL Editor');

        console.error('Supabase test failed', res.status, await res.text().catch(()=>''));

  const brc = document.getElementById('btnRestoreCfg');
  if(brc) brc.addEventListener('click', async () => {
    const cfg = await sbFetchConfig();
    if(cfg && Array.isArray(cfg.eventTypes) && cfg.eventTypes.length){
      S.eventTypes = cfg.eventTypes;
      if(cfg.availability && cfg.availability.weekly) S.availability = cfg.availability;
      save(); render();
      toast(`Restored ${cfg.eventTypes.length} event type${cfg.eventTypes.length===1?'':'s'} from backend`);
    } else {
      toast('Backend has no event types stored either — recreate them (takes a minute), they will re-publish automatically');
    }
  });
  document.querySelectorAll('[data-editevt]').forEach(b => b.addEventListener('click', () => { document.getElementById('evtFormSlot').innerHTML = renderEvtForm(b.dataset.editevt); wireEvtForm(b.dataset.editevt); }));
  document.querySelectorAll('[data-delevt]').forEach(b => b.addEventListener('click', () => { if(confirm('Delete this event type? Existing bookings are kept.')) deleteEventType(b.dataset.delevt); }));
  document.querySelectorAll('[data-toggleevt]').forEach(b => b.addEventListener('click', () => toggleEventType(b.dataset.toggleevt)));
  document.querySelectorAll('[data-copyevt]').forEach(b => b.addEventListener('click', async () => {
    const et = S.eventTypes.find(x=>x.id===b.dataset.copyevt);
    try{ await navigator.clipboard.writeText(publicBookingUrl(et)); toast('Booking link copied'); }
    catch(e){ toast(publicBookingUrl(et)); }
  }));

  // book tab — availability
  document.querySelectorAll('[data-avday]').forEach(cb => cb.addEventListener('change', () => { S.availability.weekly[cb.dataset.avday].enabled = cb.checked; save(); sbPublishConfig(); render(); }));
  document.querySelectorAll('[data-avstart]').forEach(i => i.addEventListener('change', () => { S.availability.weekly[i.dataset.avstart].start = i.value; save(); sbPublishConfig(); }));
  document.querySelectorAll('[data-avend]').forEach(i => i.addEventListener('change', () => { S.availability.weekly[i.dataset.avend].end = i.value; save(); sbPublishConfig(); }));
  const avSave = document.getElementById('avSave');
  if(avSave) avSave.addEventListener('click', () => {
    S.availability.timezone = document.getElementById('avTz').value.trim() || S.availability.timezone;
    S.availability.minNoticeHours = Number(document.getElementById('avNotice').value)||0;
    const lim = document.getElementById('avLimit').value;
    S.availability.dailyLimit = lim ? Number(lim) : null;
    save(); sbPublishConfig(); render(); toast('Availability rules saved');
  });
  const avBlockBtn = document.getElementById('avBlockBtn');
  if(avBlockBtn) avBlockBtn.addEventListener('click', () => {
    const d = document.getElementById('avBlockDate').value; if(!d) return;
    S.availability.overrides[d] = {blocked:true}; save(); render();
  });
  document.querySelectorAll('[data-unblock]').forEach(b => b.addEventListener('click', () => { delete S.availability.overrides[b.dataset.unblock]; save(); render(); }));

  // book tab — meetings
  document.querySelectorAll('[data-cancelbk]').forEach(b => b.addEventListener('click', () => { if(confirm('Cancel this booking?')) cancelBooking(b.dataset.cancelbk); }));
  const brm = document.getElementById('btnRefreshMeetings');
  if(brm) brm.addEventListener('click', () => { toast('Refreshing bookings…'); maybeSyncMeetings(true); });
}

function wireEvtForm(id){
  document.getElementById('efCancel').addEventListener('click', () => { document.getElementById('evtFormSlot').innerHTML=''; });
  document.getElementById('efSave').addEventListener('click', () => {
    const name = document.getElementById('efName').value.trim() || 'Untitled event';
    const data = {
      name, locationType: document.getElementById('efLoc').value,
      duration: Number(document.getElementById('efDur').value)||30,
      buffer: Number(document.getElementById('efBuf').value)||0,
      color: document.getElementById('efColor').value,
      questionLabel: document.getElementById('efQ').value.trim(),
      description: document.getElementById('efDesc').value.trim()
    };
    if(!id) data.slug = slugify(name);
    upsertEventType(data, id);
    toast(id ? 'Event type updated' : 'Event type created');
  });
}

/* ---------- Drawer ---------- */
function openDrawer(id){
  const t = S.tasks.find(x=>x.id===id); if(!t) return;
  editingId = id;
  document.getElementById('dTitle').value = t.title;
  document.getElementById('dProject').value = t.project||'';
  document.getElementById('dPriority').value = t.priority||'';
  document.getElementById('dStart').value = t.start||'';
  document.getElementById('dDue').value = t.due||'';
  document.getElementById('dRepeat').value = t.repeat||'';
  document.getElementById('dSection').value = t.section;
  document.getElementById('dNotes').value = t.notes||'';
  renderSubtasks(t);
  document.body.classList.add('drawer-open');
}

/* Subtasks save instantly (like Asana / Microsoft To Do steps) — no need
   to press "Save changes", which only commits the main task fields. */
function renderSubtasks(t){
  const st = t.subtasks || (t.subtasks = []);
  const done = st.filter(s=>s.done).length;
  document.getElementById('subCount').textContent = st.length ? `· ${done}/${st.length}` : '';
  document.getElementById('subFill').style.width = st.length ? `${Math.round(done/st.length*100)}%` : '0%';
  const list = document.getElementById('subList');
  list.innerHTML = st.map(s => `
    <div class="sub-item ${s.done?'done':''}" data-sid="${s.id}">
      <button class="checkbox ${s.done?'checked':''}" data-stoggle="${s.id}" aria-label="Toggle subtask">
        <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5 4.8 9 10 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <input class="sub-text" data-sedit="${s.id}" value="${esc(s.text)}">
      <button class="sub-del" data-sdel="${s.id}" aria-label="Delete subtask">✕</button>
    </div>`).join('');

  list.querySelectorAll('[data-stoggle]').forEach(b => b.addEventListener('click', () => {
    const s = st.find(x=>x.id===b.dataset.stoggle); s.done = !s.done;
    save(); renderSubtasks(t); refreshBackground();
  }));
  list.querySelectorAll('[data-sedit]').forEach(i => i.addEventListener('change', () => {
    const s = st.find(x=>x.id===i.dataset.sedit); s.text = i.value.trim()||s.text;
    save();
  }));
  list.querySelectorAll('[data-sdel]').forEach(b => b.addEventListener('click', () => {
    t.subtasks = st.filter(x=>x.id!==b.dataset.sdel);
    save(); renderSubtasks(t); refreshBackground();
  }));
}
function addSubtask(){
  const t = S.tasks.find(x=>x.id===editingId); if(!t) return;
  const inp = document.getElementById('subNewInput');
  const text = inp.value.trim(); if(!text) return;
  (t.subtasks || (t.subtasks=[])).push({id:uid(), text, done:false});
  inp.value=''; inp.focus();
  save(); renderSubtasks(t); refreshBackground();
}

/* AI autofill: suggests a priority + a short subtask checklist from just
   the title (and project, if set). Priority is only pre-selected in the
   dropdown — it still requires "Save changes" like any other field.
   Subtasks are added immediately (they always save instantly). */
async function aiAutofillTask(){
  const t = S.tasks.find(x=>x.id===editingId); if(!t) return;
  if(!S.gemini.apiKey){ toast('Add a free Gemini key in Sync → AI Assistant first'); return; }
  const btn = document.getElementById('btnAiAutofill');
  const title = document.getElementById('dTitle').value.trim();
  if(!title){ toast('Add a title first'); return; }
  const project = document.getElementById('dProject').value.trim();

  btn.disabled = true; btn.textContent = 'Thinking…';
  try{
    const prompt = `Task title: "${title}"${project?` (project: ${project})`:''}\n\nSuggest: 1) a priority of exactly "high", "medium", or "low" based on how the title reads (urgent/deadline language = high; routine/no urgency = low), 2) a short checklist of 2-4 concrete subtasks to complete it.\n\nRespond with ONLY raw JSON, no markdown fences, no explanation, in exactly this shape:\n{"priority":"high|medium|low","subtasks":["...","..."]}`;
    const raw = await callGemini(prompt);
    const cleaned = raw.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(cleaned);
    if(parsed.priority && ['high','medium','low'].includes(parsed.priority)){
      document.getElementById('dPriority').value = parsed.priority;
    }
    if(Array.isArray(parsed.subtasks) && parsed.subtasks.length){
      (t.subtasks || (t.subtasks=[])).push(...parsed.subtasks.slice(0,5).map(text => ({id:uid(), text:String(text), done:false})));
      save(); renderSubtasks(t); refreshBackground();
    }
    toast('Suggestions added — priority is pre-selected, click Save changes to keep it');
  }catch(e){
    console.error('AI autofill failed', e);
    const msg = String(e.message||e);
    if(msg.toLowerCase().includes('prepayment credits')) toast('Google says Gemini "prepayment credits are depleted" — a known billing-side issue on Google\u2019s end, not this app. Check aistudio.google.com/projects.');
    else if(msg.includes('HTTP_429')) toast('Gemini quota error (429) — see the ✦ chat panel for details, or try again shortly.');
    else toast('Autofill failed — see console (F12). The model may have replied in a format that could not be parsed.');
  }
  btn.disabled = false; btn.textContent = '✦ Suggest priority & subtasks from title';
}
/* Re-render the main view behind the drawer (progress pills) without
   touching the drawer itself. */
function refreshBackground(){
  const m = document.getElementById('main');
  if(S.view==='roadmap') m.innerHTML = renderRoadmap();
  else if(S.view==='today') m.innerHTML = renderToday();
  else if(S.view==='list') m.innerHTML = renderList();
  else if(S.view==='shared') m.innerHTML = renderShared();
  else if(S.view==='table') m.innerHTML = renderTable();
  else if(S.view==='board') m.innerHTML = renderBoard();
  else if(S.view==='calendar') m.innerHTML = renderCalendar();
  else if(S.view==='finance') m.innerHTML = renderFinance();
  else m.innerHTML = renderSync();
  wireDynamic();
}
function closeDrawer(){ document.body.classList.remove('drawer-open'); editingId = null; }
function saveDrawer(){
  const t = S.tasks.find(x=>x.id===editingId); if(!t) return;
  const oldPri = t.priority, oldDue = t.due;
  t.title = document.getElementById('dTitle').value.trim()||'Untitled task';
  t.project = document.getElementById('dProject').value.trim();
  t.priority = document.getElementById('dPriority').value||null;
  t.start = document.getElementById('dStart').value||null;
  t.due = document.getElementById('dDue').value||null;
  t.repeat = document.getElementById('dRepeat').value||null;
  t.section = document.getElementById('dSection').value;
  t.notes = document.getElementById('dNotes').value;
  if(t.priority!==oldPri && t.priority==='high') fireRules(t,'priority');
  if(t.due!==oldDue) fireRules(t,'due');
  closeDrawer(); save(); render(); toast('Task updated');
}

/* ---------- Utilities ---------- */
function download(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 400);
}
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}

const initReady = init();   // keep the promise so route() can wait for state
window.addEventListener('hashchange', route);
async function route(){
  const hash = location.hash; // '#book/<slug>' → public booking page, no app chrome
  const m = hash.match(/^#book\/(.+)$/);
  document.getElementById('appRoot').style.display = m ? 'none' : '';
  document.getElementById('publicBookingRoot').style.display = m ? 'flex' : 'none';
  if(m){
    await initReady;          // S must exist before the booking page renders
    renderPublicBooking(decodeURIComponent(m[1]));
  }
}
route();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('SW registration failed:', err));
  });
}

// Running from file:// (double-clicking the HTML) breaks Google OAuth
// (invalid origin) and can confuse backend testing — warn loudly.
if(location.protocol === 'file:'){
  const warn = document.createElement('div');
  warn.style.cssText = 'background:#e8384f;color:#fff;font-size:.85rem;font-weight:600;padding:10px 20px;text-align:center';
  warn.textContent = '⚠ You are opening this file locally (file://). Google login and booking links only work on the deployed site — open your deployed GitHub Pages URL instead.';
  document.body.prepend(warn);
}
