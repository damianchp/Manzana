<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Manzana</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1d2733">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#1d2733;
  --ink-soft:#4a5568;
  --ink-faint:#8a94a3;
  --paper:#f6f7f9;
  --card:#ffffff;
  --line:#e4e8ee;
  --accent:#f25d52;        /* Asana-family coral, anchors the product identity */
  --accent-soft:#fdeceb;
  --hi:#e8384f;  --hi-bg:#fdebee;
  --md:#e08c00;  --md-bg:#fdf3e3;
  --lo:#5a7dde;  --lo-bg:#eef2fc;
  --sync:#12a594; --sync-bg:#e6f6f3;
  --gcal:#4285f4;
  --radius:10px;
  --shadow:0 1px 2px rgba(29,39,51,.06),0 4px 14px rgba(29,39,51,.06);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Instrument Sans',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Top bar ---------- */
header.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:var(--ink);color:#f4f6f9;
  position:sticky;top:0;z-index:40;
}
.logo{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo .dot{width:11px;height:11px;border-radius:50% 50% 48% 48%;background:#6cc04a;box-shadow:0 0 0 4px rgba(108,192,74,.22);position:relative}
.logo .dot::after{content:"";position:absolute;top:-4px;left:55%;width:6px;height:4px;border-radius:60% 40% 60% 40%;background:#3f8f2f}
.topbar .sub{font-size:.78rem;color:#9aa7b6;font-weight:400}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip-btn{
  font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.1);color:#e7ecf2;transition:background .15s;
}
.chip-btn:hover{background:rgba(255,255,255,.2)}

/* ---------- Weekly focus banner ---------- */
.focus-banner{
  background:linear-gradient(90deg,#1d2733 0%,#2b3a4d 100%);
  color:#f4f6f9;padding:10px 20px;display:flex;align-items:center;gap:12px;
  border-top:1px solid rgba(255,255,255,.08);
}
.focus-banner .label{
  font-family:'Sora';font-size:.66rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
.focus-banner input{
  flex:1;background:transparent;border:none;color:#f4f6f9;font-size:.95rem;
  font-weight:500;border-bottom:1px dashed transparent;padding:2px 0;
}
.focus-banner input:hover,.focus-banner input:focus{border-bottom-color:rgba(255,255,255,.35);outline:none}

/* ---------- Toolbar ---------- */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 20px 10px;
}
.view-tabs{display:flex;background:#eceff3;border-radius:99px;padding:3px}
.view-tabs button{
  padding:7px 16px;border-radius:99px;font-size:.85rem;font-weight:600;color:var(--ink-soft);
  transition:all .15s;
}
.view-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.view-tabs button .badge{
  display:inline-block;margin-left:6px;font-size:.65rem;font-weight:700;
  background:var(--sync-bg);color:var(--sync);padding:1px 6px;border-radius:99px;
}
.toolbar .spacer{flex:1}
.sort-wrap{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-soft)}
.sort-wrap select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);
  font-size:.82rem;font-weight:500;
}
.quickadd{
  display:flex;gap:8px;padding:0 20px 6px;
}
.quickadd input[type=text]{
  flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  background:var(--card);font-size:.92rem;
}
.quickadd input[type=text]::placeholder{color:var(--ink-faint)}
.quickadd .add-btn{
  background:var(--accent);color:#fff;font-weight:600;font-size:.88rem;
  padding:0 18px;border-radius:var(--radius);transition:filter .15s;
}
.quickadd .add-btn:hover{filter:brightness(1.06)}

main{padding:8px 20px 60px;max-width:1200px;margin:0 auto}

/* ---------- List view ---------- */
.section-block{margin-bottom:22px}
.section-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
  font-family:'Sora';font-weight:600;font-size:.92rem;
}
.section-head .count{font-family:'Instrument Sans';font-weight:500;font-size:.75rem;color:var(--ink-faint)}
.task-row{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:box-shadow .15s,border-color .15s;
}
.task-row:hover{box-shadow:var(--shadow);border-color:#d3dae3}
.task-row.done{opacity:.5}
.task-row.done .t-title{text-decoration:line-through}
.checkbox{
  width:19px;height:19px;min-width:19px;border:1.6px solid #b7c0cc;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:all .15s;background:none;
}
.checkbox:hover{border-color:var(--sync);color:var(--sync)}
.checkbox.checked{background:var(--sync);border-color:var(--sync);color:#fff}
.checkbox svg{width:11px;height:11px}
.t-title{flex:1;font-size:.92rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;
}
.pill.project{background:#eef1f5;color:var(--ink-soft)}
.pill.p-high{background:var(--hi-bg);color:var(--hi)}
.pill.p-medium{background:var(--md-bg);color:var(--md)}
.pill.p-low{background:var(--lo-bg);color:var(--lo)}
.pill.synced{background:var(--sync-bg);color:var(--sync)}
.t-due{font-size:.78rem;font-weight:500;color:var(--ink-faint);white-space:nowrap;min-width:64px;text-align:right}
.t-due.overdue{color:var(--hi);font-weight:600}
.t-due.today{color:var(--sync);font-weight:600}
.empty-note{font-size:.82rem;color:var(--ink-faint);padding:8px 4px}

/* ---------- Board view ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.board-col{background:#eef0f4;border-radius:14px;padding:10px;min-height:120px}
.board-col.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.board-col h3{font-family:'Sora';font-size:.84rem;font-weight:600;padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.board-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(29,39,51,.05);
}
.board-card:active{cursor:grabbing}
.board-card .bc-title{font-size:.88rem;font-weight:500;margin-bottom:7px}
.board-card .bc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.board-card.done{opacity:.5}
.board-card.done .bc-title{text-decoration:line-through}

/* ---------- Calendar view ---------- */
.cal-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.cal-layout{grid-template-columns:1fr}}
.unsched{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
}
.unsched h3{font-family:'Sora';font-size:.82rem;font-weight:600;margin-bottom:4px}
.unsched p.hint{font-size:.72rem;color:var(--ink-faint);margin-bottom:10px;line-height:1.4}
.unsched .board-card{margin-bottom:6px;padding:8px 10px}
.cal-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h3{font-family:'Sora';font-size:.98rem;font-weight:600;flex:1}
.cal-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--card)}
.cal-nav:hover{background:var(--paper)}
.cal-legend{display:flex;gap:12px;font-size:.68rem;color:var(--ink-faint);padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-legend .key{display:flex;align-items:center;gap:5px}
.cal-legend .swatch{width:9px;height:9px;border-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal-cell{
  min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:5px;position:relative;min-width:0;overflow:hidden;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other{background:#fafbfc;color:var(--ink-faint)}
.cal-cell.today-cell{background:#fbf3f2}
.cal-cell .daynum{font-size:.72rem;font-weight:600;padding:1px 4px;display:inline-block;border-radius:6px}
.cal-cell.today-cell .daynum{background:var(--accent);color:#fff}
.cal-cell.dragover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.cal-chip{
  display:block;width:100%;max-width:100%;box-sizing:border-box;text-align:left;font-size:.68rem;font-weight:600;
  padding:2px 6px;border-radius:5px;margin-top:3px;cursor:grab;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;
}
.cal-chip.p-high{background:var(--hi-bg);color:var(--hi)}
.cal-chip.p-medium{background:var(--md-bg);color:var(--md)}
.cal-chip.p-low{background:var(--lo-bg);color:var(--lo)}
.cal-chip.p-none{background:#eef1f5;color:var(--ink-soft)}
.cal-chip.done{opacity:.45;text-decoration:line-through}
.cal-chip.gcal-event{
  background:#fff;border:1.4px dashed var(--gcal);color:var(--gcal);cursor:default;
}

/* ---------- Sync pipeline view (signature) ---------- */
.sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.sync-grid{grid-template-columns:1fr}}
.sync-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.sync-card h3{font-family:'Sora';font-size:.95rem;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sync-card p.desc{font-size:.8rem;color:var(--ink-soft);line-height:1.5;margin-bottom:14px}
.dir-tag{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.dir-tag.oneway{background:var(--sync-bg);color:var(--sync)}
.dir-tag.rules{background:#e8f0fe;color:var(--gcal)}
.pipeline{
  display:flex;align-items:center;gap:0;margin:6px 0 16px;
}
.pipe-node{
  flex:1;text-align:center;padding:12px 8px;border-radius:12px;font-size:.78rem;font-weight:600;
}
.pipe-node.asana{background:var(--accent-soft);color:var(--accent)}
.pipe-node.gcal{background:#e8f0fe;color:var(--gcal)}
.pipe-node small{display:block;font-weight:400;font-size:.66rem;margin-top:2px;color:var(--ink-faint)}
.pipe-flow{
  flex:1.2;height:2px;position:relative;margin:0 -4px;
  background-image:linear-gradient(90deg,var(--sync) 55%,transparent 45%);
  background-size:12px 2px;
}
.pipe-flow.animate{animation:flow 1s linear infinite}
@keyframes flow{to{background-position:12px 0}}
@media(prefers-reduced-motion:reduce){.pipe-flow.animate{animation:none}}
.pipe-flow::after{
  content:"→";position:absolute;right:-4px;top:-11px;color:var(--sync);font-size:.9rem;
}
.ics-preview{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;line-height:1.55;
  background:#141a21;color:#a9c7b8;border-radius:10px;padding:12px 14px;
  max-height:210px;overflow:auto;white-space:pre;margin-bottom:12px;
}
.ics-preview .hl{color:#f2b56b}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:9px;transition:filter .15s;
}
.btn.primary{background:var(--sync);color:#fff}
.btn.blue{background:var(--gcal);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink-soft)}
.btn:hover{filter:brightness(1.05)}
.feed-url{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;background:var(--paper);
  border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;
  color:var(--ink-soft);overflow-wrap:anywhere;
}
.rule-item{
  display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:10px;
}
.rule-item .rule-text{flex:1;font-size:.82rem;line-height:1.45}
.rule-item .rule-text b{font-weight:600}
.rule-item code{
  font-family:'JetBrains Mono',monospace;font-size:.72rem;background:var(--paper);
  padding:1px 5px;border-radius:4px;border:1px solid var(--line);
}
.switch{position:relative;width:38px;height:22px;min-width:38px}
.switch input{opacity:0;width:0;height:0}
.switch .track{
  position:absolute;inset:0;background:#cfd6df;border-radius:99px;transition:background .15s;cursor:pointer;
}
.switch .track::after{
  content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .track{background:var(--sync)}
.switch input:checked + .track::after{transform:translateX(16px)}
.log-list{max-height:230px;overflow:auto}
.log-entry{
  font-size:.76rem;padding:8px 10px;border-left:3px solid var(--sync);background:var(--paper);
  border-radius:0 8px 8px 0;margin-bottom:6px;line-height:1.45;
}
.log-entry.rule{border-left-color:var(--gcal)}
.log-entry time{display:block;font-size:.64rem;color:var(--ink-faint);font-family:'JetBrains Mono',monospace}
.arch-note{
  grid-column:1/-1;background:var(--ink);color:#c7d1dd;border-radius:14px;padding:18px 20px;
  font-size:.82rem;line-height:1.65;
}
.arch-note h3{font-family:'Sora';color:#fff;font-size:.9rem;margin-bottom:8px}
.arch-note b{color:#fff}
.arch-note .k{color:var(--accent)}

/* ---------- Task drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(20,26,33,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);background:var(--card);
  z-index:61;box-shadow:-10px 0 40px rgba(20,26,33,.18);transform:translateX(105%);
  transition:transform .22s ease;display:flex;flex-direction:column;
}
body.drawer-open .drawer{transform:none}
body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:'Sora';font-size:.95rem;flex:1}
.drawer-body{padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);font-size:.9rem;
}
.field textarea{resize:vertical;min-height:70px}
.drawer-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn.danger{background:var(--hi-bg);color:var(--hi)}
.btn.accent{background:var(--accent);color:#fff;flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.icon-btn:hover{background:var(--paper);color:var(--ink)}

/* ---------- Google connect pill (topbar) ---------- */
.gpill{
  display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;
  padding:5px 10px 5px 6px;border-radius:99px;background:rgba(255,255,255,.1);color:#e7ecf2;
}
.gpill .dot2{width:7px;height:7px;border-radius:50%;background:#8a94a3}
.gpill.on .dot2{background:#4ec9a3}
.gpill button{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---------- Subtasks ---------- */
.pill.progress{background:#eef1f5;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill.progress.complete{background:var(--sync-bg);color:var(--sync)}
.sub-list{display:flex;flex-direction:column;gap:2px}
.sub-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px}
.sub-item:hover{background:var(--paper)}
.sub-item .checkbox{width:16px;height:16px;min-width:16px}
.sub-item .sub-text{flex:1;font-size:.87rem;border:none;background:transparent;padding:2px 0}
.sub-item.done .sub-text{text-decoration:line-through;color:var(--ink-faint)}
.sub-item .sub-del{color:var(--ink-faint);font-size:.85rem;opacity:0;transition:opacity .12s;padding:2px 6px;border-radius:6px}
.sub-item:hover .sub-del{opacity:1}
.sub-item .sub-del:hover{color:var(--hi);background:var(--hi-bg)}
.sub-add{display:flex;gap:6px;margin-top:6px}
.sub-add input{flex:1;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-size:.85rem;background:var(--paper)}
.sub-add button{background:var(--accent);color:#fff;font-weight:600;font-size:.78rem;padding:0 13px;border-radius:8px}
.sub-progress-bar{height:4px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.sub-progress-bar .fill{height:100%;background:var(--sync);border-radius:99px;transition:width .25s}

/* ---------- Book tab (Calendly-style scheduling) ---------- */
.book-subtabs{display:flex;background:#eceff3;border-radius:99px;padding:3px;margin-bottom:16px;width:fit-content}
.book-subtabs button{padding:7px 16px;border-radius:99px;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.book-subtabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.evt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.evt-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.evt-card.inactive{opacity:.5}
.evt-card .evt-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.evt-card h4{font-family:'Sora';font-size:.95rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center}
.evt-card .evt-meta{font-size:.76rem;color:var(--ink-faint);margin-bottom:10px}
.evt-card .evt-desc{font-size:.8rem;color:var(--ink-soft);margin-bottom:12px;min-height:0}
.evt-card .evt-actions{display:flex;gap:6px;flex-wrap:wrap}
.evt-link-row{
  font-family:'JetBrains Mono',monospace;font-size:.66rem;background:var(--paper);border:1px dashed var(--line);
  border-radius:7px;padding:6px 8px;margin-bottom:10px;overflow-wrap:anywhere;color:var(--ink-soft);
}
.evt-new-card{
  border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;
  min-height:140px;color:var(--ink-faint);font-weight:600;font-size:.85rem;cursor:pointer;
}
.evt-new-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.evt-form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.evt-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.evt-form .grid2{grid-template-columns:1fr}}

.avail-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.avail-day-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.avail-day-row:last-child{border-bottom:none}
.avail-day-row .dayname{width:100px;font-size:.85rem;font-weight:600}
.avail-day-row input[type=time]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:.82rem}
.avail-day-row .to{color:var(--ink-faint);font-size:.8rem}
.avail-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avail-row label{font-size:.82rem;font-weight:600;color:var(--ink-soft);min-width:150px}
.avail-row input[type=number],.avail-row select{border:1px solid var(--line);border-radius:7px;padding:6px 9px;font-size:.85rem}
.override-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:.76rem;background:var(--hi-bg);color:var(--hi);
  padding:4px 9px;border-radius:99px;margin:3px 6px 3px 0;
}
.override-tag button{font-weight:700}

.mtg-row{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-bottom:8px;
}
.mtg-date{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper);border-radius:9px;padding:6px 12px;min-width:54px;
}
.mtg-date .dow{font-size:.62rem;font-weight:700;color:var(--ink-faint);text-transform:uppercase}
.mtg-date .dnum{font-family:'Sora';font-weight:700;font-size:1.05rem}
.mtg-info{flex:1;min-width:0}
.mtg-info .mtg-title{font-size:.9rem;font-weight:600}
.mtg-info .mtg-sub{font-size:.78rem;color:var(--ink-faint)}
.mtg-row.cancelled{opacity:.5}
.mtg-row.cancelled .mtg-title{text-decoration:line-through}

/* ---------- Public booking page (standalone, no app chrome) ---------- */
#publicBookingRoot{min-height:100vh;background:var(--paper);display:flex;justify-content:center;padding:32px 16px}
.pub-card{
  background:var(--card);border-radius:18px;box-shadow:var(--shadow);max-width:760px;width:100%;
  padding:0;overflow:hidden;height:fit-content;
}
.pub-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.pub-head .evt-dot{width:12px;height:12px;border-radius:50%;margin-top:5px}
.pub-head h2{font-family:'Sora';font-size:1.15rem;font-weight:700}
.pub-head p{font-size:.84rem;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.pub-head .pub-meta{font-size:.78rem;color:var(--ink-faint);margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.pub-body{padding:22px 26px}
.pub-dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.pub-date-btn{
  min-width:58px;text-align:center;padding:9px 4px;border-radius:10px;border:1px solid var(--line);
  font-size:.76rem;font-weight:600;color:var(--ink-soft);flex-shrink:0;
}
.pub-date-btn .d{font-size:.64rem;color:var(--ink-faint);text-transform:uppercase;display:block;margin-bottom:2px}
.pub-date-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pub-date-btn.active .d{color:#fde4e1}
.pub-date-btn:disabled{opacity:.3;cursor:not-allowed}
.pub-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pub-slot-btn{
  padding:9px 4px;border-radius:9px;border:1px solid var(--line);font-size:.82rem;font-weight:600;
  color:var(--ink-soft);background:var(--card);
}
.pub-slot-btn:hover{border-color:var(--accent);color:var(--accent)}
.pub-slot-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.pub-form .field{margin-bottom:12px}
.pub-confirm{text-align:center;padding:20px 10px}
.pub-confirm .check-big{
  width:52px;height:52px;border-radius:50%;background:var(--sync-bg);color:var(--sync);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:1.6rem;
}
.pub-confirm h2{font-family:'Sora';margin-bottom:8px}
.pub-confirm p{color:var(--ink-soft);font-size:.88rem;margin-bottom:16px}
.pub-footer-link{padding:14px 26px;border-top:1px solid var(--line);font-size:.74rem;color:var(--ink-faint);text-align:center}

/* ---------- Calendar personal/professional overlay ---------- */
.cal-show-toggle{display:flex;gap:6px;margin-left:auto}
.cal-show-toggle button{
  font-size:.72rem;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--line);color:var(--ink-soft);
}
.cal-show-toggle button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal-chip.booking{background:#f0e9fb;color:#7c4fd1;border:1px solid transparent}
.cal-chip.booking::before{content:"◐ ";}

/* ---------- Today dashboard ---------- */
.today-focus{
  background:linear-gradient(90deg,#1d2733,#2b3a4d);color:#fff;border-radius:14px;
  padding:16px 20px;margin-bottom:18px;
}
.today-focus .label{font-family:'Sora';font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.today-focus .text{font-size:1.02rem;font-weight:600;margin-top:4px}
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.today-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.today-card h3{font-family:'Sora';font-size:.88rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.today-card h3 .count{font-weight:500;color:var(--ink-faint);font-size:.76rem}
.today-ai-btn{
  width:100%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem;
  padding:11px;border-radius:10px;margin-top:4px;
}
.today-ai-btn:hover{filter:brightness(0.97)}

/* ---------- Table view ---------- */
.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.table-toolbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.82rem;background:var(--card)}
table.data-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.data-table th{
  text-align:left;font-family:'Sora';font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-soft);padding:10px 12px;background:var(--paper);cursor:pointer;user-select:none;white-space:nowrap;
}
table.data-table th:hover{color:var(--accent)}
table.data-table th .arrow{font-size:.7rem;margin-left:3px;color:var(--accent)}
table.data-table td{padding:10px 12px;font-size:.85rem;border-top:1px solid var(--line);vertical-align:middle}
table.data-table tr.trow{cursor:pointer}
table.data-table tr.trow:hover td{background:var(--paper)}
table.data-table tr.done td{opacity:.5}
table.data-table tr.done .t-title-cell{text-decoration:line-through}

/* ---------- AI Assistant (Gemini) ---------- */
#aiFab{
  position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:1.3rem;box-shadow:0 6px 20px rgba(29,39,51,.28);
  z-index:70;transition:transform .15s;
}
#aiFab:hover{transform:scale(1.06)}
#aiPanel{
  position:fixed;right:22px;bottom:86px;width:min(380px,92vw);max-height:min(70vh,560px);
  background:var(--card);border-radius:16px;box-shadow:0 12px 40px rgba(29,39,51,.22);
  z-index:70;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line);
}
body.ai-open #aiPanel{display:flex}
.ai-head{
  display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--ink);color:#fff;
  font-family:'Sora';font-weight:600;font-size:.88rem;
}
.ai-head button{margin-left:auto;color:#c7d1dd}
.ai-quicks{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ai-quicks button{
  font-size:.72rem;font-weight:600;padding:6px 10px;border-radius:99px;background:var(--paper);
  color:var(--ink-soft);border:1px solid var(--line);
}
.ai-quicks button:hover{border-color:var(--accent);color:var(--accent)}
.ai-messages{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.ai-msg{max-width:86%;font-size:.85rem;line-height:1.5;padding:9px 12px;border-radius:12px;white-space:pre-wrap}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
.ai-msg.bot{align-self:flex-start;background:var(--paper);color:var(--ink);border-bottom-left-radius:3px}
.ai-msg.bot.thinking{color:var(--ink-faint);font-style:italic}
.ai-msg.bot.setup-needed{background:var(--md-bg);color:var(--md)}
.ai-input-row{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.ai-input-row input{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:.85rem}
.ai-input-row button{width:36px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700}

/* ---------- Cloud sync card ---------- */
.cloud-card .status-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.status-dot{width:9px;height:9px;border-radius:50%;background:#cfd6df}
.status-dot.on{background:var(--sync)}
.status-dot.warn{background:var(--md)}
.setup-steps{font-size:.78rem;color:var(--ink-soft);line-height:1.7;margin-bottom:12px;padding-left:18px}
.setup-steps li{margin-bottom:2px}
.setup-steps code{font-family:'JetBrains Mono',monospace;font-size:.72rem;background:var(--paper);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}

/* ---------- Roadmap view (topic timeline / landing tab) ---------- */
.topic-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.roadmap-wrap{display:flex;flex-direction:column;gap:14px}
.roadmap-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rm-range-tabs{display:flex;background:#eceff3;border-radius:99px;padding:3px}
.rm-range-tabs button{padding:7px 14px;border-radius:99px;font-size:.82rem;font-weight:600;color:var(--ink-soft);transition:all .15s}
.rm-range-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.roadmap-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.roadmap-header{display:flex}
.rm-label-head{width:190px;flex-shrink:0;border-bottom:1px solid var(--line)}
.rm-months-head{flex:1;display:flex;border-bottom:1px solid var(--line)}
.rm-months-head .rm-month-cell{flex:1;text-align:center;font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);padding:9px 2px;border-left:1px solid var(--line)}
.rm-months-head .rm-month-cell:first-child{border-left:none}
.rm-months-head .rm-month-cell.rm-current{color:var(--accent)}
.roadmap-body{max-height:540px;overflow-y:auto}
.roadmap-row{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.roadmap-row:last-child{border-bottom:none}
.rm-label{width:190px;flex-shrink:0;padding:11px 12px;font-size:.82rem;font-weight:600;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-label .count{font-weight:500;font-size:.7rem;color:var(--ink-faint);white-space:nowrap}
.rm-track{flex:1;display:flex;position:relative;height:42px}
.rm-track .rm-month-cell{flex:1;border-left:1px solid var(--line)}
.rm-track .rm-month-cell:first-child{border-left:none}
.rm-track .rm-month-cell.rm-current{background:#fbf3f2}
.rm-band{position:absolute;top:50%;transform:translateY(-50%);height:12px;border-radius:99px;border:1.4px solid transparent;min-width:12px}
.rm-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;border:2px solid var(--card);cursor:pointer;box-shadow:0 0 0 1px rgba(29,39,51,.08)}
.rm-marker.rm-p-high{background:var(--hi)}
.rm-marker.rm-p-medium{background:var(--md)}
.rm-marker.rm-p-low{background:var(--lo)}
.rm-marker.rm-p-none{background:var(--ink-faint)}
.rm-marker.rm-done{background:var(--sync);opacity:.5}
.rm-overflow-left,.rm-overflow-right{position:absolute;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--ink-faint)}
.rm-overflow-left{left:2px}
.rm-overflow-right{right:2px}
.rm-cal-track{cursor:crosshair;user-select:none}
.rm-task-track{cursor:crosshair;user-select:none}
.rm-cal-event{
  position:absolute;height:20px;border-radius:6px;background:#fff;border:1.4px solid var(--gcal);color:var(--gcal);
  font-size:.7rem;font-weight:600;text-align:left;padding:0 8px;line-height:18px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
}
.rm-cal-event:hover{background:#e8f0fe}
.rm-cal-draw-preview{
  position:absolute;top:7px;height:20px;border-radius:6px;background:var(--accent-soft);
  border:1.4px dashed var(--accent);pointer-events:none;
}
.rm-popup-scrim{position:fixed;inset:0;background:rgba(20,26,33,.35);z-index:65;display:flex;align-items:center;justify-content:center;padding:20px}
.rm-popup{background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(29,39,51,.25);width:min(360px,92vw);padding:20px}
.rm-popup h3{font-family:'Sora';font-size:1rem;margin-bottom:4px}
.rm-popup .rm-popup-dates{font-size:.78rem;color:var(--ink-faint);margin-bottom:14px}
.rm-popup .field{margin-bottom:12px}
.rm-popup .btn-row{margin-top:2px;justify-content:flex-end}

/* ---------- Shared list (family to-do) ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}

/* ---------- Finance tab ---------- */
.fin-subtabs{display:flex;background:#eceff3;border-radius:99px;padding:3px;margin-bottom:16px;width:fit-content;flex-wrap:wrap}
.fin-subtabs button{padding:7px 16px;border-radius:99px;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.fin-subtabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fin-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.fin-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.fin-tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fin-tile .fin-tile-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:4px}
.fin-tile .fin-tile-val{font-family:'Sora';font-size:1.15rem;font-weight:700}
.fin-tile.income .fin-tile-val{color:var(--sync)}
.fin-tile.bills .fin-tile-val{color:var(--hi)}
.fin-tile.low .fin-tile-val{color:var(--md)}
.fin-month-block{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.fin-month-head{padding:12px 14px;border-bottom:1px solid var(--line);font-family:'Sora';font-weight:600;font-size:.92rem}
.fin-cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.fin-cal-dow{font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);text-align:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fin-cal-cell{min-height:64px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;position:relative;min-width:0;overflow:hidden}
.fin-cal-cell:nth-child(7n){border-right:none}
.fin-cal-cell.other{background:#fafbfc;color:var(--ink-faint)}
.fin-cal-cell.today-cell{background:#fbf3f2}
.fin-cal-cell .daynum{font-size:.68rem;font-weight:600}
.fin-item-chip{display:block;font-size:.62rem;font-weight:600;padding:1px 5px;border-radius:4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.fin-item-chip.expense{background:var(--hi-bg);color:var(--hi)}
.fin-item-chip.income{background:var(--sync-bg);color:var(--sync)}
.fin-item-chip.transfer{background:var(--lo-bg);color:var(--lo)}
.fin-item-chip.projected{border-style:dashed;opacity:.75}
.fin-proj-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.fin-proj-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.8rem}
.fin-proj-row .fin-proj-date{width:64px;flex-shrink:0;color:var(--ink-soft);font-weight:600}
.fin-proj-row .fin-proj-bar-wrap{flex:1;height:8px;background:#eef1f5;border-radius:99px;overflow:hidden}
.fin-proj-row .fin-proj-bar{height:100%;border-radius:99px;background:var(--sync)}
.fin-proj-row.low .fin-proj-bar{background:var(--hi)}
.fin-proj-row .fin-proj-amt{width:76px;text-align:right;font-weight:700;font-family:'Sora'}
.fin-proj-row.low .fin-proj-amt{color:var(--hi)}
.fin-acct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px}
.fin-acct-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.fin-acct-card .fin-acct-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fin-acct-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.fin-acct-card .fin-acct-name{font-weight:600;font-size:.92rem;flex:1}
.fin-acct-card .fin-acct-bal{font-family:'Sora';font-size:1.3rem;font-weight:700}
.fin-acct-new{border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;min-height:96px;color:var(--ink-faint);font-weight:600;font-size:.85rem;cursor:pointer}
.fin-acct-new:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.fin-tx-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin-bottom:6px;cursor:pointer}
.fin-tx-row:hover{box-shadow:var(--shadow);border-color:#d3dae3}
.fin-tx-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.fin-tx-row .fin-tx-main{flex:1;min-width:0}
.fin-tx-row .fin-tx-title{font-size:.9rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-tx-row .fin-tx-sub{font-size:.74rem;color:var(--ink-faint)}
.fin-tx-row .fin-tx-amt{font-family:'Sora';font-weight:700;font-size:.92rem;white-space:nowrap}
.fin-tx-amt.expense{color:var(--hi)}
.fin-tx-amt.income{color:var(--sync)}
.fin-tx-amt.transfer{color:var(--lo)}
.fin-rec-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.fin-rec-row.inactive{opacity:.5}
.fin-rec-row .fin-rec-main{flex:1;min-width:0}
.fin-rec-row .fin-rec-title{font-weight:600;font-size:.9rem}
.fin-rec-row .fin-rec-sub{font-size:.76rem;color:var(--ink-faint)}
.fin-budget-row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.fin-budget-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:.86rem}
.fin-budget-top .fin-budget-name{font-weight:600;flex:1}
.fin-budget-top input{width:90px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:.82rem;text-align:right}
.fin-budget-bar-wrap{height:7px;background:#eef1f5;border-radius:99px;overflow:hidden}
.fin-budget-bar{height:100%;border-radius:99px;background:var(--sync)}
.fin-budget-bar.over{background:var(--hi)}
.fin-budget-sub{font-size:.72rem;color:var(--ink-faint);margin-top:4px}
.fin-popup-scrim{position:fixed;inset:0;background:rgba(20,26,33,.35);z-index:65;display:flex;align-items:center;justify-content:center;padding:20px}
.fin-popup{background:var(--card);border-radius:14px;box-shadow:0 12px 40px rgba(29,39,51,.25);width:min(400px,92vw);padding:20px;max-height:88vh;overflow:auto}
.fin-popup h3{font-family:'Sora';font-size:1rem;margin-bottom:14px}
.fin-popup .field{margin-bottom:12px}
.fin-popup .btn-row{margin-top:4px;justify-content:flex-end}
.fin-kind-tabs{display:flex;background:#eceff3;border-radius:99px;padding:3px;margin-bottom:12px}
.fin-kind-tabs button{flex:1;padding:7px 10px;border-radius:99px;font-size:.8rem;font-weight:600;color:var(--ink-soft)}
.fin-kind-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fin-cat-picker{display:flex;flex-wrap:wrap;gap:6px}
.fin-cat-pick{font-size:.76rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1.4px solid var(--line);background:var(--card)}
.fin-cat-pick.active{border-color:currentColor}

/* ---------- Toast ---------- */
#toast{

/* ---------- Persistence adapter ----------
   Order of preference:
   1. window.storage  (Claude artifact environment)
   2. localStorage    (when this file is opened directly in a browser)
   3. in-memory       (fallback) */
/* Optional: hard-code your Supabase creds here after deploying so the
   PUBLIC booking link works in a stranger's fresh browser (they have no

const BUILD_SUPABASE = { url:'https://ricbcxgtjuotuppizjtn.supabase.co', anonKey:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpY2JjeGd0anVvdHVwcGl6anRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxODY2NDgsImV4cCI6MjA5ODc2MjY0OH0.QD6wUI9FWXOOiiiSdQ967qx8N1xATWYvFLxkrV4HmNU' };

  mem: null,
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}

  },
  async save(state){
    const v = JSON.stringify(state);

/* ---------- Helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const addDays = (base, n) => { const d = new Date(base); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (base, n) => { const d = new Date(base); const day = d.getDate(); d.setMonth(d.getMonth()+n); if(d.getDate()<day) d.setDate(0); return iso(d); };
function nextRepeatDate(dueISO, repeat){
  if(!dueISO) return null;
  if(repeat==='daily') return addDays(dueISO, 1);
  if(repeat==='weekly') return addDays(dueISO, 7);
  if(repeat==='monthly') return addMonths(dueISO, 1);
  return null;
}
/* Spawn the next occurrence when a repeating task is completed. The
   completed instance stays completed (a record you did it); a fresh
   instance is created with the shifted due date, undone, no gcal link
   of its own yet. */
function spawnNextRepeat(t){
  if(!t.repeat || !t.due) return;
  const nextDue = nextRepeatDate(t.due, t.repeat);
  if(!nextDue) return;
  const clone = {
    id: uid(), title: t.title, project: t.project, priority: t.priority,
    start: null, due: nextDue, repeat: t.repeat,
    section: nextDue===todayISO() ? 'today' : 'upcoming',
    done: false, notes: t.notes,

}
const fmtDue = s => {

  const diff = Math.round((d-t)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Topic color + month/date math (shared by Roadmap + Shared tabs) ----------
   "Topic" is just the existing free-text project field, reused as the
   grouping/coloring key so a project reads the same color everywhere. */
const TOPIC_PALETTE = ['#f25d52','#5a7dde','#12a594','#e08c00','#7c4fd1','#e8384f','#2f9e44','#0891b2','#c2410c','#c026d3'];
function topicColor(name){
  const key = (name||'General').trim().toLowerCase();
  let h = 0;
  for(let i=0;i<key.length;i++) h = (h*31 + key.charCodeAt(i)) >>> 0;
  return TOPIC_PALETTE[h % TOPIC_PALETTE.length];
}
function monthAdd(ym, n){ const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+n, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
function monthLabel(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(undefined,{month:'short',year:'numeric'}); }
function daysInMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y,m,0).getDate(); }
function monthIndexDiff(fromYM, toYM){ const [y1,m1] = fromYM.split('-').map(Number); const [y2,m2] = toYM.split('-').map(Number); return (y2-y1)*12+(m2-m1); }
/* Position a date as a fraction of the visible month range. Dates outside
   the range clamp to the near edge and are flagged so the caller can show
   a "continues beyond view" indicator instead of silently hiding them. */
function datePosInRange(dateISO, startYM, monthsCount){
  const ym = dateISO.slice(0,7);
  const day = Number(dateISO.slice(8,10));
  const dim = daysInMonth(ym);
  let idx = monthIndexDiff(startYM, ym) + (day-1)/dim;
  let overflow = null;
  if(idx < 0){ idx = 0; overflow = 'left'; }
  if(idx > monthsCount){ idx = monthsCount - 0.015; overflow = 'right'; }
  return { pct: idx/monthsCount*100, overflow };
}
/* Inverse of datePosInRange: a horizontal % position on the timeline → a
   calendar date. Powers drag-to-create on the Roadmap's Calendar lane. */
function dateAtPos(pct, startYM, monthsCount){
  const idx = Math.max(0, Math.min(monthsCount - 0.0001, pct/100*monthsCount));
  const monthIndex = Math.floor(idx);
  const ym = monthAdd(startYM, monthIndex);
  const dim = daysInMonth(ym);
  const frac = idx - monthIndex;
  const day = Math.max(1, Math.min(dim, Math.round(frac*dim) + 1));
  return `${ym}-${pad(day)}`;
}

/* Finance seed — an account, a starter category set (Ivy-Wallet-style, icon

function seedFinance(T){

  render();
  if(S.familyKey){
    sbIsFamily().then(ok => { familyUnlocked = !!ok; if(S.view==='shared') render(); });
  }
  if(S.supabase.hostKey){
    finRefresh();
  }
  if(S.google.connected && S.google.clientId){
    try{
      await ensureToken(true);           // silent — no popup
      await driveMergeOnLoad();          // pull newer remote state if present
      await reconcileCalendar();         // catch up any High tasks missing an event
      updateGooglePill();
      render();
    }catch(e){
      S.google.connected = false;        // silent refresh failed — needs a manual reconnect
      updateGooglePill();
    }
  }
  updateGooglePill();
}

function save(){
  S.updatedAt = Date.now();
  store.save(S);
  if(S.google.connected) scheduleDriveSave();
}

/* ---------- Rules engine (simulated two-way Google Calendar integration) ----------
   Mirrors Asana's "Google Calendar with Rules": task-side triggers create or
   annotate events on the external calendar. One-way feed is handled by ICS. */
function log(msg, kind){
  S.syncLog.unshift({t:new Date().toLocaleString(), msg, kind:kind||'sync'});
  S.syncLog = S.syncLog.slice(0,60);
}
function fireRules(task, change){
  const live = S.google.connected && S.google.clientId; // real API vs. local simulation
  if(change==='priority' && task.priority==='high' && S.rules.highToEvent){
    if(live){
      if(!task.gcalEventId) gcalCreateEvent(task).then(render).catch(e=>{console.error(e); toast('Calendar API call failed — check console');});
      return;
    }
    const date = task.due || addDays(todayISO(),1);
    const exists = S.externalEvents.some(e => e.taskId===task.id);
    if(!exists){
      S.externalEvents.push({id:uid(), taskId:task.id, title:'⏰ '+task.title, date, source:'rule'});
      log(`Rule fired (simulated): "${task.title}" → priority High → placeholder event created (${fmtDue(date)})`, 'rule');
      toast('Rule fired: calendar placeholder created');
    }
  }
  if(change==='completed' && task.done && S.rules.completeMarks){
    if(live){ gcalDeleteOrMarkDone(task).then(render).catch(e=>console.error(e)); return; }
    const ev = S.externalEvents.find(e => e.taskId===task.id);
    if(ev && !ev.title.startsWith('✓')){
      ev.title = '✓ ' + ev.title.replace(/^⏰ /,'');
      log(`Rule fired (simulated): "${task.title}" completed → linked event marked done`, 'rule');
    }
  }
  if(change==='due'){
    if(live){
      if(task.gcalEventId){
        const { startDateTime, endDateTime } = timedWindowFromNow(task.due, 1);
        gcalPatchEvent(task, {
          start:{ dateTime:startDateTime, timeZone:S.availability.timezone },
          end:{ dateTime:endDateTime, timeZone:S.availability.timezone }
        }).then(render).catch(e=>console.error(e));
      }
      else if(S.rules.allTasksToEvents && task.due){ gcalCreateEvent(task).then(()=>{save();render();}).catch(e=>console.error(e)); }
      return;
    }
    const ev = S.externalEvents.find(e => e.taskId===task.id);
    if(ev && task.due){
      ev.date = task.due;
      log(`Data sync (simulated): due date change on "${task.title}" pushed to its event`, 'sync');
    }
  }
}

/* ---------- ICS generation (one-way "Sync to Calendar" feed) ---------- */
function buildICS(){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AsanaDemo//MyTasks//EN',
    'X-WR-CALNAME:My Tasks (Asana demo)','CALSCALE:GREGORIAN'];
  S.tasks.filter(t => t.due && !t.done).forEach(t => {
    const d = t.due.replace(/-/g,'');
    const end = t.due ? addDays(t.due,1).replace(/-/g,'') : d;
    const pri = t.priority ? ` [${PRI_LABEL[t.priority]}]` : '';
    lines.push('BEGIN:VEVENT',
      `UID:${t.id}@asana-demo`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d}`,
      `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${(t.title+pri).replace(/([,;\\])/g,'\\$1')}`,
      `DESCRIPTION:Project: ${t.project||'—'}\\nOpens as all-day event (Asana one-way feed behaviour)`,
      'TRANSP:TRANSPARENT','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* =====================================================================
   REAL GOOGLE INTEGRATION — Google Identity Services (client-side OAuth,
   no backend/secret) + Calendar API (two-way) + Drive appDataFolder
   (cross-device state sync). All calls run directly from the browser,
   which is what makes this deployable as a static GitHub Pages site.
   ===================================================================== */

function updateGooglePill(){
  const pill = document.getElementById('gPill');
  const txt = document.getElementById('gPillText');
  if(!pill) return;
  pill.classList.toggle('on', !!S.google.connected);
  txt.textContent = S.google.connected ? 'Google: connected' : 'Google: not connected';
}

function ensureTokenClient(){
  if(!S.google.clientId) throw new Error('No Client ID configured yet — add one in the Sync tab.');
  if(!window.google || !google.accounts || !google.accounts.oauth2) throw new Error('Google Identity Services script has not loaded yet — check your network/ad-blocker and reload.');
  if(!gAuth.tokenClient || gAuth._forClientId !== S.google.clientId){
    gAuth.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.google.clientId,
      scope: SCOPES,
      callback: (resp) => {
        if(resp && resp.access_token){
          gAuth.accessToken = resp.access_token;
          gAuth.expiresAt = Date.now() + (Number(resp.expires_in||3300)*1000);
          if(gAuth.pendingResolve) gAuth.pendingResolve(resp.access_token);
        } else {
          if(gAuth.pendingReject) gAuth.pendingReject(new Error('No access token returned'));
        }
        gAuth.pendingResolve = null; gAuth.pendingReject = null;
      },
      error_callback: (err) => { if(gAuth.pendingReject) gAuth.pendingReject(err); gAuth.pendingResolve=null; gAuth.pendingReject=null; }
    });
    gAuth._forClientId = S.google.clientId;
  }
  return gAuth.tokenClient;
}

/* Returns a valid access token, requesting a new one only if the cached
   one is missing/expired. silent=true uses prompt:'' (no popup) — used
   for auto-refresh; silent=false is the user-initiated "Connect" click. */
function ensureToken(silent){
  return new Promise((resolve, reject) => {
    if(gAuth.accessToken && Date.now() < gAuth.expiresAt - 60000) return resolve(gAuth.accessToken);
    let client;
    try{ client = ensureTokenClient(); }catch(e){ return reject(e); }
    gAuth.pendingResolve = resolve; gAuth.pendingReject = reject;
    client.requestAccessToken({ prompt: silent ? '' : 'consent' });
  });
}

async function connectGoogle(){
  if(location.protocol==='file:'){ toast('Google login cannot work from a local file — open the deployed site (https://…github.io/…) instead'); return; }
  if(!S.google.clientId){ toast('Paste your Google OAuth Client ID first (Sync tab)'); return; }
  try{
    await ensureToken(false);       // user gesture → real consent popup on first run
    S.google.connected = true;
    save();
    await driveMergeOnLoad();
    const created = await reconcileCalendar();
    render();
    toast(created ? `Google connected — created ${created} calendar event${created===1?'':'s'} for existing High-priority tasks` : 'Google connected');
  }catch(e){
    toast('Google connect failed — see console for details');
    console.error(e);
  }
  updateGooglePill();
}

function disconnectGoogle(){
  const tok = gAuth.accessToken;
  if(tok && window.google) google.accounts.oauth2.revoke(tok, () => {});
  gAuth.accessToken = null; gAuth.expiresAt = 0;
  S.google.connected = false;
  save(); updateGooglePill(); render();
  toast('Google disconnected');
}

/* ---------- Calendar API (two-way) ----------
   Replaces the simulated externalEvents/rules pipeline with real
   events.insert / patch / delete calls against the user's primary
   calendar, once connected. */
async function gcalRequest(method, path, body){
  const token = await ensureToken(true);
  const res = await fetch(`https://www.googleapis.com/calendar/v3${path}`, {
    method, headers:{ 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error(`Calendar API ${method} ${path} → ${res.status}`);
  return res.status===204 ? null : res.json();
}
/* Default event time for task-triggered calendar events: "right now + 3h"
   instead of an all-day banner, so same-day task events spread across the
   hour grid instead of piling up in Google Calendar's all-day strip.
   staggerIndex adds 30min per step so a batch created together (e.g. a
   "Sync now" that catches up several High tasks at once) still lands at
   different times instead of all stacking on the same slot. Clamped so a
   `durationHours` block always fits before midnight. */
function timedWindowFromNow(dateISO, durationHours, staggerIndex){
  const now = new Date();
  const offsetMin = 180 + (staggerIndex||0)*30; // +3h base, +30min per stagger step
  let totalMin = now.getHours()*60 + now.getMinutes() + offsetMin;
  const maxStartMin = (23 - durationHours)*60 + 59;
  if(totalMin > maxStartMin) totalMin = maxStartMin;
  const startHour = Math.floor(totalMin/60), startMin = totalMin%60;
  const endHour = startHour + durationHours;
  return {
    startDateTime: `${dateISO}T${pad(startHour)}:${pad(startMin)}:00`,
    endDateTime: `${dateISO}T${pad(endHour)}:${pad(startMin)}:00`
  };
}
async function gcalCreateEvent(task, staggerIndex){
  const date = task.due || addDays(todayISO(),1);
  const { startDateTime, endDateTime } = timedWindowFromNow(date, 1, staggerIndex);
  const ev = await gcalRequest('POST','/calendars/primary/events', {
    summary: '⏰ ' + task.title,
    description: `Created by My Tasks rule: priority → High\nProject: ${task.project||'—'}`,
    start:{ dateTime:startDateTime, timeZone:S.availability.timezone },
    end:{ dateTime:endDateTime, timeZone:S.availability.timezone }
  });
  task.gcalEventId = ev.id;
  log(`Real Calendar API: created event for "${task.title}" on ${fmtDue(date)}`,'rule');
}
async function gcalPatchEvent(task, fields){
  if(!task.gcalEventId) return;
  await gcalRequest('PATCH', `/calendars/primary/events/${task.gcalEventId}`, fields);
  log(`Real Calendar API: updated event for "${task.title}"`,'sync');
}
async function gcalDeleteOrMarkDone(task){
  if(!task.gcalEventId) return;
  await gcalPatchEvent(task, { summary: '✓ ' + task.title });
}
/* Catch-up pass: the rules above only fire on the *transition* into High
   priority, so a task that was already High before you connected Google
   (e.g. seed data, or created while offline) would otherwise never get an
   event. Run this on connect and on every manual "Sync now". */
async function reconcileCalendar(){
  if(!(S.google.connected && S.google.clientId)) return 0;
  const missing = S.tasks.filter(t => !t.done && !t.gcalEventId && (
    (S.rules.highToEvent && t.priority==='high') ||
    (S.rules.allTasksToEvents && t.due)
  ));
  let i = 0;
  for(const t of missing){
    try{ await gcalCreateEvent(t, i); i++; }catch(e){ console.error('reconcile failed for', t.title, e); }
  }
  if(missing.length) save();
  return missing.length;
}

async function gcalListEvents(monthISO){
  const [y,m] = monthISO.split('-').map(Number);
  const timeMin = new Date(y, m-1, 1).toISOString();
  const timeMax = new Date(y, m, 1).toISOString();
  const data = await gcalRequest('GET', `/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true`);
  return (data.items||[]).map(e => ({
    id:e.id, title:e.summary||'(untitled event)',
    date:(e.start && (e.start.date || (e.start.dateTime||'').slice(0,10)))||null,
    source:'google'
  })).filter(e=>e.date);
}

/* Range variant used by the Roadmap's Calendar lane: one call across the
   whole visible month span, and — unlike gcalListEvents above — it keeps
   each event's real end date so multi-day spans (e.g. a week of planned
   holidays) render as a single bar instead of only showing on day one. */
async function gcalListEventsRange(startISO, endISOExclusive){
  const timeMin = new Date(startISO+'T00:00:00').toISOString();
  const timeMax = new Date(endISOExclusive+'T00:00:00').toISOString();
  const data = await gcalRequest('GET', `/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true&orderBy=startTime&maxResults=250`);
  return (data.items||[]).map(e => {
    const allDay = !!(e.start && e.start.date);
    const startDate = e.start && (e.start.date || (e.start.dateTime||'').slice(0,10));
    const endRaw = e.end && (e.end.date || (e.end.dateTime||'').slice(0,10));
    if(!startDate) return null;
    // Google's all-day "end.date" is exclusive (the day AFTER the last day) — pull it back one day.
    let endDate = allDay && endRaw ? addDays(endRaw, -1) : (endRaw || startDate);
    if(endDate < startDate) endDate = startDate;
    return { id:e.id, title:e.summary||'(untitled event)', date:startDate, endDate, allDay };
  }).filter(Boolean);
}

/* ---------- Drive appDataFolder (cross-device state sync) ---------- */
async function driveRequest(method, url, opts={}){
  const token = await ensureToken(true);
  const headers = Object.assign({'Authorization':`Bearer ${token}`}, opts.headers||{});
  const res = await fetch(url, {method, headers, body:opts.body});
  if(!res.ok) throw new Error(`Drive API ${method} → ${res.status}`);
  return opts.raw ? res : res.json();
}
async function driveFindFile(){
  const data = await driveRequest('GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id,modifiedTime)`);
  return (data.files && data.files[0]) || null;
}
async function driveSaveState(){
  const existing = await driveFindFile();
  const metadata = existing ? {} : {name: DRIVE_FILE_NAME, parents:['appDataFolder']};
  const boundary = 'asana_demo_boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${boundary}--`;
  const url = existing
    ? `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  await driveRequest(existing?'PATCH':'POST', url, { headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body });
  S.google.lastSynced = Date.now();
  log('Synced app state to Google Drive (appDataFolder)','sync');
}
function scheduleDriveSave(){
  clearTimeout(driveSaveTimer);
  driveSaveTimer = setTimeout(() => { driveSaveState().then(render).catch(e=>console.error(e)); }, 1500);
}
/* Fetch the latest state blob from Drive WITHOUT overwriting local state —
   used at booking-confirm time to see bookings made on other devices/tabs
   so two people can't grab the same slot. Returns null if unavailable. */
async function driveFetchLatest(){
  try{
    const file = await driveFindFile();
    if(!file) return null;
    const token = await ensureToken(true);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, { headers:{'Authorization':`Bearer ${token}`} });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function driveMergeOnLoad(){
  const file = await driveFindFile();
  if(!file) { await driveSaveState(); return; } // first run — seed Drive with local state
  const remoteMod = new Date(file.modifiedTime).getTime();
  if(remoteMod > (S.updatedAt||0)){
    const token = await ensureToken(true);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, { headers:{'Authorization':`Bearer ${token}`} });
    const remote = await res.json();
    remote.google = S.google; // keep local client id / connection flag authoritative
    S = remote;
    store.save(S);
    toast('Loaded newer state from Google Drive (another device)');
  } else {
    await driveSaveState();
  }
}

/* Quick-add parser: "!high/!med/!low" sets priority; "jul 10"/"tomorrow"/"today" sets due */
function quickAdd(text){
  let priority = null, due = null;
  text = text.replace(/!(high|med(ium)?|low)\b/i, (m,p) => { priority = p.toLowerCase().startsWith('med')?'medium':p.toLowerCase(); return ''; });
  text = text.replace(/\b(today|tomorrow)\b/i, m => { due = m.toLowerCase()==='today'?todayISO():addDays(todayISO(),1); return ''; });
  const mo = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/i);
  if(mo){
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const y = new Date().getFullYear();
    const d = new Date(y, months.indexOf(mo[1].slice(0,3).toLowerCase()), +mo[2]);
    if(d < new Date(todayISO())) d.setFullYear(y+1);
    due = iso(d); text = text.replace(mo[0],'');
  }
  const t = {id:uid(), title:text.trim()||'Untitled task', project:'', priority, start:null, due,
             section: due===todayISO() ? 'today' : (due ? 'upcoming' : 'recent'), done:false, notes:''};
  S.tasks.unshift(t);
  if(priority==='high') fireRules(t,'priority');
  save(); render(); toast('Task added'+(due?` · due ${fmtDue(due)}`:''));
}

function render(){
  document.getElementById('weeklyFocus').value = S.weeklyFocus||'';
  document.getElementById('sortSelect').value = S.sort;
  document.getElementById('syncBadge').textContent = S.externalEvents.length;
  document.querySelectorAll('.view-tabs button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  document.getElementById('sortWrap').style.visibility = (S.view==='list') ? 'visible':'hidden';
  const qa = document.querySelector('.quickadd');
  if(qa) qa.style.display = ['today','list','table','board','calendar'].includes(S.view) ? 'flex' : 'none';
  const m = document.getElementById('main');
  if(S.view==='roadmap'){ m.innerHTML = renderRoadmap(); maybePullRoadmapEvents(); }
  else if(S.view==='today') m.innerHTML = renderToday();
  else if(S.view==='list') m.innerHTML = renderList();
  else if(S.view==='shared') m.innerHTML = renderShared();
  else if(S.view==='table') m.innerHTML = renderTable();
  else if(S.view==='board') m.innerHTML = renderBoard();
  else if(S.view==='calendar'){ m.innerHTML = renderCalendar(); maybePullRealEvents(); }
  else if(S.view==='book') m.innerHTML = renderBook();
  else if(S.view==='finance') m.innerHTML = renderFinance();
  else m.innerHTML = renderSync();
  wireDynamic();
}

/* Pull real Google Calendar events for the visible month, once, then
   re-render with them merged into S.externalEvents so the same chip
   rendering code in renderCalendar() works for both modes. */
let pulledMonth = null;
function maybePullRealEvents(){
  if(!(S.google.connected && S.google.clientId)) return;
  if(pulledMonth===S.calMonth) return;
  pulledMonth = S.calMonth;
  gcalListEvents(S.calMonth).then(events => {
    S.externalEvents = events; // real events replace the simulated list while connected
    render();
  }).catch(e => console.error(e));
}

function subPill(t){
  const st = t.subtasks||[];
  if(!st.length) return '';
  const done = st.filter(s=>s.done).length;
  return `<span class="pill progress ${done===st.length?'complete':''}" title="Subtasks completed">${done}/${st.length}</span>`;
}
const REPEAT_ICON = {daily:'↻ Daily', weekly:'↻ Weekly', monthly:'↻ Monthly'};
function repeatPill(t){ return t.repeat ? `<span class="pill" style="background:#eef2fc;color:var(--lo)" title="Repeats — completing it creates the next occurrence">${REPEAT_ICON[t.repeat]}</span>` : ''; }

function taskRow(t){
  const dueCls = !t.due ? '' : (t.due < todayISO() && !t.done ? 'overdue' : (t.due===todayISO() ? 'today':''));
  const synced = t.due && !t.done;
  return `<div class="task-row ${t.done?'done':''}" data-id="${t.id}" role="button" tabindex="0">
    <button class="checkbox ${t.done?'checked':''}" data-check="${t.id}" aria-label="Complete task">
      <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5 4.8 9 10 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="t-title">${esc(t.title)}</span>
    ${t.project?`<span class="pill project">${esc(t.project)}</span>`:''}
    ${subPill(t)}
    ${repeatPill(t)}
    ${t.priority?`<span class="pill p-${t.priority}">${PRI_LABEL[t.priority]}</span>`:''}
    ${synced?`<span class="pill synced" title="Has a due date → appears in calendar views and the ICS feed">⇄ feed</span>`:''}
    <span class="t-due ${dueCls}">${fmtDue(t.due)}</span>
  </div>`;
}

function sortedTasks(){
  const ts = [...S.tasks];
  if(S.sort==='priority') ts.sort((a,b) => (PRI_ORDER[a.priority]-PRI_ORDER[b.priority]) || ((a.due||'9999')<(b.due||'9999')?-1:1));
  else if(S.sort==='due') ts.sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : 1);
  return ts;
}

/* ---------- Today dashboard (landing view) ---------- */
function renderToday(){
  const T = todayISO();
  const overdue = S.tasks.filter(t => !t.done && t.due && t.due < T).sort((a,b)=>a.due.localeCompare(b.due));
  const dueToday = S.tasks.filter(t => !t.done && t.due === T);
  const todaysBookings = S.bookings.filter(b => b.status==='confirmed' && b.date===T).sort((a,b)=>a.start.localeCompare(b.start));

  const bookingRow = b => {

/* ---------- Table view (sortable/filterable, Notion-table-lite) ---------- */
function renderTable(){

    due: (a,b) => (a.due||'9999').localeCompare(b.due||'9999')

  rows = [...rows].sort((a,b) => sort.dir==='asc' ? cmp(a,b) : -cmp(a,b));

  const th = (col,label) => `<th data-sortcol="${col}">${label}${arrow(col)}</th>`;

/* Quick-add parser for the shared list — same "!high / tomorrow / jul 10"
   syntax as the personal quick-add, plus "#Topic" to set the group. */
function sharedQuickAdd(text){
  let priority = null, due = null, topic = 'General';
  text = text.replace(/!(high|med(ium)?|low)\b/i, (m,p) => { priority = p.toLowerCase().startsWith('med')?'medium':p.toLowerCase(); return ''; });
  text = text.replace(/#(\S+)/, (m,p) => { topic = p.replace(/[_-]+/g,' '); return ''; });
  text = text.replace(/\b(today|tomorrow)\b/i, m => { due = m.toLowerCase()==='today'?todayISO():addDays(todayISO(),1); return ''; });
  const mo = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/i);
  if(mo){
    const monthsArr = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const y = new Date().getFullYear();
    const d = new Date(y, monthsArr.indexOf(mo[1].slice(0,3).toLowerCase()), +mo[2]);
    if(d < new Date(todayISO())) d.setFullYear(y+1);
    due = iso(d); text = text.replace(mo[0],'');
  }
  const t = { id:uid(), title:text.trim()||'Untitled task', topic, priority, due, done:false, addedBy:S.myName||'', doneBy:'' };
  S.sharedTasks.push(t); render();
  sbInsertSharedTask(t).then(()=>toast('Added to shared list')).catch(e => {
    console.error(e);
    toast('Could not save — check your family key');
    S.sharedTasks = S.sharedTasks.filter(x=>x.id!==t.id); render();
  });
}

/* Pull the latest shared list from Supabase. Supabase is the source of
   truth here (like bookings) — the local copy is just a cache so the UI
   has something to show while a fetch is in flight. */
let sharedSyncing = false;
async function refreshSharedTasks(force){
  if(sharedSyncing) return;
  if(!sbConfigured()){ if(force) toast('No shared backend configured — see Sync tab'); return; }
  sharedSyncing = true;
  try{
    const remote = await sbFetchSharedTasks();
    if(remote !== null){
      S.sharedTasks = remote; save();
      if(S.view==='shared') render();
    } else if(force){ toast('Could not reach the shared list — see console'); }
  } finally { sharedSyncing = false; }
}
let sharedPollTimer = null;
function startSharedPolling(){
  stopSharedPolling();
  sharedPollTimer = setInterval(() => refreshSharedTasks(), 20000); // light polling while the tab is open
}
function stopSharedPolling(){ if(sharedPollTimer){ clearInterval(sharedPollTimer); sharedPollTimer = null; } }

/* ---------- Roadmap Calendar lane: data + interactions ----------
   Shows real Google Calendar events (the "master calendar") as their own
   bars alongside the topic lanes — e.g. a week of planned holidays spans
   visually across a month boundary instead of being reduced to a single
   due-date dot. Read is a single ranged Calendar API call, cached per
   visible range; write (drag-to-create) posts straight back to Calendar. */
let roadmapEventsCache = { key:null, events:[] };
function maybePullRoadmapEvents(force){
  if(!(S.google.connected && S.google.clientId)){ roadmapEventsCache = {key:null, events:[]}; return; }
  const key = `${S.roadmap.startMonth}|${S.roadmap.months}`;
  if(!force && roadmapEventsCache.key===key) return;
  roadmapEventsCache.key = key; // set before the await so a second render doesn't refire the fetch
  const rangeStart = `${S.roadmap.startMonth}-01`;
  const rangeEndExclusive = monthAdd(S.roadmap.startMonth, S.roadmap.months) + '-01';
  gcalListEventsRange(rangeStart, rangeEndExclusive).then(events => {
    roadmapEventsCache = { key, events };
    if(S.view==='roadmap') render();
  }).catch(e => { console.error('roadmap calendar fetch failed', e); roadmapEventsCache = {key:null, events:[]}; });
}
/* Live Google → real fetched events. Not connected → fall back to
   whatever's in the simulated externalEvents list (rule placeholders and
   anything drawn on the Roadmap while offline), normalized to the same
   {date,endDate} shape. */
function roadmapCalendarEvents(){
  if(S.google.connected && S.google.clientId) return roadmapEventsCache.events || [];
  return S.externalEvents.map(e => ({ id:e.id, title:e.title, date:e.date, endDate:e.endDate||e.date }));
}
/* Greedy interval partitioning so overlapping events (e.g. two holidays
   that bracket a long weekend) stack into separate sub-lanes instead of
   drawing on top of each other. */
function stackIntervals(events){
  const sorted = [...events].sort((a,b) => a.date.localeCompare(b.date) || a.endDate.localeCompare(b.endDate));
  const laneEnds = [];
  const placed = sorted.map(ev => {
    let lane = laneEnds.findIndex(end => end < ev.date);
    if(lane===-1){ lane = laneEnds.length; laneEnds.push(ev.endDate); }
    else laneEnds[lane] = ev.endDate;
    return Object.assign({}, ev, {lane});
  });
  return { placed, laneCount: Math.max(1, laneEnds.length) };
}
/* Creates a new calendar event spanning [startDate, endDateIncl]. A
   single-day drag becomes a timed event (now+3h, like task events below)
   so it doesn't add to the all-day pile; a multi-day drag (a holiday,
   a trip) stays a proper all-day span — that's still the clearest way
   to show a date range. Real Google Calendar event when connected, or a
   local simulated placeholder (like the rules engine's demo mode) otherwise. */
async function createRoadmapEvent(startDate, endDateIncl){
  const title = prompt(startDate===endDateIncl
    ? `Event title for ${fmtDue(startDate)}`
    : `Event title for ${fmtDue(startDate)} → ${fmtDue(endDateIncl)}`);
  if(!title || !title.trim()) return;
  const clean = title.trim();
  const singleDay = startDate===endDateIncl;
  if(S.google.connected && S.google.clientId){
    try{
      const body = singleDay
        ? (() => { const w = timedWindowFromNow(startDate, 1); return {
            summary: clean,
            start:{ dateTime:w.startDateTime, timeZone:S.availability.timezone },
            end:{ dateTime:w.endDateTime, timeZone:S.availability.timezone }
          }; })()
        : { summary: clean, start:{date:startDate}, end:{date: addDays(endDateIncl,1)} }; // Calendar API end.date is exclusive
      await gcalRequest('POST', '/calendars/primary/events', body);
      toast(`Added "${clean}" to your Google Calendar`);
      await maybePullRoadmapEvents(true);
      render();
    }catch(e){ console.error(e); toast('Could not create the calendar event — see console'); }
  } else {
    S.externalEvents.push({id:uid(), title:clean, date:startDate, endDate:endDateIncl, source:'manual'});
    log(`Manual (simulated): "${clean}" added to the roadmap calendar lane (${fmtDue(startDate)} → ${fmtDue(endDateIncl)})`, 'sync');
    save(); render();
    toast('Added — connect Google in the Sync tab to make this a real calendar event');
  }
}

/* ---------- Roadmap (landing tab): topic timeline across a custom month range ----------
   One row per topic (the task's project field). A translucent band shows
   the topic's overall extension — earliest start/due to latest due — and
   a dot per task marks its due date, colored by priority. This is a plain
   view over the same S.tasks used everywhere else: nothing new to sync. */
function renderRoadmap(){
  const rm = S.roadmap;
  const months = []; for(let i=0;i<rm.months;i++) months.push(monthAdd(rm.startMonth, i));
  const curYM = todayISO().slice(0,7);

  const byTopic = {};
  S.tasks.forEach(t => {
    if(!t.due) return; // only dated tasks can be placed on a timeline
    const key = t.project && t.project.trim() ? t.project.trim() : '(No project)';
    (byTopic[key] || (byTopic[key]=[])).push(t);
  });
  const topics = Object.keys(byTopic).sort((a,b) => {
    const earliest = arr => arr.reduce((m,t)=> (!m||t.due<m)?t.due:m, null);
    return (earliest(byTopic[a])||'9999') < (earliest(byTopic[b])||'9999') ? -1 : 1;
  });
  const undatedCount = S.tasks.filter(t=>!t.due).length;

  // Calendar lane: real (or simulated, offline) events from the master
  // calendar, clipped to the visible range, stacked so overlapping spans
  // (e.g. two holidays bracketing a long weekend) get their own sub-row.
  const rangeStart = `${rm.startMonth}-01`;
  const rangeEndIncl = addDays(monthAdd(rm.startMonth, rm.months)+'-01', -1);
  const visibleEvents = roadmapCalendarEvents().filter(e => e.endDate >= rangeStart && e.date <= rangeEndIncl);
  const { placed: calPlaced, laneCount: calLanes } = stackIntervals(visibleEvents);
  const calTrackHeight = Math.max(42, calLanes*24 + 14);
  const calBars = calPlaced.map(e => {
    const posMin = datePosInRange(e.date, rm.startMonth, rm.months);
    const posMaxEnd = datePosInRange(addDays(e.endDate,1), rm.startMonth, rm.months);
    const left = posMin.pct, width = Math.max(posMaxEnd.pct - posMin.pct, 1.2);
    const top = 7 + e.lane*24;
    return `<button class="rm-cal-event" style="left:${left}%;width:${width}%;top:${top}px" data-calid="${e.id}"
      title="${esc(e.title)} · ${fmtDue(e.date)}${e.endDate!==e.date?' → '+fmtDue(e.endDate):''}">${esc(e.title)}</button>`;
  }).join('');
  const calMonthCells = months.map(ym => `<div class="rm-month-cell ${ym===curYM?'rm-current':''}"></div>`).join('');
  const calRow = `<div class="roadmap-row">
    <div class="rm-label"><span class="topic-dot" style="background:var(--gcal)"></span>📅 Calendar <span class="count">${visibleEvents.length}</span></div>
    <div class="rm-track rm-cal-track" id="rmCalTrack" style="height:${calTrackHeight}px">
      ${calMonthCells}
      ${calBars}
    </div>
  </div>`;

  const rangeBtns = [3,6,12,18,24].map(n =>
    `<button data-rmrange="${n}" class="${rm.months===n?'active':''}">${n<12 ? n+'mo' : (n/12)+'yr'}</button>`
