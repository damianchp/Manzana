<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>My Tasks</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1d2733">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --ink:#1d2733;
  --ink-soft:#4a5568;
  --ink-faint:#8a94a3;
  --paper:#f6f7f9;
  --card:#ffffff;
  --line:#e4e8ee;
  --accent:#f25d52;        /* Asana-family coral, anchors the product identity */
  --accent-soft:#fdeceb;
  --hi:#e8384f;  --hi-bg:#fdebee;
  --md:#e08c00;  --md-bg:#fdf3e3;
  --lo:#5a7dde;  --lo-bg:#eef2fc;
  --sync:#12a594; --sync-bg:#e6f6f3;
  --gcal:#4285f4;
  --radius:10px;
  --shadow:0 1px 2px rgba(29,39,51,.06),0 4px 14px rgba(29,39,51,.06);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Instrument Sans',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- Top bar ---------- */
header.topbar{
  display:flex;align-items:center;gap:14px;
  padding:12px 20px;background:var(--ink);color:#f4f6f9;
  position:sticky;top:0;z-index:40;
}
.logo{display:flex;align-items:center;gap:9px;font-family:'Sora';font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(242,93,82,.25)}
.topbar .sub{font-size:.78rem;color:#9aa7b6;font-weight:400}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip-btn{
  font-size:.78rem;font-weight:600;padding:6px 12px;border-radius:99px;
  background:rgba(255,255,255,.1);color:#e7ecf2;transition:background .15s;
}
.chip-btn:hover{background:rgba(255,255,255,.2)}

/* ---------- Weekly focus banner ---------- */
.focus-banner{
  background:linear-gradient(90deg,#1d2733 0%,#2b3a4d 100%);
  color:#f4f6f9;padding:10px 20px;display:flex;align-items:center;gap:12px;
  border-top:1px solid rgba(255,255,255,.08);
}
.focus-banner .label{
  font-family:'Sora';font-size:.66rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);white-space:nowrap;
}
.focus-banner input{
  flex:1;background:transparent;border:none;color:#f4f6f9;font-size:.95rem;
  font-weight:500;border-bottom:1px dashed transparent;padding:2px 0;
}
.focus-banner input:hover,.focus-banner input:focus{border-bottom-color:rgba(255,255,255,.35);outline:none}

/* ---------- Toolbar ---------- */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 20px 10px;
}
.view-tabs{display:flex;background:#eceff3;border-radius:99px;padding:3px}
.view-tabs button{
  padding:7px 16px;border-radius:99px;font-size:.85rem;font-weight:600;color:var(--ink-soft);
  transition:all .15s;
}
.view-tabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.view-tabs button .badge{
  display:inline-block;margin-left:6px;font-size:.65rem;font-weight:700;
  background:var(--sync-bg);color:var(--sync);padding:1px 6px;border-radius:99px;
}
.toolbar .spacer{flex:1}
.sort-wrap{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink-soft)}
.sort-wrap select{
  border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card);
  font-size:.82rem;font-weight:500;
}
.quickadd{
  display:flex;gap:8px;padding:0 20px 6px;
}
.quickadd input[type=text]{
  flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;
  background:var(--card);font-size:.92rem;
}
.quickadd input[type=text]::placeholder{color:var(--ink-faint)}
.quickadd .add-btn{
  background:var(--accent);color:#fff;font-weight:600;font-size:.88rem;
  padding:0 18px;border-radius:var(--radius);transition:filter .15s;
}
.quickadd .add-btn:hover{filter:brightness(1.06)}

main{padding:8px 20px 60px;max-width:1200px;margin:0 auto}

/* ---------- List view ---------- */
.section-block{margin-bottom:22px}
.section-head{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
  font-family:'Sora';font-weight:600;font-size:.92rem;
}
.section-head .count{font-family:'Instrument Sans';font-weight:500;font-size:.75rem;color:var(--ink-faint)}
.task-row{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:box-shadow .15s,border-color .15s;
}
.task-row:hover{box-shadow:var(--shadow);border-color:#d3dae3}
.task-row.done{opacity:.5}
.task-row.done .t-title{text-decoration:line-through}
.checkbox{
  width:19px;height:19px;min-width:19px;border:1.6px solid #b7c0cc;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:all .15s;background:none;
}
.checkbox:hover{border-color:var(--sync);color:var(--sync)}
.checkbox.checked{background:var(--sync);border-color:var(--sync);color:#fff}
.checkbox svg{width:11px;height:11px}
.t-title{flex:1;font-size:.92rem;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{
  font-size:.7rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;
}
.pill.project{background:#eef1f5;color:var(--ink-soft)}
.pill.p-high{background:var(--hi-bg);color:var(--hi)}
.pill.p-medium{background:var(--md-bg);color:var(--md)}
.pill.p-low{background:var(--lo-bg);color:var(--lo)}
.pill.synced{background:var(--sync-bg);color:var(--sync)}
.t-due{font-size:.78rem;font-weight:500;color:var(--ink-faint);white-space:nowrap;min-width:64px;text-align:right}
.t-due.overdue{color:var(--hi);font-weight:600}
.t-due.today{color:var(--sync);font-weight:600}
.empty-note{font-size:.82rem;color:var(--ink-faint);padding:8px 4px}

/* ---------- Board view ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.board-col{background:#eef0f4;border-radius:14px;padding:10px;min-height:120px}
.board-col.dragover{outline:2px dashed var(--accent);outline-offset:-2px}
.board-col h3{font-family:'Sora';font-size:.84rem;font-weight:600;padding:4px 6px 10px;display:flex;gap:6px;align-items:center}
.board-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 12px;margin-bottom:8px;cursor:grab;box-shadow:0 1px 2px rgba(29,39,51,.05);
}
.board-card:active{cursor:grabbing}
.board-card .bc-title{font-size:.88rem;font-weight:500;margin-bottom:7px}
.board-card .bc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.board-card.done{opacity:.5}
.board-card.done .bc-title{text-decoration:line-through}

/* ---------- Calendar view ---------- */
.cal-layout{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
@media(max-width:800px){.cal-layout{grid-template-columns:1fr}}
.unsched{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;
}
.unsched h3{font-family:'Sora';font-size:.82rem;font-weight:600;margin-bottom:4px}
.unsched p.hint{font-size:.72rem;color:var(--ink-faint);margin-bottom:10px;line-height:1.4}
.unsched .board-card{margin-bottom:6px;padding:8px 10px}
.cal-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-head h3{font-family:'Sora';font-size:.98rem;font-weight:600;flex:1}
.cal-nav{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:1rem;background:var(--card)}
.cal-nav:hover{background:var(--paper)}
.cal-legend{display:flex;gap:12px;font-size:.68rem;color:var(--ink-faint);padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cal-legend .key{display:flex;align-items:center;gap:5px}
.cal-legend .swatch{width:9px;height:9px;border-radius:3px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-dow{font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cal-cell{
  min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:5px;position:relative;min-width:0;overflow:hidden;
}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.other{background:#fafbfc;color:var(--ink-faint)}
.cal-cell.today-cell{background:#fbf3f2}
.cal-cell .daynum{font-size:.72rem;font-weight:600;padding:1px 4px;display:inline-block;border-radius:6px}
.cal-cell.today-cell .daynum{background:var(--accent);color:#fff}
.cal-cell.dragover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.cal-chip{
  display:block;width:100%;max-width:100%;box-sizing:border-box;text-align:left;font-size:.68rem;font-weight:600;
  padding:2px 6px;border-radius:5px;margin-top:3px;cursor:grab;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;
}
.cal-chip.p-high{background:var(--hi-bg);color:var(--hi)}
.cal-chip.p-medium{background:var(--md-bg);color:var(--md)}
.cal-chip.p-low{background:var(--lo-bg);color:var(--lo)}
.cal-chip.p-none{background:#eef1f5;color:var(--ink-soft)}
.cal-chip.done{opacity:.45;text-decoration:line-through}
.cal-chip.gcal-event{
  background:#fff;border:1.4px dashed var(--gcal);color:var(--gcal);cursor:default;
}

/* ---------- Sync pipeline view (signature) ---------- */
.sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.sync-grid{grid-template-columns:1fr}}
.sync-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.sync-card h3{font-family:'Sora';font-size:.95rem;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sync-card p.desc{font-size:.8rem;color:var(--ink-soft);line-height:1.5;margin-bottom:14px}
.dir-tag{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.dir-tag.oneway{background:var(--sync-bg);color:var(--sync)}
.dir-tag.rules{background:#e8f0fe;color:var(--gcal)}
.pipeline{
  display:flex;align-items:center;gap:0;margin:6px 0 16px;
}
.pipe-node{
  flex:1;text-align:center;padding:12px 8px;border-radius:12px;font-size:.78rem;font-weight:600;
}
.pipe-node.asana{background:var(--accent-soft);color:var(--accent)}
.pipe-node.gcal{background:#e8f0fe;color:var(--gcal)}
.pipe-node small{display:block;font-weight:400;font-size:.66rem;margin-top:2px;color:var(--ink-faint)}
.pipe-flow{
  flex:1.2;height:2px;position:relative;margin:0 -4px;
  background-image:linear-gradient(90deg,var(--sync) 55%,transparent 45%);
  background-size:12px 2px;
}
.pipe-flow.animate{animation:flow 1s linear infinite}
@keyframes flow{to{background-position:12px 0}}
@media(prefers-reduced-motion:reduce){.pipe-flow.animate{animation:none}}
.pipe-flow::after{
  content:"→";position:absolute;right:-4px;top:-11px;color:var(--sync);font-size:.9rem;
}
.ics-preview{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;line-height:1.55;
  background:#141a21;color:#a9c7b8;border-radius:10px;padding:12px 14px;
  max-height:210px;overflow:auto;white-space:pre;margin-bottom:12px;
}
.ics-preview .hl{color:#f2b56b}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:9px;transition:filter .15s;
}
.btn.primary{background:var(--sync);color:#fff}
.btn.blue{background:var(--gcal);color:#fff}
.btn.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink-soft)}
.btn:hover{filter:brightness(1.05)}
.feed-url{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;background:var(--paper);
  border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-bottom:12px;
  color:var(--ink-soft);overflow-wrap:anywhere;
}
.rule-item{
  display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:10px;
}
.rule-item .rule-text{flex:1;font-size:.82rem;line-height:1.45}
.rule-item .rule-text b{font-weight:600}
.rule-item code{
  font-family:'JetBrains Mono',monospace;font-size:.72rem;background:var(--paper);
  padding:1px 5px;border-radius:4px;border:1px solid var(--line);
}
.switch{position:relative;width:38px;height:22px;min-width:38px}
.switch input{opacity:0;width:0;height:0}
.switch .track{
  position:absolute;inset:0;background:#cfd6df;border-radius:99px;transition:background .15s;cursor:pointer;
}
.switch .track::after{
  content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .track{background:var(--sync)}
.switch input:checked + .track::after{transform:translateX(16px)}
.log-list{max-height:230px;overflow:auto}
.log-entry{
  font-size:.76rem;padding:8px 10px;border-left:3px solid var(--sync);background:var(--paper);
  border-radius:0 8px 8px 0;margin-bottom:6px;line-height:1.45;
}
.log-entry.rule{border-left-color:var(--gcal)}
.log-entry time{display:block;font-size:.64rem;color:var(--ink-faint);font-family:'JetBrains Mono',monospace}
.arch-note{
  grid-column:1/-1;background:var(--ink);color:#c7d1dd;border-radius:14px;padding:18px 20px;
  font-size:.82rem;line-height:1.65;
}
.arch-note h3{font-family:'Sora';color:#fff;font-size:.9rem;margin-bottom:8px}
.arch-note b{color:#fff}
.arch-note .k{color:var(--accent)}

/* ---------- Task drawer ---------- */
.drawer-scrim{position:fixed;inset:0;background:rgba(20,26,33,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);background:var(--card);
  z-index:61;box-shadow:-10px 0 40px rgba(20,26,33,.18);transform:translateX(105%);
  transition:transform .22s ease;display:flex;flex-direction:column;
}
body.drawer-open .drawer{transform:none}
body.drawer-open .drawer-scrim{opacity:1;pointer-events:auto}
.drawer-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-family:'Sora';font-size:.95rem;flex:1}
.drawer-body{padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--card);font-size:.9rem;
}
.field textarea{resize:vertical;min-height:70px}
.drawer-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.btn.danger{background:var(--hi-bg);color:var(--hi)}
.btn.accent{background:var(--accent);color:#fff;flex:1}
.icon-btn{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint)}
.icon-btn:hover{background:var(--paper);color:var(--ink)}

/* ---------- Google connect pill (topbar) ---------- */
.gpill{
  display:flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;
  padding:5px 10px 5px 6px;border-radius:99px;background:rgba(255,255,255,.1);color:#e7ecf2;
}
.gpill .dot2{width:7px;height:7px;border-radius:50%;background:#8a94a3}
.gpill.on .dot2{background:#4ec9a3}
.gpill button{color:inherit;font-weight:600;text-decoration:underline;text-underline-offset:2px}

/* ---------- Subtasks ---------- */
.pill.progress{background:#eef1f5;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pill.progress.complete{background:var(--sync-bg);color:var(--sync)}
.sub-list{display:flex;flex-direction:column;gap:2px}
.sub-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:8px}
.sub-item:hover{background:var(--paper)}
.sub-item .checkbox{width:16px;height:16px;min-width:16px}
.sub-item .sub-text{flex:1;font-size:.87rem;border:none;background:transparent;padding:2px 0}
.sub-item.done .sub-text{text-decoration:line-through;color:var(--ink-faint)}
.sub-item .sub-del{color:var(--ink-faint);font-size:.85rem;opacity:0;transition:opacity .12s;padding:2px 6px;border-radius:6px}
.sub-item:hover .sub-del{opacity:1}
.sub-item .sub-del:hover{color:var(--hi);background:var(--hi-bg)}
.sub-add{display:flex;gap:6px;margin-top:6px}
.sub-add input{flex:1;border:1px dashed var(--line);border-radius:8px;padding:7px 10px;font-size:.85rem;background:var(--paper)}
.sub-add button{background:var(--accent);color:#fff;font-weight:600;font-size:.78rem;padding:0 13px;border-radius:8px}
.sub-progress-bar{height:4px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:6px 0 2px}
.sub-progress-bar .fill{height:100%;background:var(--sync);border-radius:99px;transition:width .25s}

/* ---------- Book tab (Calendly-style scheduling) ---------- */
.book-subtabs{display:flex;background:#eceff3;border-radius:99px;padding:3px;margin-bottom:16px;width:fit-content}
.book-subtabs button{padding:7px 16px;border-radius:99px;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.book-subtabs button.active{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.evt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.evt-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
.evt-card.inactive{opacity:.5}
.evt-card .evt-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.evt-card h4{font-family:'Sora';font-size:.95rem;font-weight:700;margin-bottom:4px;display:flex;align-items:center}
.evt-card .evt-meta{font-size:.76rem;color:var(--ink-faint);margin-bottom:10px}
.evt-card .evt-desc{font-size:.8rem;color:var(--ink-soft);margin-bottom:12px;min-height:0}
.evt-card .evt-actions{display:flex;gap:6px;flex-wrap:wrap}
.evt-link-row{
  font-family:'JetBrains Mono',monospace;font-size:.66rem;background:var(--paper);border:1px dashed var(--line);
  border-radius:7px;padding:6px 8px;margin-bottom:10px;overflow-wrap:anywhere;color:var(--ink-soft);
}
.evt-new-card{
  border:1.5px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;
  min-height:140px;color:var(--ink-faint);font-weight:600;font-size:.85rem;cursor:pointer;
}
.evt-new-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.evt-form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.evt-form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.evt-form .grid2{grid-template-columns:1fr}}

.avail-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.avail-day-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.avail-day-row:last-child{border-bottom:none}
.avail-day-row .dayname{width:100px;font-size:.85rem;font-weight:600}
.avail-day-row input[type=time]{border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:.82rem}
.avail-day-row .to{color:var(--ink-faint);font-size:.8rem}

<script>
/* =====================================================================
   ASANA ARCHITECTURE DEMO — data model, views, sorting, calendar,
   external-calendar sync (one-way ICS feed + two-way rules engine)
   ===================================================================== */

/* ---------- Persistence adapter ----------
   Order of preference:
   1. window.storage  (Claude artifact environment)
   2. localStorage    (when this file is opened directly in a browser)
   3. in-memory       (fallback) */
/* Optional: hard-code your Supabase creds here after deploying so the
   PUBLIC booking link works in a stranger's fresh browser (they have no
   saved config). Both values are public/safe — RLS protects the data.
   Leave blank to configure only via the Sync tab (works for your own use). */
const BUILD_SUPABASE = { url:'', anonKey:'' };

const KEY = 'asana-demo-state-v1';
const store = {
  mem: null,
  async load(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value); } }catch(e){}
    try{ const v = localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
    return this.mem;
  },
  async save(state){
    const v = JSON.stringify(state);
    this.mem = state;
    try{ if(window.storage){ await window.storage.set(KEY, v); return; } }catch(e){}
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }
};

/* ---------- Helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const addDays = (base, n) => { const d = new Date(base); d.setDate(d.getDate()+n); return iso(d); };
const fmtDue = s => {
  if(!s) return '';
  const d = new Date(s+'T00:00'); const t = new Date(todayISO()+'T00:00');
  const diff = Math.round((d-t)/86400000);
  if(diff===0) return 'Today';
  if(diff===1) return 'Tomorrow';
  if(diff===-1) return 'Yesterday';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
};
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRI_ORDER = {high:0, medium:1, low:2, '':3, null:3, undefined:3};
const PRI_LABEL = {high:'High', medium:'Medium', low:'Low'};

/* ---------- Seed data (embedded JSON) ---------- */
function seedState(){
  const T = todayISO();
  const introId = uid(), consultId = uid();
  return {
    weeklyFocus: 'Ship the quarterly report — everything else supports this.',
    view: 'list',
    sort: 'none',
    calMonth: T.slice(0,7),
    rules: {
      highToEvent: true,     // Rule: priority → High creates a GCal placeholder event
      completeMarks: true    // Rule: completing a task annotates its synced event
    },
    syncLog: [],
    externalEvents: [],      // events living on the simulated Google Calendar (fallback demo mode)
    google: {
      clientId: '',          // OAuth Client ID (public, safe to store) — paste your own in Sync tab
      connected: false,
      lastSynced: null
    },
    supabase: {
      url: '',               // https://<project>.supabase.co  (public)
      anonKey: '',           // anon/public API key (safe in client — RLS protects data)
      hostKey: ''            // YOUR private admin secret — never commit this; lives only in your browser/Drive
    },
    updatedAt: Date.now(),
    bookView: 'types',
    calShow: 'both',
    eventTypes: [
      {id:introId, name:'Intro call', slug:'intro-call', duration:30, buffer:10, color:'#f25d52',
       description:'A short call to see if we\'re a good fit to work together.', locationType:'video',
       questionLabel:'Anything specific you\'d like to cover?', active:true},
      {id:consultId, name:'Consulting session', slug:'consulting-session', duration:60, buffer:15, color:'#5a7dde',
       description:'A focused working session — bring your data or your questions.', locationType:'video',
       questionLabel:'What would you like help with?', active:true}
    ],
    availability: {
      timezone: 'Europe/Copenhagen',
      minNoticeHours: 12,
      dailyLimit: null,
      weekly: {
        sun:{enabled:false, start:'09:00', end:'17:00'},
        mon:{enabled:true,  start:'09:00', end:'17:00'},
        tue:{enabled:true,  start:'09:00', end:'17:00'},
        wed:{enabled:true,  start:'09:00', end:'17:00'},
        thu:{enabled:true,  start:'09:00', end:'17:00'},
        fri:{enabled:true,  start:'09:00', end:'15:00'},
        sat:{enabled:false, start:'09:00', end:'17:00'}
      },
      overrides: {}   // 'YYYY-MM-DD': {blocked:true}
    },
    bookings: [
      {id:uid(), eventTypeId:introId, date:addDays(T,5), start:'14:00', end:'14:30',
       inviteeName:'Sample invitee', inviteeEmail:'invitee@example.com', note:'',
       status:'confirmed', gcalEventId:null, createdAt:T}
    ],
    tasks: [
      {id:uid(), title:'Follow up on the vendor proposal', project:'Work', priority:'high',   start:null, due:T,            section:'today',    done:false, notes:'Check status; reference last week\'s call.',
       subtasks:[{id:uid(),text:'Re-read the proposal details',done:true},{id:uid(),text:'Draft 3-line follow-up email',done:false},{id:uid(),text:'Send before Friday 12:00',done:false}]},
      {id:uid(), title:'Revise the report discussion section', project:'Work', priority:'high', start:addDays(T,-2), due:addDays(T,1), section:'today', done:false, notes:'Target journal: TBD.',
       subtasks:[{id:uid(),text:'Address reviewer point on imputation',done:false},{id:uid(),text:'Tighten limitations paragraph',done:false}]},
      {id:uid(), title:'Prepare slides for Thursday demo', project:'Work', priority:'medium', start:null, due:addDays(T,2), section:'upcoming', done:false, notes:''},
      {id:uid(), title:'Review monthly budget spreadsheet', project:'Personal', priority:'medium', start:null, due:addDays(T,4), section:'upcoming', done:false, notes:''},
      {id:uid(), title:'Handle a personal admin errand', project:'Personal', priority:'high', start:null, due:addDays(T,3), section:'upcoming', done:false, notes:''},
      {id:uid(), title:'Draft event recap post', project:'Community', priority:'low', start:null, due:addDays(T,7), section:'later', done:false, notes:''},
      {id:uid(), title:'Publish code samples to GitHub', project:'Work', priority:'low', start:null, due:null, section:'later', done:false, notes:''},
      {id:uid(), title:'Review website analytics', project:'Work', priority:null, start:null, due:null, section:'recent', done:false, notes:''},
      {id:uid(), title:'Send thank-you note after the workshop', project:'Community', priority:'medium', start:null, due:addDays(T,-1), section:'today', done:false, notes:''}
    ]
  };
}

let S = null;           // app state
let editingId = null;   // task open in drawer

/* Runtime-only Google auth state — never persisted (tokens shouldn't be saved to disk/Drive) */
const SCOPES = 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata';
const gAuth = { tokenClient:null, accessToken:null, expiresAt:0, pendingResolve:null, pendingReject:null };
const DRIVE_FILE_NAME = 'asana-demo-state.json';
let driveSaveTimer = null;

async function init(){
  S = await store.load() || seedState();
  if(!S.calMonth) S.calMonth = todayISO().slice(0,7);
  if(!S.google) S.google = {clientId:'', connected:false, lastSynced:null};
  if(!S.supabase) S.supabase = {url:'', anonKey:'', hostKey:''};
  if(S.supabase.hostKey===undefined) S.supabase.hostKey='';
  if(!S.eventTypes) S.eventTypes = [];
  if(!S.availability) S.availability = {timezone:'Europe/Copenhagen', minNoticeHours:12, dailyLimit:null,
    weekly:{sun:{enabled:false,start:'09:00',end:'17:00'},mon:{enabled:true,start:'09:00',end:'17:00'},
    tue:{enabled:true,start:'09:00',end:'17:00'},wed:{enabled:true,start:'09:00',end:'17:00'},
    thu:{enabled:true,start:'09:00',end:'17:00'},fri:{enabled:true,start:'09:00',end:'17:00'},
    sat:{enabled:false,start:'09:00',end:'17:00'}}, overrides:{}};
  if(!S.bookings) S.bookings = [];
  if(!S.bookView) S.bookView = 'types';
  if(!S.calShow) S.calShow = 'both';
  S.tasks.forEach(t => { if(!Array.isArray(t.subtasks)) t.subtasks = []; });
  bindStatic();
  render();
  if(S.google.connected && S.google.clientId){
    try{
      await ensureToken(true);           // silent — no popup
      await driveMergeOnLoad();          // pull newer remote state if present
      await reconcileCalendar();         // catch up any High tasks missing an event
      updateGooglePill();
      render();
    }catch(e){
      S.google.connected = false;        // silent refresh failed — needs a manual reconnect
      updateGooglePill();
    }
  }
  updateGooglePill();
}

function save(){
  S.updatedAt = Date.now();
  store.save(S);
  if(S.google.connected) scheduleDriveSave();
}

/* ---------- Rules engine (simulated two-way Google Calendar integration) ----------
   Mirrors Asana's "Google Calendar with Rules": task-side triggers create or
   annotate events on the external calendar. One-way feed is handled by ICS. */
function log(msg, kind){
  S.syncLog.unshift({t:new Date().toLocaleString(), msg, kind:kind||'sync'});
  S.syncLog = S.syncLog.slice(0,60);
}
function fireRules(task, change){
  const live = S.google.connected && S.google.clientId; // real API vs. local simulation
  if(change==='priority' && task.priority==='high' && S.rules.highToEvent){
    if(live){
      if(!task.gcalEventId) gcalCreateEvent(task).then(render).catch(e=>{console.error(e); toast('Calendar API call failed — check console');});
      return;
    }
    const date = task.due || addDays(todayISO(),1);
    const exists = S.externalEvents.some(e => e.taskId===task.id);
    if(!exists){
      S.externalEvents.push({id:uid(), taskId:task.id, title:'⏰ '+task.title, date, source:'rule'});
      log(`Rule fired (simulated): “${task.title}” → priority High → placeholder event created (${fmtDue(date)})`, 'rule');
      toast('Rule fired: calendar placeholder created');
    }
  }
  if(change==='completed' && task.done && S.rules.completeMarks){
    if(live){ gcalDeleteOrMarkDone(task).then(render).catch(e=>console.error(e)); return; }
    const ev = S.externalEvents.find(e => e.taskId===task.id);
    if(ev && !ev.title.startsWith('✓')){
      ev.title = '✓ ' + ev.title.replace(/^⏰ /,'');
      log(`Rule fired (simulated): “${task.title}” completed → linked event marked done`, 'rule');
    }
  }
  if(change==='due'){
    if(live){ gcalPatchEvent(task, { start:{date:task.due}, end:{date:addDays(task.due,1)} }).then(render).catch(e=>console.error(e)); return; }
    const ev = S.externalEvents.find(e => e.taskId===task.id);
    if(ev && task.due){
      ev.date = task.due;
      log(`Data sync (simulated): due date change on “${task.title}” pushed to its event`, 'sync');
    }
  }
}

/* ---------- ICS generation (one-way "Sync to Calendar" feed) ---------- */
function buildICS(){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AsanaDemo//MyTasks//EN',
    'X-WR-CALNAME:My Tasks (Asana demo)','CALSCALE:GREGORIAN'];
  S.tasks.filter(t => t.due && !t.done).forEach(t => {
    const d = t.due.replace(/-/g,'');
    const end = t.due ? addDays(t.due,1).replace(/-/g,'') : d;
    const pri = t.priority ? ` [${PRI_LABEL[t.priority]}]` : '';
    lines.push('BEGIN:VEVENT',
      `UID:${t.id}@asana-demo`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${d}`,
      `DTEND;VALUE=DATE:${end}`,
      `SUMMARY:${(t.title+pri).replace(/([,;\\])/g,'\\$1')}`,
      `DESCRIPTION:Project: ${t.project||'—'}\\nOpens as all-day event (Asana one-way feed behaviour)`,
      'TRANSP:TRANSPARENT','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* =====================================================================
   REAL GOOGLE INTEGRATION — Google Identity Services (client-side OAuth,
   no backend/secret) + Calendar API (two-way) + Drive appDataFolder
   (cross-device state sync). All calls run directly from the browser,
   which is what makes this deployable as a static GitHub Pages site.
   ===================================================================== */

function updateGooglePill(){
  const pill = document.getElementById('gPill');
  const txt = document.getElementById('gPillText');
  if(!pill) return;
  pill.classList.toggle('on', !!S.google.connected);
  txt.textContent = S.google.connected ? 'Google: connected' : 'Google: not connected';
}

function ensureTokenClient(){
  if(!S.google.clientId) throw new Error('No Client ID configured yet — add one in the Sync tab.');
  if(!window.google || !google.accounts || !google.accounts.oauth2) throw new Error('Google Identity Services script has not loaded yet — check your network/ad-blocker and reload.');
  if(!gAuth.tokenClient || gAuth._forClientId !== S.google.clientId){
    gAuth.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: S.google.clientId,
      scope: SCOPES,
      callback: (resp) => {
        if(resp && resp.access_token){
          gAuth.accessToken = resp.access_token;
          gAuth.expiresAt = Date.now() + (Number(resp.expires_in||3300)*1000);
          if(gAuth.pendingResolve) gAuth.pendingResolve(resp.access_token);
        } else {
          if(gAuth.pendingReject) gAuth.pendingReject(new Error('No access token returned'));
        }
        gAuth.pendingResolve = null; gAuth.pendingReject = null;
      },
      error_callback: (err) => { if(gAuth.pendingReject) gAuth.pendingReject(err); gAuth.pendingResolve=null; gAuth.pendingReject=null; }
    });
    gAuth._forClientId = S.google.clientId;
  }
  return gAuth.tokenClient;
}

/* Returns a valid access token, requesting a new one only if the cached
   one is missing/expired. silent=true uses prompt:'' (no popup) — used
   for auto-refresh; silent=false is the user-initiated "Connect" click. */
function ensureToken(silent){
  return new Promise((resolve, reject) => {
    if(gAuth.accessToken && Date.now() < gAuth.expiresAt - 60000) return resolve(gAuth.accessToken);
    let client;
    try{ client = ensureTokenClient(); }catch(e){ return reject(e); }
    gAuth.pendingResolve = resolve; gAuth.pendingReject = reject;
    client.requestAccessToken({ prompt: silent ? '' : 'consent' });
  });
}

async function connectGoogle(){
  if(location.protocol==='file:'){ toast('Google login cannot work from a local file — open the deployed site (https://…github.io/…) instead'); return; }
  if(!S.google.clientId){ toast('Paste your Google OAuth Client ID first (Sync tab)'); return; }
  try{
    await ensureToken(false);       // user gesture → real consent popup on first run
    S.google.connected = true;
    save();
    await driveMergeOnLoad();
    const created = await reconcileCalendar();
    render();
    toast(created ? `Google connected — created ${created} calendar event${created===1?'':'s'} for existing High-priority tasks` : 'Google connected');
  }catch(e){
    toast('Google connect failed — see console for details');
    console.error(e);
  }
  updateGooglePill();
}

function disconnectGoogle(){
  const tok = gAuth.accessToken;
  if(tok && window.google) google.accounts.oauth2.revoke(tok, () => {});
  gAuth.accessToken = null; gAuth.expiresAt = 0;
  S.google.connected = false;
  save(); updateGooglePill(); render();
  toast('Google disconnected');
}

/* ---------- Calendar API (two-way) ----------
   Replaces the simulated externalEvents/rules pipeline with real
   events.insert / patch / delete calls against the user's primary
   calendar, once connected. */
async function gcalRequest(method, path, body){
  const token = await ensureToken(true);
  const res = await fetch(`https://www.googleapis.com/calendar/v3${path}`, {
    method, headers:{ 'Authorization':`Bearer ${token}`, 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!res.ok) throw new Error(`Calendar API ${method} ${path} → ${res.status}`);
  return res.status===204 ? null : res.json();
}
async function gcalCreateEvent(task){
  const date = task.due || addDays(todayISO(),1);
  const ev = await gcalRequest('POST','/calendars/primary/events', {
    summary: '⏰ ' + task.title,
    description: `Created by My Tasks rule: priority → High\nProject: ${task.project||'—'}`,
    start:{date}, end:{date: addDays(date,1)}
  });
  task.gcalEventId = ev.id;
  log(`Real Calendar API: created event for “${task.title}” on ${fmtDue(date)}`,'rule');
}
async function gcalPatchEvent(task, fields){
  if(!task.gcalEventId) return;
  await gcalRequest('PATCH', `/calendars/primary/events/${task.gcalEventId}`, fields);
  log(`Real Calendar API: updated event for “${task.title}”`,'sync');
}
async function gcalDeleteOrMarkDone(task){
  if(!task.gcalEventId) return;
  await gcalPatchEvent(task, { summary: '✓ ' + task.title });
}
/* Catch-up pass: the rules above only fire on the *transition* into High
   priority, so a task that was already High before you connected Google
   (e.g. seed data, or created while offline) would otherwise never get an
   event. Run this on connect and on every manual "Sync now". */
async function reconcileCalendar(){
  if(!(S.google.connected && S.google.clientId)) return 0;
  if(!S.rules.highToEvent) return 0;
  const missing = S.tasks.filter(t => t.priority==='high' && !t.done && !t.gcalEventId);
  for(const t of missing){
    try{ await gcalCreateEvent(t); }catch(e){ console.error('reconcile failed for', t.title, e); }
  }
  if(missing.length) save();
  return missing.length;
}

async function gcalListEvents(monthISO){
  const [y,m] = monthISO.split('-').map(Number);
  const timeMin = new Date(y, m-1, 1).toISOString();
  const timeMax = new Date(y, m, 1).toISOString();
  const data = await gcalRequest('GET', `/calendars/primary/events?timeMin=${encodeURIComponent(timeMin)}&timeMax=${encodeURIComponent(timeMax)}&singleEvents=true`);
  return (data.items||[]).map(e => ({
    id:e.id, title:e.summary||'(untitled event)',
    date:(e.start && (e.start.date || (e.start.dateTime||'').slice(0,10)))||null,
    source:'google'
  })).filter(e=>e.date);
}

/* ---------- Drive appDataFolder (cross-device state sync) ---------- */
async function driveRequest(method, url, opts={}){
  const token = await ensureToken(true);
  const headers = Object.assign({'Authorization':`Bearer ${token}`}, opts.headers||{});
  const res = await fetch(url, {method, headers, body:opts.body});
  if(!res.ok) throw new Error(`Drive API ${method} → ${res.status}`);
  return opts.raw ? res : res.json();
}
async function driveFindFile(){
  const data = await driveRequest('GET', `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id,modifiedTime)`);
  return (data.files && data.files[0]) || null;
}
async function driveSaveState(){
  const existing = await driveFindFile();
  const metadata = existing ? {} : {name: DRIVE_FILE_NAME, parents:['appDataFolder']};
  const boundary = 'asana_demo_boundary';
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${boundary}--`;
  const url = existing
    ? `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart`
    : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
  await driveRequest(existing?'PATCH':'POST', url, { headers:{'Content-Type':`multipart/related; boundary=${boundary}`}, body });
  S.google.lastSynced = Date.now();
  log('Synced app state to Google Drive (appDataFolder)','sync');
}
function scheduleDriveSave(){
  clearTimeout(driveSaveTimer);
  driveSaveTimer = setTimeout(() => { driveSaveState().then(render).catch(e=>console.error(e)); }, 1500);
}
/* Fetch the latest state blob from Drive WITHOUT overwriting local state —
   used at booking-confirm time to see bookings made on other devices/tabs
   so two people can't grab the same slot. Returns null if unavailable. */
async function driveFetchLatest(){
  try{
    const file = await driveFindFile();
    if(!file) return null;
    const token = await ensureToken(true);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, { headers:{'Authorization':`Bearer ${token}`} });
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}

async function driveMergeOnLoad(){
  const file = await driveFindFile();
  if(!file) { await driveSaveState(); return; } // first run — seed Drive with local state
  const remoteMod = new Date(file.modifiedTime).getTime();
  if(remoteMod > (S.updatedAt||0)){
    const token = await ensureToken(true);
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media`, { headers:{'Authorization':`Bearer ${token}`} });
    const remote = await res.json();
    remote.google = S.google; // keep local client id / connection flag authoritative
    S = remote;
    store.save(S);
    toast('Loaded newer state from Google Drive (another device)');
  } else {
    await driveSaveState();
  }
}

/* Quick-add parser: "!high/!med/!low" sets priority; "jul 10"/"tomorrow"/"today" sets due */
function quickAdd(text){
  let priority = null, due = null;
  text = text.replace(/!(high|med(ium)?|low)\b/i, (m,p) => { priority = p.toLowerCase().startsWith('med')?'medium':p.toLowerCase(); return ''; });
  text = text.replace(/\b(today|tomorrow)\b/i, m => { due = m.toLowerCase()==='today'?todayISO():addDays(todayISO(),1); return ''; });
  const mo = text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})\b/i);
  if(mo){
    const months = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
    const y = new Date().getFullYear();
    const d = new Date(y, months.indexOf(mo[1].slice(0,3).toLowerCase()), +mo[2]);
    if(d < new Date(todayISO())) d.setFullYear(y+1);
    due = iso(d); text = text.replace(mo[0],'');
  }
  const t = {id:uid(), title:text.trim()||'Untitled task', project:'', priority, start:null, due,
             section: due===todayISO() ? 'today' : (due ? 'upcoming' : 'recent'), done:false, notes:''};
  S.tasks.unshift(t);
  if(priority==='high') fireRules(t,'priority');
  save(); render(); toast('Task added'+(due?` · due ${fmtDue(due)}`:''));
}

function render(){
  document.getElementById('weeklyFocus').value = S.weeklyFocus||'';
  document.getElementById('sortSelect').value = S.sort;
  document.getElementById('syncBadge').textContent = S.externalEvents.length;
  document.querySelectorAll('.view-tabs button').forEach(b => b.classList.toggle('active', b.dataset.view===S.view));
  document.getElementById('sortWrap').style.visibility = (S.view==='list') ? 'visible':'hidden';
  const m = document.getElementById('main');
  if(S.view==='list') m.innerHTML = renderList();
  else if(S.view==='board') m.innerHTML = renderBoard();
  else if(S.view==='calendar'){ m.innerHTML = renderCalendar(); maybePullRealEvents(); }
  else if(S.view==='book') m.innerHTML = renderBook();
  else m.innerHTML = renderSync();
  wireDynamic();
}

/* Pull real Google Calendar events for the visible month, once, then
   re-render with them merged into S.externalEvents so the same chip
   rendering code in renderCalendar() works for both modes. */
let pulledMonth = null;
function maybePullRealEvents(){
  if(!(S.google.connected && S.google.clientId)) return;
  if(pulledMonth===S.calMonth) return;
  pulledMonth = S.calMonth;
  gcalListEvents(S.calMonth).then(events => {
    S.externalEvents = events; // real events replace the simulated list while connected
    render();
  }).catch(e => console.error(e));
}

function subPill(t){
  const st = t.subtasks||[];
  if(!st.length) return '';
  const done = st.filter(s=>s.done).length;
  return `<span class="pill progress ${done===st.length?'complete':''}" title="Subtasks completed">${done}/${st.length}</span>`;
}
function taskRow(t){
  const dueCls = !t.due ? '' : (t.due < todayISO() && !t.done ? 'overdue' : (t.due===todayISO() ? 'today':''));
  const synced = t.due && !t.done;
  return `<div class="task-row ${t.done?'done':''}" data-id="${t.id}" role="button" tabindex="0">
    <button class="checkbox ${t.done?'checked':''}" data-check="${t.id}" aria-label="Complete task">
      <svg viewBox="0 0 12 12" fill="none"><path d="M2 6.5 4.8 9 10 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="t-title">${esc(t.title)}</span>
    ${t.project?`<span class="pill project">${esc(t.project)}</span>`:''}
    ${subPill(t)}
    ${t.priority?`<span class="pill p-${t.priority}">${PRI_LABEL[t.priority]}</span>`:''}
    ${synced?`<span class="pill synced" title="Has a due date → appears in calendar views and the ICS feed">⇄ feed</span>`:''}
    <span class="t-due ${dueCls}">${fmtDue(t.due)}</span>
  </div>`;
}

function sortedTasks(){
  const ts = [...S.tasks];
  if(S.sort==='priority') ts.sort((a,b) => (PRI_ORDER[a.priority]-PRI_ORDER[b.priority]) || ((a.due||'9999')<(b.due||'9999')?-1:1));
  else if(S.sort==='due') ts.sort((a,b) => (a.due||'9999') < (b.due||'9999') ? -1 : 1);
  return ts;
}

function renderList(){
  if(S.sort!=='none'){
    const label = S.sort==='priority' ? 'Priority → due date' : 'Due date';
    return `<div class="section-block"><div class="section-head">Sorted by ${label}</div>
      ${sortedTasks().map(taskRow).join('') || '<div class="empty-note">No tasks yet.</div>'}</div>`;
  }
  const sections = [['today','Today'],['upcoming','Upcoming'],['later','Later'],['recent','Recently assigned']];
  return sections.map(([key,label]) => {
    const ts = S.tasks.filter(t => t.section===key);
    return `<div class="section-block">
      <div class="section-head">${label} <span class="count">${ts.length}</span></div>
      ${ts.map(taskRow).join('') || '<div class="empty-note">Nothing here — drag a card in Board view or add a task.</div>'}
    </div>`;
  }).join('');
}

function renderCalendar(){
  const [y,m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m-1, 1);
  const startDow = (first.getDay()+6)%7; // Monday first
  const daysIn = new Date(y, m, 0).getDate();
  const prevDays = new Date(y, m-1, 0).getDate();
  const cells = [];
  for(let i=startDow-1;i>=0;i--) cells.push({d:prevDays-i, other:true, iso:iso(new Date(y,m-2,prevDays-i))});
  for(let d=1;d<=daysIn;d++) cells.push({d, other:false, iso:iso(new Date(y,m-1,d))});
  while(cells.length%7) cells.push({d:cells.length, other:true, iso:iso(new Date(y,m,cells.length-daysIn-startDow+1))});

  const unsched = S.tasks.filter(t => !t.due && !t.done);
  const monthName = first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const T = todayISO();

  return `<div class="cal-layout">
    <div class="unsched" id="unschedZone">
      <h3>Unscheduled tasks</h3>
      <p class="hint">Drag a task onto a date to set its due date — the calendar, list, board and ICS feed all update from that single field. Drop a scheduled chip back here to unschedule it.</p>
      ${unsched.map(boardCard).join('') || '<div class="empty-note">Everything has a date. 🎉</div>'}
    </div>
    <div class="cal-panel">
      <div class="cal-head">
        <button class="cal-nav" data-nav="-1" aria-label="Previous month">‹</button>
        <h3>${monthName}</h3>
        <button class="cal-nav" data-nav="1" aria-label="Next month">›</button>
        <div class="cal-show-toggle">
          <button data-show="personal" class="${S.calShow==='personal'?'active':''}">Personal</button>
          <button data-show="professional" class="${S.calShow==='professional'?'active':''}">Professional</button>
          <button data-show="both" class="${S.calShow==='both'?'active':''}">Both</button>
        </div>
      </div>
      <div class="cal-legend">
        <span class="key"><span class="swatch" style="background:var(--hi)"></span>High</span>
        <span class="key"><span class="swatch" style="background:var(--md)"></span>Medium</span>
        <span class="key"><span class="swatch" style="background:var(--lo)"></span>Low</span>
        <span class="key"><span class="swatch" style="border:1.4px dashed var(--gcal);background:#fff"></span>Google Calendar event</span>
        <span class="key"><span class="swatch" style="background:#f0e9fb"></span>Booking (professional)</span>
      </div>
      <div class="cal-grid">
        ${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(c => {
          const showPersonal = S.calShow!=='professional';
          const showPro = S.calShow!=='personal';
          const dayTasks = showPersonal ? S.tasks.filter(t => t.due===c.iso) : [];
          const dayEvents = showPersonal ? S.externalEvents.filter(e => e.date===c.iso) : [];
          const dayBookings = showPro ? S.bookings.filter(b => b.date===c.iso && b.status==='confirmed') : [];
          return `<div class="cal-cell ${c.other?'other':''} ${c.iso===T?'today-cell':''}" data-date="${c.iso}">
            <span class="daynum">${c.d}</span>
            ${dayTasks.map(t=>`<button class="cal-chip p-${t.priority||'none'} ${t.done?'done':''}" draggable="true" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}
            ${dayEvents.map(e=>`<span class="cal-chip gcal-event" title="Lives on the external Google Calendar — created by a rule">${esc(e.title)}</span>`).join('')}
            ${dayBookings.map(b=>{const et=S.eventTypes.find(x=>x.id===b.eventTypeId); return `<button class="cal-chip booking" data-bkid="${b.id}" title="${esc((et?et.name:'Booking'))} with ${esc(b.inviteeName)} at ${b.start}">${b.start} ${esc(b.inviteeName)}</button>`;}).join('')}
          </div>`;
        }).join('')}

    </div>
  </div>`;
}

/* =====================================================================
   SUPABASE — shared backend for BOOKINGS ONLY. This is the "one place
   all bookings live" that a static, per-browser app otherwise can't have.
   Public booking pages read/write here so strangers' bookings are visible
   to each other and to you. Uses the REST (PostgREST) endpoint directly —
   no SDK, no build step. The anon key is safe in the client because Row
   Level Security policies (see setup SQL) restrict what each role can do.
   Tasks / notes / availability / event types stay local + Drive; only
   bookings need sharing.
   ===================================================================== */
function sbConfigured(){ return !!(S.supabase && S.supabase.url && S.supabase.anonKey); }
function sbHeaders(){
  return { 'apikey':S.supabase.anonKey, 'Authorization':`Bearer ${S.supabase.anonKey}`, 'Content-Type':'application/json' };
}
/* Host-privileged requests add your secret key header; DB policies verify it.
   The key is stored only in your browser (+ your private Drive backup) —
   never in the repo, never sent to visitors. */
function sbHostHeaders(){
  const h = sbHeaders();
  if(S.supabase.hostKey) h['x-host-key'] = S.supabase.hostKey;
  return h;
}
async function sbRequest(method, path, body, extraHeaders){
  const url = S.supabase.url.replace(/\/$/,'') + '/rest/v1' + path;
  const res = await fetch(url, { method, headers: Object.assign(sbHeaders(), extraHeaders||{}), body: body?JSON.stringify(body):undefined });
  if(!res.ok){ const t = await res.text().catch(()=> ''); throw new Error(`Supabase ${method} ${path} → ${res.status} ${t}`); }
  return res.status===204 ? null : res.json();
}
/* Public read: only the columns needed to compute free/busy — NOT invitee
   PII. The RLS policy also restricts the anon role to these. */
async function sbBookedSlotsForDate(dateISO){
  if(!sbConfigured()) return [];
  try{
    const rows = await sbRequest('GET', `/bookings_busy?select=start_time,end_time&date=eq.${dateISO}`);
    return rows.map(r => ({ start: r.start_time.slice(0,5), end: r.end_time.slice(0,5) }));
  }catch(e){ console.warn('Supabase read failed', e); return []; }
}
/* Public insert of a new booking. Returns the created row (with id). */
async function sbInsertBooking(b, et){
  const row = {
    id: b.id, event_type_id: et.id, event_type_name: et.name,
    date: b.date, start_time: b.start+':00', end_time: b.end+':00',
    invitee_name: b.inviteeName, invitee_email: b.inviteeEmail,
    note: b.note||'', status:'confirmed'
  };
  const res = await sbRequest('POST', '/bookings', row, {'Prefer':'return=representation'});
  return res && res[0];
}
/* Host read: full booking rows including invitee PII. Works from your
   browser; the RLS policy can gate this to a shared secret header if you
   want stricter privacy (see SQL comments). */
async function sbFetchAllBookings(){
  if(!sbConfigured()) return null;
  try{
    const rows = await sbRequest('GET', '/bookings?select=*&order=date.asc', null, S.supabase.hostKey?{'x-host-key':S.supabase.hostKey}:{});
    return rows.map(r => ({
      id:r.id, eventTypeId:r.event_type_id, eventTypeName:r.event_type_name,
      date:r.date, start:r.start_time.slice(0,5), end:r.end_time.slice(0,5),
      inviteeName:r.invitee_name, inviteeEmail:r.invitee_email, note:r.note,
      status:r.status, gcalEventId:r.gcal_event_id||null, createdAt:r.created_at
    }));
  }catch(e){ console.warn('Supabase host fetch failed', e); return null; }
}
async function sbUpdateBooking(id, patch){
  if(!sbConfigured()) return;
  try{ await sbRequest('PATCH', `/bookings?id=eq.${id}`, patch, S.supabase.hostKey?{'x-host-key':S.supabase.hostKey}:{}); }catch(e){ console.warn('Supabase update failed', e); }
}

/* Publish the host's scheduling config (event types + availability) to a
   single-row 'schedule_config' table, so a stranger's browser — which has
   no local state — can load the public booking page. Call this whenever
   event types or availability change. */
async function sbPublishConfig(){
  if(!sbConfigured()) return;
  const payload = {
    id: 1,
    event_types: S.eventTypes,
    availability: S.availability,
    updated_at: new Date().toISOString()
  };
  try{
    const hdrs = {'Prefer':'resolution=merge-duplicates'};
    if(S.supabase.hostKey) hdrs['x-host-key'] = S.supabase.hostKey;
    await sbRequest('POST', '/schedule_config', payload, hdrs);
  }catch(e){ console.warn('Supabase config publish failed', e); }
}
/* Public read of the host's config (used by the standalone booking page). */
async function sbFetchConfig(){
  if(!sbConfigured()) return null;
  try{
    const rows = await sbRequest('GET', '/schedule_config?select=*&id=eq.1');

/* =====================================================================
   BOOK TAB — Calendly-style scheduling: event types (reusable meeting
   templates), a weekly availability schedule with buffers/overrides, and
   a public booking page that computes real open slots — checking your
   actual Google Calendar free/busy time when connected, exactly like
   Calendly's "connect your calendar" feature. Confirmed bookings become
   real timed Google Calendar events; this is the "professional calendar"
   layer that sits alongside the personal due-date calendar.
   ===================================================================== */

const DOW_KEYS = ['sun','mon','tue','wed','thu','fri','sat'];
const DOW_LABEL = {sun:'Sunday',mon:'Monday',tue:'Tuesday',wed:'Wednesday',thu:'Thursday',fri:'Friday',sat:'Saturday'};

function slugify(s){ return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid(); }
function timeToMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function minToTime(m){ return `${pad(Math.floor(m/60))}:${pad(m%60)}`; }
function publicBookingUrl(et){ return `${location.origin}${location.pathname}#book/${et.slug}`; }

/* Real Google Calendar free/busy check — the actual mechanism Calendly
   uses once you "connect your calendar". Returns busy [start,end] minute
   ranges (in minutes-from-midnight) for a given date, or [] if not
   connected (falls back to only checking bookings already in S.bookings). */
async function gcalBusyRangesForDate(dateISO){
  if(!(S.google.connected && S.google.clientId)) return [];
  try{
    const token = await ensureToken(true);
    const timeMin = new Date(dateISO+'T00:00:00').toISOString();
    const timeMax = new Date(dateISO+'T23:59:59').toISOString();
    const res = await fetch('https://www.googleapis.com/calendar/v3/freeBusy', {
      method:'POST', headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body: JSON.stringify({ timeMin, timeMax, items:[{id:'primary'}] })
    });
    if(!res.ok) return [];
    const data = await res.json();
    const busy = (data.calendars && data.calendars.primary && data.calendars.primary.busy) || [];
    return busy.map(b => ({ start: minutesFromMidnight(b.start), end: minutesFromMidnight(b.end) }));
  }catch(e){ console.warn('freeBusy check failed, falling back to bookings-only', e); return []; }
}
function minutesFromMidnight(iso){
  const d = new Date(iso);
  return d.getHours()*60 + d.getMinutes();
}

/* Core slot computation — mirrors Calendly's engine: weekly window minus
   buffer minus existing bookings minus (optionally) real Google busy time
   minus minimum-notice minus per-day booking limit. */
async function computeSlotsForDate(eventType, dateISO){
  const dow = DOW_KEYS[new Date(dateISO+'T00:00').getDay()];
  const day = S.availability.weekly[dow];
  if(!day || !day.enabled) return [];
  if(S.availability.overrides[dateISO] && S.availability.overrides[dateISO].blocked) return [];

  const now = new Date();
  const isToday = dateISO===todayISO();
  const minNoticeMin = now.getTime() + S.availability.minNoticeHours*3600000;

  // Booked slots come from Supabase (shared across all visitors) when
  // configured; otherwise fall back to whatever this browser knows locally.
  let dayBusy;
  if(sbConfigured()){
    dayBusy = await sbBookedSlotsForDate(dateISO);
  } else {
    dayBusy = S.bookings.filter(b => b.date===dateISO && b.status==='confirmed')
                        .map(b => ({start:b.start, end:b.end}));
  }
  if(S.availability.dailyLimit && dayBusy.length >= S.availability.dailyLimit) return [];

  const busy = dayBusy.map(b => ({start:timeToMin(b.start), end:timeToMin(b.end)}));
  const gcalBusy = await gcalBusyRangesForDate(dateISO);
  const allBusy = busy.concat(gcalBusy);

  const step = eventType.duration; // start-time increment = event duration (simple, matches most Calendly setups)
  const slots = [];
  for(let t=timeToMin(day.start); t+eventType.duration<=timeToMin(day.end); t+=step){
    const slotStart = t, slotEnd = t+eventType.duration;
    const bufferedStart = slotStart - eventType.buffer, bufferedEnd = slotEnd + eventType.buffer;
    const conflicts = allBusy.some(b => bufferedStart < b.end && bufferedEnd > b.start);
    if(conflicts) continue;
    const slotDateTime = new Date(dateISO+'T'+minToTime(slotStart));
    if(isToday && slotDateTime.getTime() < minNoticeMin) continue;
    if(!isToday && slotDateTime.getTime() < minNoticeMin && slotDateTime.toDateString()===now.toDateString()) continue;
    slots.push(minToTime(slotStart));
  }
  return slots;
}

/* ---------- Event type CRUD ---------- */
function upsertEventType(data, id){
  if(id){
    const et = S.eventTypes.find(x=>x.id===id); Object.assign(et, data);
  } else {
    S.eventTypes.push(Object.assign({id:uid(), slug:slugify(data.name), active:true}, data));
  }
  save(); sbPublishConfig(); render();
}
function deleteEventType(id){
  S.eventTypes = S.eventTypes.filter(x=>x.id!==id);
  save(); sbPublishConfig(); render();
}
function toggleEventType(id){
  const et = S.eventTypes.find(x=>x.id===id); et.active = !et.active; save(); sbPublishConfig(); render();
}

/* ---------- Booking creation / cancellation (host side) ---------- */
async function gcalCreateTimedEvent(booking, et){
  const startISO = `${booking.date}T${booking.start}:00`;
  const endISO = `${booking.date}T${booking.end}:00`;
  const body = {
    summary: `${et.name} — ${booking.inviteeName}`,
    description: `Booked via My Tasks scheduling page.\n${et.description||''}${booking.note?'\n\nInvitee note: '+booking.note:''}`,
    start:{dateTime:startISO, timeZone:S.availability.timezone},
    end:{dateTime:endISO, timeZone:S.availability.timezone},
    attendees: booking.inviteeEmail ? [{email:booking.inviteeEmail}] : []
  };
  const ev = await gcalRequest('POST','/calendars/primary/events?sendUpdates=all', body);
  booking.gcalEventId = ev.id;
}
function cancelBooking(id){
  const b = S.bookings.find(x=>x.id===id); if(!b) return;
  b.status = 'cancelled';
  if(S.google.connected && b.gcalEventId){
    gcalRequest('DELETE', `/calendars/primary/events/${b.gcalEventId}`).catch(e=>console.error(e));
  }
  if(sbConfigured()) sbUpdateBooking(id, {status:'cancelled'}); // reopens the slot for other invitees
  save(); render(); toast('Booking cancelled');
}

   strangers made reach you), merge into local state, and — per your chosen
   model — create a real Google Calendar event for any confirmed booking
   that doesn't have one yet, writing the event id back to Supabase so it's
   not recreated next time. Guarded so it runs at most once per tab-open. */
let meetingsSyncing = false, meetingsSyncedOnce = false;
async function maybeSyncMeetings(force){
  if(meetingsSyncing) return;
  if(meetingsSyncedOnce && !force) return;
  meetingsSyncing = true;
  try{
    const remote = await sbFetchAllBookings();
    if(remote){
      S.bookings = remote;            // Supabase is the source of truth for bookings
      save();
    }
    // Create missing calendar events for confirmed bookings (needs your Google login)
    if(S.google.connected){
      let created = 0;
      for(const b of S.bookings.filter(x => x.status==='confirmed' && !x.gcalEventId)){
        const et = S.eventTypes.find(x=>x.id===b.eventTypeId) || {name:b.eventTypeName||'Meeting', description:''};
        try{
          await gcalCreateTimedEvent(b, et);
          if(sbConfigured()) await sbUpdateBooking(b.id, {gcal_event_id:b.gcalEventId});
          created++;
        }catch(e){ console.error('calendar create failed for booking', b.id, e); }
      }
      if(created){ save(); toast(`Added ${created} booking${created===1?'':'s'} to your Google Calendar`); }
    }
    meetingsSyncedOnce = true;
    render();
  }catch(e){ console.error('meeting sync failed', e); }
  finally{ meetingsSyncing = false; }
}

/* ---------- Public booking page (standalone) ---------- */
let pubState = { et:null, date:null, slots:[], selectedTime:null, step:'date' };

async function renderPublicBooking(slug){
  const root = document.getElementById('publicBookingRoot');
  root.innerHTML = `<div class="pub-card"><div class="pub-body"><p style="color:var(--ink-soft)">Loading…</p></div></div>`;

  // A stranger's browser has empty local state. Pull the host's published
  // config (event types + availability) from Supabase so the page works.
  // BUILD_SUPABASE is an optional embedded fallback so the deployed public
  // link carries the backend creds even in a fresh browser.
  if((!S.supabase.url || !S.supabase.anonKey) && typeof BUILD_SUPABASE!=='undefined' && BUILD_SUPABASE.url){
    S.supabase = { url:BUILD_SUPABASE.url, anonKey:BUILD_SUPABASE.anonKey };
  }
  if(sbConfigured() && (!S.eventTypes || !S.eventTypes.length || !S.eventTypes.some(e=>e.slug===slug))){
    const cfg = await sbFetchConfig();
    if(cfg){ S.eventTypes = cfg.eventTypes || S.eventTypes; S.availability = cfg.availability || S.availability; }
  }

  const et = S.eventTypes.find(x => x.slug===slug && x.active);
  if(!et){
    const extra = sbConfigured() ? '.' : ', or the booking backend is not reachable.';
    root.innerHTML = `<div class="pub-card"><div class="pub-body"><h2 style="font-family:'Sora'">Scheduling page not found</h2><p style="color:var(--ink-soft)">This event type does not exist or is not active${extra}</p></div></div>`;
    return;
  }
  if(pubState.et !== et.id){ pubState = { et: et.id, date:null, slots:[], selectedTime:null, step:'date' }; }

  const dates = [];
  for(let i=0;i<14;i++) dates.push(addDays(todayISO(), i));
  if(!pubState.date) pubState.date = dates.find(d => {
    const dow = DOW_KEYS[new Date(d+'T00:00').getDay()];
    return S.availability.weekly[dow].enabled && !(S.availability.overrides[d]&&S.availability.overrides[d].blocked);
  }) || dates[0];

  root.innerHTML = `<div class="pub-card">
    <div class="pub-head">
      <span class="evt-dot" style="background:${et.color}"></span>
      <div>
        <h2>${esc(et.name)}</h2>
        <p>${esc(et.description)}</p>
        <div class="pub-meta"><span>⏱ ${et.duration} min</span><span>📍 ${et.locationType==='video'?'Video call':et.locationType==='phone'?'Phone call':'In person'}</span><span>🌐 ${esc(S.availability.timezone)}</span></div>
      </div>
    </div>
    <div class="pub-body" id="pubBody">Loading availability…</div>
    <div class="pub-footer-link">Powered by your own My Tasks scheduling page — no third-party service involved.</div>
  </div>`;
  await renderPubStep();
}

async function renderPubStep(){
  const et = S.eventTypes.find(x=>x.id===pubState.et);
  const body = document.getElementById('pubBody');
  if(pubState.step==='confirmed'){
    const b = pubState.confirmedBooking;
    const gUrl = googleAddUrl(et, b);
    body.innerHTML = `<div class="pub-confirm">
      <div class="check-big">✓</div>
      <h2>You're booked!</h2>
      <p>${esc(et.name)} with you on ${new Date(b.date+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} at ${b.start}.</p>
      <div class="btn-row" style="justify-content:center">
        <a class="btn blue" href="${gUrl}" target="_blank" rel="noopener">Add to Google Calendar</a>
        <button class="btn ghost" id="pubIcsBtn">Download .ics</button>
      </div>
    </div>`;
    document.getElementById('pubIcsBtn').addEventListener('click', () => download(`${et.slug}.ics`, icsForBooking(et,b), 'text/calendar'));
    return;
  }

  const dates = []; for(let i=0;i<14;i++) dates.push(addDays(todayISO(), i));
  const dateStrip = `<div class="pub-dates">${dates.map(d => {
    const dow = DOW_KEYS[new Date(d+'T00:00').getDay()];
    const blocked = !S.availability.weekly[dow].enabled || (S.availability.overrides[d]&&S.availability.overrides[d].blocked);
    const dt = new Date(d+'T00:00');
    return `<button class="pub-date-btn ${d===pubState.date?'active':''}" data-pubdate="${d}" ${blocked?'disabled':''}>
      <span class="d">${dt.toLocaleDateString(undefined,{weekday:'short'})}</span>${dt.getDate()}
    </button>`;
  }).join('')}</div>`;

  if(pubState.step==='form'){
    body.innerHTML = dateStrip + `
      <div class="pub-form">
        <p style="font-size:.85rem;margin-bottom:14px"><b>${new Date(pubState.date+'T00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} at ${pubState.selectedTime}</b> · <button id="pubBack" style="color:var(--accent);font-weight:600">change time</button></p>
        <div class="field"><label>Name</label><input id="pfName" type="text" placeholder="Your name"></div>
        <div class="field"><label>Email</label><input id="pfEmail" type="email" placeholder="you@example.com"></div>
        ${et.questionLabel ? `<div class="field"><label>${esc(et.questionLabel)}</label><textarea id="pfNote"></textarea></div>` : ''}
        <button class="btn accent" id="pfConfirm" style="width:100%;padding:11px">Confirm booking</button>
      </div>`;
    wirePublic();
    return;
  }

  body.innerHTML = dateStrip + `<div id="pubSlotsWrap">Loading times…</div>`;
  wirePublic();
  const slots = await computeSlotsForDate(et, pubState.date);
  const wrap = document.getElementById('pubSlotsWrap');
  if(!wrap) return; // user navigated away before slots resolved
  wrap.innerHTML = slots.length
    ? `<div class="pub-slots">${slots.map(s=>`<button class="pub-slot-btn" data-pubslot="${s}">${s}</button>`).join('')}</div>`
    : `<div class="empty-note">No open times this day — try another date.</div>`;
  wirePublic();
}

function googleAddUrl(et, b){
  const start = `${b.date.replace(/-/g,'')}T${b.start.replace(':','')}00`;
  const end = `${b.date.replace(/-/g,'')}T${b.end.replace(':','')}00`;
  const params = new URLSearchParams({ action:'TEMPLATE', text:`${et.name} with ${b.inviteeName}`, dates:`${start}/${end}`, details: et.description||'' });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}
function icsForBooking(et, b){
  const stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const s = `${b.date.replace(/-/g,'')}T${b.start.replace(':','')}00`;
  const e = `${b.date.replace(/-/g,'')}T${b.end.replace(':','')}00`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AsanaDemo//Booking//EN','BEGIN:VEVENT',
    `UID:${b.id}@asana-demo`, `DTSTAMP:${stamp}`, `DTSTART:${s}`, `DTEND:${e}`,
    `SUMMARY:${et.name} with ${b.inviteeName}`, `DESCRIPTION:${(et.description||'').replace(/\n/g,'\\n')}`,
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
}

function wirePublic(){
  document.querySelectorAll('[data-pubdate]').forEach(b => b.addEventListener('click', () => { pubState.date = b.dataset.pubdate; pubState.step='date'; renderPubStep(); }));
  document.querySelectorAll('[data-pubslot]').forEach(b => b.addEventListener('click', () => { pubState.selectedTime = b.dataset.pubslot; pubState.step='form'; renderPubStep(); }));
  const back = document.getElementById('pubBack');
  if(back) back.addEventListener('click', () => { pubState.step='date'; renderPubStep(); });
  const confirm = document.getElementById('pfConfirm');
  if(confirm) confirm.addEventListener('click', async () => {
    const name = document.getElementById('pfName').value.trim();
    const email = document.getElementById('pfEmail').value.trim();
    if(!name || !email){ toast('Name and email are required'); return; }
    const et = S.eventTypes.find(x=>x.id===pubState.et);
    const noteEl = document.getElementById('pfNote');

    confirm.disabled = true; confirm.textContent = 'Checking availability…';

    // Final conflict re-check against the shared source of truth
    // (Supabase when configured, else local/Drive). This closes the
    // double-booking window: the slot list may be stale, so re-verify now.
    const freshSlots = await computeSlotsForDate(et, pubState.date);
    if(!freshSlots.includes(pubState.selectedTime)){
      confirm.disabled = false; confirm.textContent = 'Confirm booking';
      toast('Sorry — that time was just taken. Pick another.');
      pubState.step = 'date'; pubState.selectedTime = null;
      renderPubStep();
      return;
    }

    const b = { id:uid(), eventTypeId:et.id, date:pubState.date, start:pubState.selectedTime,
      end:minToTime(timeToMin(pubState.selectedTime)+et.duration), inviteeName:name, inviteeEmail:email,
      note: noteEl?noteEl.value.trim():'', status:'confirmed', gcalEventId:null, createdAt:todayISO() };

    confirm.textContent = 'Booking…';

    if(sbConfigured()){
      // Shared backend path: write to Supabase so YOU (and every other
      // visitor) can see it. The invitee's browser doesn't touch your
      // Google Calendar — you'll sync it from your Meetings tab.
      try{
        await sbInsertBooking(b, et);
      }catch(e){
        console.error(e);
        confirm.disabled = false; confirm.textContent = 'Confirm booking';
        toast('Could not save booking — please try again.');
        return;
      }
    } else {
      // Local-only fallback (no backend configured).
      S.bookings.push(b);
      if(S.google.connected){ try{ await gcalCreateTimedEvent(b, et); }catch(e){ console.error(e); } }
      save();
    }

    pubState.step = 'confirmed'; pubState.confirmedBooking = b;
    renderPubStep();
  });
}

    if(!/^https:\/\/.+\.supabase\.co\/?$/.test(url)){ toast('URL should look like https://xxxx.supabase.co — copy it from Project Settings → API'); return; }
    const prev = {url:S.supabase.url, anonKey:S.supabase.anonKey, hostKey:S.supabase.hostKey};
    S.supabase = {url, anonKey:key, hostKey: document.getElementById('sbHostKey').value.trim()};
    try{
      const res = await fetch(url.replace(/\/$/,'')+'/rest/v1/bookings_busy?select=date&limit=1', {headers: sbHeaders()});
      if(res.ok){
        // Reached the backend. Now verify the HOST KEY by attempting the
        // privileged config write (policies reject it with 403 if wrong).
        const hdrs = Object.assign(sbHeaders(), {'Prefer':'resolution=merge-duplicates'});
        if(S.supabase.hostKey) hdrs['x-host-key'] = S.supabase.hostKey;
        const cfgRes = await fetch(url.replace(/\/$/,'')+'/rest/v1/schedule_config', {
          method:'POST', headers:hdrs,
          body: JSON.stringify({id:1, event_types:S.eventTypes, availability:S.availability, updated_at:new Date().toISOString()})

        if(cfgRes.ok){
          save(); toast('✓ Backend + host key verified — config published'); render();

          S.supabase = prev;
          toast('Backend reachable, but the HOST KEY is wrong — it must match the value in your SQL app_secrets table');
        } else {
          S.supabase = prev;
          toast(`Config publish failed (${cfgRes.status}) — did you run the full setup SQL?`);
        }
      } else {
        S.supabase = prev;
        if(res.status===404) toast('Reached Supabase, but tables are missing — run the setup SQL in the SQL Editor');
        else if(res.status===401||res.status===403) toast('Reached Supabase, but the anon key was rejected — re-copy it (Project Settings → API)');
        else toast(`Supabase responded with error ${res.status} — see console`);
        console.error('Supabase test failed', res.status, await res.text().catch(()=>''));
      }
    }catch(e){
      S.supabase = prev;
      console.error(e);
      toast('Could not reach that URL at all — check the Project URL and your internet connection');
    }
  });
  const gs = document.getElementById('btnSyncNow');
  if(gs) gs.addEventListener('click', async () => {

  document.querySelectorAll('[data-booksub]').forEach(b => b.addEventListener('click', () => { S.bookView = b.dataset.booksub; save(); render(); }));

  // book tab — event types
  const bne = document.getElementById('btnNewEvt');

  document.querySelectorAll('[data-toggleevt]').forEach(b => b.addEventListener('click', () => toggleEventType(b.dataset.toggleevt)));
  document.querySelectorAll('[data-copyevt]').forEach(b => b.addEventListener('click', async () => {
    const et = S.eventTypes.find(x=>x.id===b.dataset.copyevt);
    try{ await navigator.clipboard.writeText(publicBookingUrl(et)); toast('Booking link copied'); }
    catch(e){ toast(publicBookingUrl(et)); }
  }));

  // book tab — availability
  document.querySelectorAll('[data-avday]').forEach(cb => cb.addEventListener('change', () => { S.availability.weekly[cb.dataset.avday].enabled = cb.checked; save(); sbPublishConfig(); render(); }));
  document.querySelectorAll('[data-avstart]').forEach(i => i.addEventListener('change', () => { S.availability.weekly[i.dataset.avstart].start = i.value; save(); sbPublishConfig(); }));

  });
  const avBlockBtn = document.getElementById('avBlockBtn');
  if(avBlockBtn) avBlockBtn.addEventListener('click', () => {
    const d = document.getElementById('avBlockDate').value; if(!d) return;
    S.availability.overrides[d] = {blocked:true}; save(); render();
  });
  document.querySelectorAll('[data-unblock]').forEach(b => b.addEventListener('click', () => { delete S.availability.overrides[b.dataset.unblock]; save(); render(); }));
